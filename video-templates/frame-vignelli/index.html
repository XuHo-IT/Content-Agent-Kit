<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1920, height=1080" />
        <title>Vignelli Stat · 16:9</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=JetBrains+Mono:wght@700;800&family=Playfair+Display:ital,wght@0,900;1,900&display=swap"
            rel="stylesheet"
        />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { width: 1920px; height: 1080px; overflow: hidden; background: #facc15; }
            #root {
                position: relative; width: 1920px; height: 1080px;
                background: #facc15; color: #090d16;
                font-family: "Archivo", sans-serif;
                overflow: hidden; padding: 80px 140px;
                display: flex; flex-direction: column; justify-content: space-between;
            }

            .grid {
                position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, 1fr);
                z-index: 1; pointer-events: none;
            }
            .grid .col { border-right: 1px solid rgba(0,0,0,0.06); }

            .red-col {
                position: absolute; top: 0; right: 0; width: 240px; height: 100%;
                background: #dc2626; z-index: 2;
                transform: scaleY(0); transform-origin: top;
                animation: colDrop 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }

            .content {
                position: relative; z-index: 3; max-width: 1200px;
            }

            .kicker {
                display: inline-flex; align-items: center; gap: 12px;
                font-family: "JetBrains Mono", monospace; font-size: 20px; font-weight: 800;
                color: #dc2626; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 24px;
            }
            .kicker .bar { width: 24px; height: 4px; background: #dc2626; }

            .number {
                font-family: "Playfair Display", serif; font-size: 160px; font-weight: 900;
                color: #090d16; line-height: 0.95; letter-spacing: -0.04em;
                opacity: 0; animation: numPop 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
            }

            .label {
                font-size: 48px; font-weight: 900; color: #090d16;
                text-transform: uppercase; letter-spacing: -0.01em; margin-top: 20px;
                opacity: 0; animation: numPop 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
            }

            .note {
                font-size: 26px; font-weight: 700; color: #374151; max-width: 700px;
                line-height: 1.4; margin-top: 16px;
                opacity: 0; animation: numPop 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
            }

            .brand {
                position: relative; z-index: 3;
                font-family: "JetBrains Mono", monospace; font-size: 18px; font-weight: 700;
                color: #6b7280; text-transform: uppercase;
            }

            @keyframes colDrop { to { transform: scaleY(1); } }
            @keyframes numPop { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
        </style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="5"
            data-width="1920"
            data-height="1080"
            data-composition-variables='{"kicker":"Khảo sát · 2026","number":"62%","label":"Nội dung tĩnh mất hút","note":"Phần lớn người xem lướt qua nội dung tĩnh chỉ trong vài giây đầu.","brand":""}'
        >
            <div class="grid">
                <div class="col"></div>
                <div class="col"></div>
                <div class="col"></div>
                <div class="col"></div>
                <div class="col"></div>
                <div class="col"></div>
            </div>
            <div class="red-col"></div>

            <div class="content">
                <div class="kicker">
                    <span class="bar"></span><span class="txt"></span>
                </div>
                <div class="number"></div>
                <div class="label"></div>
                <div class="note"></div>
            </div>

            <div class="brand"></div>
        </div>

        <script>
            (function () {
                var v = window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                    ? window.__hyperframes.getVariables() : {};
                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null && String(text).length) el.textContent = String(text);
                };
                var drop = function (sel) {
                    var el = document.querySelector(sel);
                    if (el) el.remove();
                };
                set(".txt", v.kicker || "");
                set(".number", v.number || "");
                set(".label", v.label || "");
                set(".note", v.note || "");
                if (v.brand && String(v.brand).trim()) set(".brand", v.brand);
                else drop(".brand");
            })();
        </script>
    </body>
</html>
