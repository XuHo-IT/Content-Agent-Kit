<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1080, height=1920" />
        <title>Vox Data Callout · 9:16</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;900&family=Playfair+Display:wght@900&family=Space+Mono:wght@700&display=swap"
            rel="stylesheet"
        />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f4f1ea; }
            #root {
                position: relative; width: 1080px; height: 1920px;
                background: #f4f1ea; color: #111111;
                font-family: "Be Vietnam Pro", sans-serif;
                overflow: hidden;
            }

            .grid-bg {
                position: absolute; inset: 0;
                background-image: linear-gradient(to right, rgba(17,17,17,0.05) 1px, transparent 1px),
                                  linear-gradient(to bottom, rgba(17,17,17,0.05) 1px, transparent 1px);
                background-size: 60px 60px;
                pointer-events: none;
            }

            .crosshair { position: absolute; width: 24px; height: 24px; opacity: 0.4; }
            .crosshair::before { content: ""; position: absolute; top: 11px; left: 0; right: 0; height: 2px; background: #111; }
            .crosshair::after { content: ""; position: absolute; left: 11px; top: 0; bottom: 0; width: 2px; background: #111; }
            .ch1 { top: 60px; left: 60px; }
            .ch2 { top: 60px; right: 60px; }
            .ch3 { bottom: 60px; left: 60px; }
            .ch4 { bottom: 60px; right: 60px; }

            .header-bar {
                position: absolute; top: 120px; left: 80px; right: 80px;
                display: flex; align-items: center; justify-content: space-between;
                border-bottom: 2px solid #111111; padding-bottom: 18px;
                opacity: 0; animation: fadeDown 0.5s ease-out 0.1s both;
            }
            .kicker-tag {
                font-family: "Space Mono", monospace; font-size: 22px; font-weight: 700;
                letter-spacing: 2px; text-transform: uppercase; color: #e53935;
            }
            .tech-code {
                font-family: "Space Mono", monospace; font-size: 18px; color: #666660;
            }

            .main-layout {
                position: absolute; top: 220px; left: 80px; right: 80px; bottom: 180px;
                display: flex; flex-direction: column; justify-content: center; gap: 48px;
            }

            .stat-hero {
                display: flex; flex-direction: column;
                opacity: 0; animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both;
            }
            .stat-num {
                font-family: "Playfair Display", serif; font-size: 190px; font-weight: 900;
                line-height: 0.9; color: #111111; letter-spacing: -0.04em;
                margin-bottom: 20px;
            }
            .stat-underline {
                width: 140px; height: 12px; background: #ffe600;
                margin-bottom: 24px;
                transform-origin: left; transform: scaleX(0);
                animation: drawLine 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
            }
            .stat-lbl {
                font-size: 40px; font-weight: 700; line-height: 1.3; color: #222222;
            }

            .callouts-wrap {
                display: flex; flex-direction: column; gap: 24px;
            }
            .callout-card {
                background: #ffffff; border: 2px solid #111111;
                padding: 30px 36px; box-shadow: 8px 8px 0px #111111;
                opacity: 0; animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .card-1 { animation-delay: 0.6s; }
            .card-2 { animation-delay: 0.8s; }

            .callout-header {
                display: flex; align-items: center; gap: 14px; margin-bottom: 12px;
            }
            .callout-badge {
                background: #ffe600; color: #111111; font-family: "Space Mono", monospace;
                font-size: 16px; font-weight: 700; padding: 4px 12px; text-transform: uppercase;
            }
            .callout-title {
                font-size: 30px; font-weight: 700; color: #111111;
            }
            .callout-desc {
                font-size: 26px; font-weight: 500; line-height: 1.45; color: #444440;
            }

            .footer-bar {
                position: absolute; bottom: 80px; left: 80px; right: 80px;
                display: flex; flex-direction: column; gap: 8px;
                font-family: "Space Mono", monospace; font-size: 20px; color: #666660;
                border-top: 1px solid rgba(17,17,17,0.15); padding-top: 16px;
                opacity: 0; animation: fadeIn 0.4s ease-out 0.9s both;
            }

            @keyframes fadeIn { to { opacity: 1; } }
            @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
            @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
            @keyframes drawLine { to { transform: scaleX(1); } }
        </style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="5"
            data-width="1080"
            data-height="1920"
            data-composition-variables='{"kicker":"PHÂN TÍCH DỮ LIỆU BÁO CHÍ","stat_number":"+340%","stat_label":"Tốc độ mở rộng và tiếp cận người dùng toàn cầu","callout_1_title":"Chi Phí Vận Hành","callout_1_desc":"Giảm trực tiếp 65% chi phí hạ tầng nhờ mô hình xử lý tự động mới.","callout_2_title":"Tỷ Lệ Giữ Chân","callout_2_desc":"Khách hàng trung thành tăng gấp ba lần trong sáu tháng liên tiếp.","source":"Phân tích số liệu độc lập 2026"}'
        >
            <div class="grid-bg"></div>
            <div class="crosshair ch1"></div>
            <div class="crosshair ch2"></div>
            <div class="crosshair ch3"></div>
            <div class="crosshair ch4"></div>

            <div class="header-bar">
                <div class="kicker-tag"><span class="kicker-txt"></span></div>
                <div class="tech-code"></div>
            </div>

            <div class="main-layout">
                <div class="stat-hero">
                    <div class="stat-num"></div>
                    <div class="stat-underline"></div>
                    <div class="stat-lbl"></div>
                </div>

                <div class="callouts-wrap">
                    <div class="callout-card card-1">
                        <div class="callout-header">
                            <span class="callout-badge c1-badge"></span>
                            <span class="callout-title c1-title"></span>
                        </div>
                        <div class="callout-desc c1-desc"></div>
                    </div>

                    <div class="callout-card card-2">
                        <div class="callout-header">
                            <span class="callout-badge c2-badge"></span>
                            <span class="callout-title c2-title"></span>
                        </div>
                        <div class="callout-desc c2-desc"></div>
                    </div>
                </div>
            </div>

            <div class="footer-bar">
                <div class="source-txt"></div>
                <div class="stat-verified"></div>
            </div>
        </div>

        <script>
            (function () {
                var v = window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                    ? window.__hyperframes.getVariables() : {};
                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null && String(text).trim() !== "") el.textContent = String(text);
                };
                set(".kicker-txt", v.kicker);
                set(".tech-code", "VOX // DATA");
                set(".stat-num", v.stat_number || v.number);
                set(".stat-lbl", v.stat_label || v.label);
                set(".c1-badge", "CHỈ SỐ 01");
                set(".c1-title", v.callout_1_title);
                set(".c1-desc", v.callout_1_desc);
                set(".c2-badge", "CHỈ SỐ 02");
                set(".c2-title", v.callout_2_title);
                set(".c2-desc", v.callout_2_desc);
                set(".source-txt", v.source ? "Nguồn: " + v.source : (v.source_note ? "Nguồn: " + v.source_note : ""));
                set(".stat-verified", "ĐÃ KIỂM CHỨNG CHÉO ✓");

                var s = document.querySelector(".stat-num");
                if (s && s.textContent.length > 5) s.style.fontSize = "140px";
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = { pause: function () {}, seek: function () {}, paused: function () { return true; } };
        </script>
    </body>
</html>
