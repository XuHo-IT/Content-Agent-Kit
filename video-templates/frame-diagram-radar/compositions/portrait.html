<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1080, height=1920" />
        <title>Diagram Spider Radar · 9:16</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;900&family=Space+Mono:wght@700&display=swap"
            rel="stylesheet"
        />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { width: 1080px; height: 1920px; overflow: hidden; background: #060a12; }
            #root {
                position: relative; width: 1080px; height: 1920px;
                background: #060a12; color: #f1f5f9;
                font-family: "Be Vietnam Pro", sans-serif;
                overflow: hidden; padding: 100px 70px 80px;
                display: flex; flex-direction: column; justify-content: space-between;
            }

            .header-bar {
                opacity: 0; animation: fadeDown 0.5s ease-out 0.1s both;
            }
            .kicker-tag {
                font-family: "Space Mono", monospace; font-size: 22px; font-weight: 700;
                color: #38bdf8; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 12px;
            }
            .main-title { font-size: 50px; font-weight: 900; color: #ffffff; letter-spacing: -0.02em; line-height: 1.15; }

            .legend-row {
                display: flex; gap: 24px; align-items: center; margin-top: 16px;
                font-family: "Space Mono", monospace; font-size: 18px; font-weight: 700;
            }
            .leg-item { display: flex; align-items: center; gap: 10px; }
            .leg-dot-a { width: 14px; height: 14px; background: #38bdf8; border-radius: 50%; box-shadow: 0 0 10px #38bdf8; }
            .leg-dot-b { width: 14px; height: 14px; background: #94a3b8; border-radius: 50%; }

            /* Radar Stage */
            .radar-stage {
                position: relative; width: 100%; height: 860px; margin: auto 0;
                display: flex; align-items: center; justify-content: center;
            }
            .radar-svg { width: 100%; height: 100%; }

            .radar-grid-line { stroke: rgba(255,255,255,0.12); stroke-width: 1.5; fill: none; }
            .radar-axis { stroke: rgba(255,255,255,0.18); stroke-width: 1.5; }
            .poly-b { fill: rgba(148, 163, 184, 0.2); stroke: #94a3b8; stroke-width: 2.5; }
            .poly-a {
                fill: rgba(56, 189, 248, 0.35); stroke: #38bdf8; stroke-width: 4;
                filter: drop-shadow(0 0 12px rgba(56,189,248,0.5));
                opacity: 0; animation: scaleIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
                transform-origin: 470px 430px;
            }
            .metric-label {
                font-family: "Be Vietnam Pro", sans-serif; font-size: 20px; font-weight: 700;
                fill: #cbd5e1; text-anchor: middle; dominant-baseline: middle;
            }

            .verdict-card {
                background: rgba(15, 23, 42, 0.85); border-left: 6px solid #38bdf8;
                border-top: 1px solid rgba(255,255,255,0.1); border-right: 1px solid rgba(255,255,255,0.1);
                border-bottom: 1px solid rgba(255,255,255,0.1);
                border-radius: 20px; padding: 32px 36px;
                opacity: 0; animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
            }
            .verdict-tag {
                font-family: "Space Mono", monospace; font-size: 18px; font-weight: 700;
                color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px;
            }
            .verdict-body { font-size: 26px; font-weight: 600; line-height: 1.45; color: #f1f5f9; }

            @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
            @keyframes scaleIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
            @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
        </style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="5"
            data-width="1080"
            data-height="1920"
            data-composition-variables='{"kicker":"SO SÁNH ĐA CHIỀU 6 TRỤC","title":"Đánh Giá Năng Lực Mô Hình Toàn Diện","metrics":"Tốc Độ|Độ Chính Xác|Chi Phí|Bảo Mật|Mở Rộng|Trải Nghiệm","model_a_name":"Kiến Trúc Tự Động 2026","model_a_scores":"92,88,95,85,90,94","model_b_name":"Mô Hình Truyền Thống","model_b_scores":"60,70,45,65,55,60","verdict":"Kiến trúc mới vượt trội rõ rệt tại 2 trục Chi Phí và Tốc Độ trong khi vẫn giữ vững chuẩn bảo mật doanh nghiệp."}'
        >
            <div class="header-bar">
                <div class="kicker-tag"><span class="kicker-txt"></span></div>
                <div class="main-title"></div>
                <div class="legend-row">
                    <div class="leg-item"><span class="leg-dot-a"></span><span class="ma-name"></span></div>
                    <div class="leg-item"><span class="leg-dot-b"></span><span class="mb-name"></span></div>
                </div>
            </div>

            <div class="radar-stage">
                <svg class="radar-svg" viewBox="0 0 940 860">
                    <polygon class="radar-grid-line" points="470,160 706,295 706,565 470,700 234,565 234,295" />
                    <polygon class="radar-grid-line" points="470,228 647,329 647,531 470,632 293,531 293,329" />
                    <polygon class="radar-grid-line" points="470,295 588,362 588,498 470,565 352,498 352,362" />
                    <polygon class="radar-grid-line" points="470,362 529,396 529,464 470,498 411,464 411,396" />

                    <line class="radar-axis" x1="470" y1="430" x2="470" y2="160" />
                    <line class="radar-axis" x1="470" y1="430" x2="706" y2="295" />
                    <line class="radar-axis" x1="470" y1="430" x2="706" y2="565" />
                    <line class="radar-axis" x1="470" y1="430" x2="470" y2="700" />
                    <line class="radar-axis" x1="470" y1="430" x2="234" y2="565" />
                    <line class="radar-axis" x1="470" y1="430" x2="234" y2="295" />

                    <polygon id="polyB" class="poly-b" points="470,270 635,340 595,503 470,605 342,510 330,350" />
                    <polygon id="polyA" class="poly-a" points="470,180 678,310 695,558 470,660 256,552 248,308" />

                    <text class="metric-label m-0" x="470" y="120"></text>
                    <text class="metric-label m-1" x="780" y="295"></text>
                    <text class="metric-label m-2" x="780" y="570"></text>
                    <text class="metric-label m-3" x="470" y="740"></text>
                    <text class="metric-label m-4" x="160" y="570"></text>
                    <text class="metric-label m-5" x="160" y="295"></text>
                </svg>
            </div>

            <div class="verdict-card">
                <div class="verdict-tag"><span class="vt-txt"></span></div>
                <div class="verdict-body"></div>
            </div>
        </div>

        <script>
            (function () {
                var v = window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                    ? window.__hyperframes.getVariables() : {};
                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null && String(text).trim() !== "") el.textContent = String(text);
                };
                set(".kicker-txt", v.kicker);
                set(".main-title", v.title);
                set(".ma-name", v.model_a_name || "MÔ HÌNH A");
                set(".mb-name", v.model_b_name || "MÔ HÌNH B");
                set(".vt-txt", "KẾT LUẬN BENCHMARK");
                set(".verdict-body", v.verdict);

                var metrics = (v.metrics || "Tốc Độ|Độ Chính Xác|Chi Phí|Bảo Mật|Mở Rộng|Trải Nghiệm").split("|");
                for (var i = 0; i < 6; i++) {
                    set(".m-" + i, metrics[i] || "");
                }
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = { pause: function () {}, seek: function () {}, paused: function () { return true; } };
        </script>
    </body>
</html>
