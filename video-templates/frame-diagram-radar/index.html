<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1920, height=1080" />
        <title>Diagram Spider Radar · 16:9</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;900&family=Space+Mono:wght@700&display=swap"
            rel="stylesheet"
        />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { width: 1920px; height: 1080px; overflow: hidden; background: #060a12; }
            #root {
                position: relative; width: 1920px; height: 1080px;
                background: #060a12; color: #f1f5f9;
                font-family: "Be Vietnam Pro", sans-serif;
                overflow: hidden;
            }

            .header-bar {
                position: absolute; top: 50px; left: 100px; right: 100px;
                display: flex; justify-content: space-between; align-items: baseline;
                opacity: 0; animation: fadeDown 0.5s ease-out 0.1s both;
            }
            .kicker-tag {
                font-family: "Space Mono", monospace; font-size: 20px; font-weight: 700;
                color: #38bdf8; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px;
            }
            .main-title { font-size: 46px; font-weight: 900; color: #ffffff; letter-spacing: -0.02em; }

            .legend-row {
                display: flex; gap: 28px; align-items: center;
                font-family: "Space Mono", monospace; font-size: 16px; font-weight: 700;
            }
            .leg-item { display: flex; align-items: center; gap: 10px; }
            .leg-dot-a { width: 14px; height: 14px; background: #38bdf8; border-radius: 50%; box-shadow: 0 0 10px #38bdf8; }
            .leg-dot-b { width: 14px; height: 14px; background: #94a3b8; border-radius: 50%; }

            /* Radar Stage (Left) */
            .radar-stage {
                position: absolute; top: 160px; left: 80px; width: 880px; height: 820px;
                display: flex; align-items: center; justify-content: center;
            }
            .radar-svg { width: 100%; height: 100%; }

            /* Narrative (Right) */
            .narrative-col {
                position: absolute; top: 220px; right: 100px; width: 750px; bottom: 100px;
                display: flex; flex-direction: column; justify-content: center; gap: 32px;
                opacity: 0; animation: fadeInRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
            }
            .verdict-card {
                background: rgba(15, 23, 42, 0.85); border-left: 6px solid #38bdf8;
                border-top: 1px solid rgba(255,255,255,0.1); border-right: 1px solid rgba(255,255,255,0.1);
                border-bottom: 1px solid rgba(255,255,255,0.1);
                border-radius: 20px; padding: 40px 48px;
            }
            .verdict-tag {
                font-family: "Space Mono", monospace; font-size: 18px; font-weight: 700;
                color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px;
            }
            .verdict-body { font-size: 32px; font-weight: 600; line-height: 1.45; color: #f1f5f9; }

            .radar-grid-line { stroke: rgba(255,255,255,0.12); stroke-width: 1.5; fill: none; }
            .radar-axis { stroke: rgba(255,255,255,0.18); stroke-width: 1.5; }
            .poly-b { fill: rgba(148, 163, 184, 0.2); stroke: #94a3b8; stroke-width: 2.5; }
            .poly-a {
                fill: rgba(56, 189, 248, 0.35); stroke: #38bdf8; stroke-width: 4;
                filter: drop-shadow(0 0 12px rgba(56,189,248,0.5));
                opacity: 0; animation: scaleIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
                transform-origin: 440px 410px;
            }
            .metric-label {
                font-family: "Be Vietnam Pro", sans-serif; font-size: 18px; font-weight: 700;
                fill: #cbd5e1; text-anchor: middle; dominant-baseline: middle;
            }

            @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
            @keyframes scaleIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
            @keyframes fadeInRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
        </style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="5"
            data-width="1920"
            data-height="1080"
            data-composition-variables='{"kicker":"SO SÁNH ĐA CHIỀU 6 TRỤC","title":"Đánh Giá Năng Lực Mô Hình Toàn Diện","metrics":"Tốc Độ|Độ Chính Xác|Chi Phí|Bảo Mật|Mở Rộng|Trải Nghiệm","model_a_name":"Kiến Trúc Tự Động 2026","model_a_scores":"92,88,95,85,90,94","model_b_name":"Mô Hình Truyền Thống","model_b_scores":"60,70,45,65,55,60","verdict":"Kiến trúc mới vượt trội rõ rệt tại 2 trục Chi Phí và Tốc Độ trong khi vẫn giữ vững chuẩn bảo mật doanh nghiệp."}'
        >
            <div class="header-bar">
                <div>
                    <div class="kicker-tag"><span class="kicker-txt"></span></div>
                    <div class="main-title"></div>
                </div>
                <div class="legend-row">
                    <div class="leg-item"><span class="leg-dot-a"></span><span class="ma-name"></span></div>
                    <div class="leg-item"><span class="leg-dot-b"></span><span class="mb-name"></span></div>
                </div>
            </div>

            <div class="radar-stage">
                <svg class="radar-svg" viewBox="0 0 880 820">
                    <!-- Concentric hexagonal grid -->
                    <polygon class="radar-grid-line" points="440,160 656,285 656,535 440,660 224,535 224,285" />
                    <polygon class="radar-grid-line" points="440,222 595,312 595,498 440,588 285,498 285,312" />
                    <polygon class="radar-grid-line" points="440,285 534,339 534,461 440,515 346,461 346,339" />
                    <polygon class="radar-grid-line" points="440,347 487,374 487,426 440,453 393,426 393,374" />

                    <!-- Radial Axes -->
                    <line class="radar-axis" x1="440" y1="410" x2="440" y2="160" />
                    <line class="radar-axis" x1="440" y1="410" x2="656" y2="285" />
                    <line class="radar-axis" x1="440" y1="410" x2="656" y2="535" />
                    <line class="radar-axis" x1="440" y1="410" x2="440" y2="660" />
                    <line class="radar-axis" x1="440" y1="410" x2="224" y2="535" />
                    <line class="radar-axis" x1="440" y1="410" x2="224" y2="285" />

                    <!-- Data Polygons -->
                    <polygon id="polyB" class="poly-b" points="440,260 590,323 550,473 440,572 321,478 310,335" />
                    <polygon id="polyA" class="poly-a" points="440,180 630,300 645,528 440,622 245,522 237,298" />

                    <!-- Labels -->
                    <text class="metric-label m-0" x="440" y="125"></text>
                    <text class="metric-label m-1" x="710" y="285"></text>
                    <text class="metric-label m-2" x="710" y="540"></text>
                    <text class="metric-label m-3" x="440" y="695"></text>
                    <text class="metric-label m-4" x="170" y="540"></text>
                    <text class="metric-label m-5" x="170" y="285"></text>
                </svg>
            </div>

            <div class="narrative-col">
                <div class="verdict-card">
                    <div class="verdict-tag"><span class="vt-txt"></span></div>
                    <div class="verdict-body"></div>
                </div>
            </div>
        </div>

        <script>
            (function () {
                var v = window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                    ? window.__hyperframes.getVariables() : {};
                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null && String(text).trim() !== "") el.textContent = String(text);
                };
                set(".kicker-txt", v.kicker);
                set(".main-title", v.title);
                set(".ma-name", v.model_a_name || "MÔ HÌNH A");
                set(".mb-name", v.model_b_name || "MÔ HÌNH B");
                set(".vt-txt", "KẾT LUẬN BENCHMARK");
                set(".verdict-body", v.verdict);

                var metrics = (v.metrics || "Tốc Độ|Độ Chính Xác|Chi Phí|Bảo Mật|Mở Rộng|Trải Nghiệm").split("|");
                for (var i = 0; i < 6; i++) {
                    set(".m-" + i, metrics[i] || "");
                }
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = { pause: function () {}, seek: function () {}, paused: function () { return true; } };
        </script>
    </body>
</html>
