<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1920, height=1080" />
        <title>GEO Multi-Stop Itinerary · 16:9</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap"
            rel="stylesheet"
        />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { width: 1920px; height: 1080px; overflow: hidden; background: #022c22; }
            #root {
                position: relative; width: 1920px; height: 1080px;
                background: #022c22; color: #f0fdf4;
                font-family: "Plus Jakarta Sans", sans-serif;
                overflow: hidden; padding: 60px 90px;
                display: flex; flex-direction: column; justify-content: space-between;
            }

            /* Full Vector Cartographic & Topo Map */
            .vector-map-bg {
                position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1;
            }

            .header-bar {
                position: relative; z-index: 5;
                display: flex; justify-content: space-between; align-items: baseline;
                background: rgba(2, 44, 34, 0.85); border: 1px solid rgba(52, 211, 153, 0.3);
                border-radius: 16px; padding: 18px 32px; backdrop-filter: blur(12px);
                opacity: 0; animation: fadeDown 0.5s ease-out 0.1s both;
            }
            .kicker-tag {
                font-family: "JetBrains Mono", monospace; font-size: 16px; font-weight: 800;
                color: #34d399; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px;
            }
            .main-title { font-size: 38px; font-weight: 900; color: #ffffff; letter-spacing: -0.02em; }
            .duration-pill {
                background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(52, 211, 153, 0.5);
                color: #6ee7b7; font-family: "JetBrains Mono", monospace; font-size: 16px;
                font-weight: 800; padding: 8px 20px; border-radius: 999px;
            }

            /* 3-Stop Cards Floating Over Map */
            .stops-container {
                position: relative; z-index: 5; display: grid; grid-template-columns: 1fr 1fr 1fr;
                gap: 36px; width: 100%; margin: auto 0;
            }

            .stop-card {
                background: rgba(4, 47, 36, 0.88); border: 2px solid rgba(52, 211, 153, 0.35);
                border-radius: 20px; padding: 32px 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
                backdrop-filter: blur(16px);
                display: flex; flex-direction: column; justify-content: space-between; height: 420px;
                opacity: 0; animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .card-1 { animation-delay: 0.2s; border-left: 6px solid #34d399; }
            .card-2 { animation-delay: 0.4s; border-left: 6px solid #facc15; box-shadow: 0 0 30px rgba(250, 204, 21, 0.15); }
            .card-3 { animation-delay: 0.6s; border-left: 6px solid #ef4444; }

            .stop-top { display: flex; justify-content: space-between; align-items: center; }
            .time-badge {
                font-family: "JetBrains Mono", monospace; font-size: 16px; font-weight: 800;
                color: #34d399; background: rgba(52, 211, 153, 0.15);
                padding: 6px 14px; border-radius: 8px;
            }
            .pin-icon { font-size: 26px; }

            .stop-name {
                font-size: 30px; font-weight: 900; color: #ffffff;
                line-height: 1.25; margin-bottom: 12px;
            }
            .highlight-tag {
                font-size: 18px; font-weight: 600; color: #cbd5e1; line-height: 1.4;
            }

            .stop-footer {
                display: flex; justify-content: space-between; align-items: center;
                border-top: 1px dashed rgba(52, 211, 153, 0.25); padding-top: 16px;
                font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 700;
                color: #6ee7b7; text-transform: uppercase;
            }

            @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
            @keyframes cardIn { from { opacity: 0; transform: translateY(30px) scale(0.96); } to { opacity: 1; transform: none; } }
        </style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="5"
            data-width="1920"
            data-height="1080"
            data-composition-variables='{"kicker":"Lịch trình trải nghiệm đỉnh cao","itinerary_title":"Hành Trình Khám Phá 24 Giờ Hoàn Hảo","total_duration":"1 NGÀY TRẢI NGHIỆM","stop_1_time":"08:00 - SÁNG","stop_1_name":"Phố Cổ & Cà Phê Trứng","stop_1_highlight":"Khởi động ngày mới với hương vị truyền thống ngắm nhìn phố phường thức giấc.","stop_2_time":"14:00 - CHIỀU","stop_2_name":"Bảo Tàng & Không Gian Nghệ Thuật","stop_2_highlight":"Trải nghiệm triển lãm đa phương tiện và tìm hiểu chiều sâu di sản kiến trúc.","stop_3_time":"19:30 - TỐI","stop_3_name":"Ẩm Thực Đêm & Rooftop Lounge","stop_3_highlight":"Thưởng thức cocktail ngắm toàn cảnh thành phố lung linh từ trên cao."}'
        >
            <!-- Background Vector Topological Road Network -->
            <svg class="vector-map-bg" viewBox="0 0 1920 1080">
                <!-- Water Body / Bay -->
                <path d="M 0,0 C 400,200 600,600 400,1080 L 0,1080 Z" fill="#042f2e" opacity="0.6" />
                <path d="M 1500,0 C 1400,400 1600,800 1920,1080 L 1920,0 Z" fill="#042f2e" opacity="0.6" />
                
                <!-- Contour Elevation Lines -->
                <path d="M 0,250 Q 500,120 1000,300 T 1920,200" fill="none" stroke="rgba(52,211,153,0.18)" stroke-width="2" />
                <path d="M 0,500 Q 600,380 1200,550 T 1920,480" fill="none" stroke="rgba(52,211,153,0.18)" stroke-width="2" />
                <path d="M 0,750 Q 700,620 1400,780 T 1920,700" fill="none" stroke="rgba(52,211,153,0.18)" stroke-width="2" />

                <!-- Connecting Highway Route -->
                <path d="M 380,680 Q 960,540 1540,680" fill="none" stroke="#facc15" stroke-width="5" stroke-dasharray="10,10" />
            </svg>

            <div class="header-bar">
                <div>
                    <div class="kicker-tag"><span class="kicker-txt"></span></div>
                    <div class="main-title"></div>
                </div>
                <div class="duration-pill"><span class="dur-txt"></span></div>
            </div>

            <div class="stops-container">
                <div class="stop-card card-1">
                    <div class="stop-top">
                        <span class="time-badge s1-time"></span>
                        <span class="pin-icon">📍</span>
                    </div>
                    <div>
                        <div class="stop-name s1-name"></div>
                        <div class="highlight-tag s1-hl"></div>
                    </div>
                    <div class="stop-footer">
                        <span class="sf-l1"></span>
                        <span class="sf-r1"></span>
                    </div>
                </div>

                <div class="stop-card card-2">
                    <div class="stop-top">
                        <span class="time-badge s2-time"></span>
                        <span class="pin-icon">📍</span>
                    </div>
                    <div>
                        <div class="stop-name s2-name"></div>
                        <div class="highlight-tag s2-hl"></div>
                    </div>
                    <div class="stop-footer">
                        <span class="sf-l2"></span>
                        <span class="sf-r2"></span>
                    </div>
                </div>

                <div class="stop-card card-3">
                    <div class="stop-top">
                        <span class="time-badge s3-time"></span>
                        <span class="pin-icon">📍</span>
                    </div>
                    <div>
                        <div class="stop-name s3-name"></div>
                        <div class="highlight-tag s3-hl"></div>
                    </div>
                    <div class="stop-footer">
                        <span class="sf-l3"></span>
                        <span class="sf-r3"></span>
                    </div>
                </div>
            </div>
        </div>

        <script>
            (function () {
                var v = window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                    ? window.__hyperframes.getVariables() : {};
                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null && String(text).trim() !== "") el.textContent = String(text);
                };
                set(".kicker-txt", v.kicker);
                set(".main-title", v.itinerary_title);
                set(".dur-txt", v.total_duration || "1 DAY TRIP");
                set(".s1-time", v.stop_1_time);
                set(".s1-name", v.stop_1_name);
                set(".s1-hl", v.stop_1_highlight);
                set(".sf-l1", "TRẠM DỪNG 01");
                set(".sf-r1", "CHECK-IN ✓");
                set(".s2-time", v.stop_2_time);
                set(".s2-name", v.stop_2_name);
                set(".s2-hl", v.stop_2_highlight);
                set(".sf-l2", "TRẠM DỪNG 02");
                set(".sf-r2", "HIGHLIGHT ★");
                set(".s3-time", v.stop_3_time);
                set(".s3-name", v.stop_3_name);
                set(".s3-hl", v.stop_3_highlight);
                set(".sf-l3", "TRẠM DỪNG 03");
                set(".sf-r3", "NIGHT VIEW ✦");
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = window.__timelines["portrait"] = { pause: function () {}, seek: function () {}, paused: function () { return true; } };
        </script>
    </body>
</html>
