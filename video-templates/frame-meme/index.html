<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<!--
  frame-meme — a meme as the whole scene, in its own colours.

  The image is supplied by the pipeline as assets/media.png (or assets/media.mp4 for an
  animated one, converted from the .gif memegen returns). scripts/video/lib/compose.mjs
  copies the resolved file in before rendering.

  `object-fit: contain`, never cover: a meme's text runs to its edges, and cropping it to
  fill a 9:16 frame cuts the punchline off. The frame around it is the kit's palette; the
  meme itself is left exactly as it came.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  #root {
    position: relative; overflow: hidden;
    font-family: "Be Vietnam Pro", "Inter Tight", system-ui, sans-serif;
    color: #fff;
    background:
      radial-gradient(900px 700px at 108% -12%, #1b2440 0%, transparent 62%),
      radial-gradient(900px 700px at -8% 112%, #2a1740 0%, transparent 62%),
      #05060a;
  }

  /* THE MEME IS NEVER FILTERED, TINTED OR BLENDED.
     That is the whole reason this template exists next to frame-media-inset, which tints
     its media into the palette on purpose. A meme that has been recoloured to match a dark
     brand palette is no longer the meme — the colour IS the joke's delivery. If a future
     tidy-up "unifies" this with the theme system, it has removed the feature. */
  .meme, video.meme {
    display: block; object-fit: contain;
    border-radius: 18px;
    box-shadow: 0 30px 90px rgba(0,0,0,.55);
    opacity: 0; animation: pop .6s cubic-bezier(.2,.9,.25,1) .3s both;
  }

  /* The mat the meme sits on. A meme is `contain`-fitted, so there are ALWAYS bars beside
     or above it — this is what fills them, and it has to read as a deliberate backdrop.
     It was the striped placeholder at first, and the stripes showing down both sides of
     every meme looked like a broken image rather than a mat. */
  .ph { position: absolute; background: #0a0c14; border-radius: 18px; }
  /* Only when the media genuinely failed. Shapes only, never words — a placeholder that
     says something says it on every video that forgets its media. */
  .ph.missing {
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 36px, transparent 36px 72px);
  }
  .ph.missing::before {
    content: ""; position: absolute; left: 50%; top: 50%; width: 216px; height: 152px;
    margin: -76px 0 0 -108px; border: 6px solid rgba(255,255,255,.14); border-radius: 20px;
  }

  .chip {
    position: absolute; display: inline-flex; align-items: center; gap: 14px;
    border-radius: 999px;
    background: rgba(10,12,20,.55); border: 1px solid rgba(255,255,255,.22);
    font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    opacity: 0; animation: chipIn .7s cubic-bezier(.2,.8,.2,1) .15s both;
  }
  .kicker {
    font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #8be9ff;
    opacity: 0; animation: up .7s cubic-bezier(.2,.8,.2,1) .45s both;
  }
  .caption {
    font-weight: 400; color: rgba(255,255,255,.92);
    text-shadow: 0 6px 30px rgba(0,0,0,.8);
    opacity: 0; animation: up .8s cubic-bezier(.2,.8,.2,1) .62s both;
  }

  /* `both`, not `forwards`: during a delay, `forwards` renders the element in its normal
     style — which for these is the FINISHED state. Half a second of the settled frame, then
     a snap back to the start. */
  @keyframes up     { from { opacity: 0; transform: translateY(34px); } to { opacity: 1; transform: none; } }
  @keyframes chipIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: none; } }
  @keyframes pop    { from { opacity: 0; transform: scale(.93); }       to { opacity: 1; transform: none; } }

  #root { width: 1920px; height: 1080px; }
  .ph        { left: 1010px; top: 130px; width: 830px; height: 820px; }
  .meme, video.meme { position: absolute; left: 1010px; top: 130px; width: 830px; height: 820px; }
  .chip      { top: 74px; left: 88px; padding: 14px 28px; font-size: 26px; }
  .kicker    { position: absolute; top: 300px; left: 88px; width: 820px; font-size: 30px; }
  .caption   { position: absolute; left: 88px; top: 420px; width: 820px; font-size: 44px; line-height: 1.34; }
</style>
</head>
<body>
  <div
    id="root"
    data-composition-id="main"
    data-start="0"
    data-duration="5"
    data-width="1920"
    data-height="1080"
    data-composition-variables='{"chip":"😂 Meme","kicker":"Ai cũng từng","caption":"Viết tay cả buổi, rồi để agent viết trong ba giây","media_kind":"image"}'
  >
    <div class="ph" data-media-fallback></div>
    <video class="meme" src="assets/media.mp4" muted playsinline preload="auto"></video>
    <div class="chip"></div>
    <div class="kicker"></div>
    <div class="caption"></div>
  </div>

  <script>
    (function () {
      var v =
        window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
          ? window.__hyperframes.getVariables()
          : {};

      var set = function (sel, val) {
        var el = document.querySelector(sel);
        if (!el) return;
        var s = val == null ? "" : String(val);
        el.textContent = s;
        if (!s) el.style.display = "none";
      };

      set(".chip", v.chip);
      set(".kicker", v.kicker);
      set(".caption", v.caption);

      // A static meme is a .png; an animated one arrives as a clip the pipeline converted
      // from the .gif. media_kind is a switch, not copy — it never renders as text.
      var ph = document.querySelector(".ph");
      var fail = function () { if (ph) ph.className = "ph missing"; };

      var media = document.querySelector("video.meme");
      if (String(v.media_kind || "image") !== "video" && media) {
        var img = document.createElement("img");
        img.className = "meme";
        img.src = "assets/media.png";
        img.alt = "";
        // Empty alt suppresses alt TEXT, not Chrome's own broken-image mark on an element
        // with layout dimensions. Hide it so a missing still leaves the mat alone.
        img.onerror = function () { img.style.display = "none"; fail(); };
        media.parentNode.replaceChild(img, media);
        media = null;
      } else if (media) {
        media.onerror = fail;
      }

      // BOTH keys are required. A composition that registers only "main" leaves Puppeteer
      // waiting 45 seconds for the sub-composition ready signal — a 10x render slowdown
      // that looks like a slow machine rather than a missing line.
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = window.__timelines["portrait"] = {
        pause: function () {},
        seek: function (t) {
          if (!media) return;
          try { media.currentTime = t; } catch (e) {}
        },
        paused: function () { return true; },
      };
    })();
  </script>
</body>
</html>
