<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<!--
  frame-media-inset — poster layout that keeps its own design language, with the footage
  framed inside it rather than behind everything.

  Use this when the clip ILLUSTRATES a specific point and the words still carry the scene.
  Use frame-broll instead when the footage IS the scene and you only need one line over it.

  Accepts either a clip (assets/media.mp4) or a still (assets/media.png) via `media_kind`.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; }
  #root {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    font-family: "Be Vietnam Pro", system-ui, sans-serif;
    background:
      radial-gradient(900px 700px at 110% -10%, #241a45 0%, transparent 62%),
      radial-gradient(900px 700px at -10% 110%, #0d2b3a 0%, transparent 62%),
      #07080e;
    color: #fff;
  }
  .noise {
    position: absolute; inset: 0; opacity: .05; mix-blend-mode: overlay;
    background-image: radial-gradient(rgba(255,255,255,.9) 1px, transparent 1px);
    background-size: 4px 4px;
  }

  .head { position: absolute; top: 160px; left: 84px; right: 84px; }
  .kicker {
    font-size: 32px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase;
    color: #ffb457; margin-bottom: 22px;
    opacity: 0; animation: up .7s cubic-bezier(.2,.8,.2,1) .1s forwards;
  }
  h1 {
    margin: 0; font-size: 92px; line-height: 1.05; font-weight: 800; letter-spacing: -.02em;
    opacity: 0; animation: up .8s cubic-bezier(.2,.8,.2,1) .24s forwards;
  }

  .frame {
    position: absolute; left: 84px; right: 84px; top: 640px; height: 780px;
    border-radius: 34px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: 0 44px 110px rgba(0,0,0,.72);
    opacity: 0; transform: translateY(56px) scale(.965);
    animation: win .95s cubic-bezier(.2,.8,.2,1) .42s forwards;
  }
  .frame video, .frame img {
    width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.04);
  }
  /* Tie the footage into the palette so it reads as part of the design, not a pasted box. */
  /* Shows through when the clip or still has not been resolved yet. A failed <img> paints the
     browser's own broken-image mark, which is how this template reached the catalogue as a
     flat grey box — text filled in, media slot still a hole. Shapes only, never text: a
     placeholder that says something says it on every video that forgets to pass media. */
  .ph { position: absolute; inset: 0; background: #12141d;
        background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.028) 0 24px, transparent 24px 48px); }
  .ph::before { content: ""; position: absolute; left: 50%; top: 50%; width: 216px; height: 152px;
        margin: -76px 0 0 -108px; border: 4px solid rgba(255,255,255,.15); border-radius: 16px; }
  .ph::after { content: ""; position: absolute; left: 50%; top: 50%; width: 0; height: 0;
        margin: 8px 0 0 -66px; border-left: 66px solid transparent; border-right: 66px solid transparent;
        border-bottom: 60px solid rgba(255,255,255,.15); }
  .ph i { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -50px 0 0 40px;
        border-radius: 50%; background: rgba(255,255,255,.15); }

  .tint {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(7,8,14,.22) 0%, rgba(7,8,14,0) 40%, rgba(7,8,14,.55) 100%);
  }

  .cap {
    position: absolute; left: 84px; right: 84px; bottom: 250px;
    font-size: 40px; line-height: 1.42; color: rgba(255,255,255,.9);
    opacity: 0; animation: up .8s cubic-bezier(.2,.8,.2,1) .78s forwards;
  }
  .foot {
    position: absolute; left: 84px; right: 84px; bottom: 130px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 28px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.48);
    opacity: 0; animation: up .8s cubic-bezier(.2,.8,.2,1) .92s forwards;
  }
  .bar {
    position: absolute; left: 84px; bottom: 200px; width: 0; height: 5px; border-radius: 3px;
    background: linear-gradient(90deg, #ffb457, #ff5f7e);
    animation: rule 1.1s cubic-bezier(.2,.8,.2,1) .85s forwards;
  }
  @keyframes up   { from { opacity: 0; transform: translateY(38px); } to { opacity: 1; transform: none; } }
  @keyframes win  { to { opacity: 1; transform: none; } }
  @keyframes rule { to { width: 190px; } }
</style>
</head>
<body>
  <div
    id="root"
    data-composition-id="main"
    data-start="0"
    data-duration="5"
    data-width="1080"
    data-height="1920"
    data-composition-variables='{"kicker":"Bối cảnh","headline":"Bốn cấu hình, cùng một câu hỏi","caption":"Khác nhau ở cách cắt đoạn, mô hình embedding, và có bật rerank hay không.","footer_left":"RAG-EVAL-VN","footer_right":"2026","media_kind":"image"}'
  >
    <div class="noise"></div>

    <div class="head">
      <div class="kicker"></div>
      <h1></h1>
    </div>

    <div class="frame">
      <div class="ph" data-media-fallback><i></i></div>
      <video class="media" src="assets/media.mp4" muted playsinline preload="auto"></video>
      <div class="tint"></div>
    </div>

    <div class="bar"></div>
    <div class="cap"></div>
    <div class="foot"><span class="fl"></span><span class="fr"></span></div>
  </div>

  <script>
    (function () {
      var v =
        window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
          ? window.__hyperframes.getVariables()
          : {};

      var set = function (sel, val) {
        var el = document.querySelector(sel);
        if (!el) return;
        var s = val == null ? "" : String(val);
        el.textContent = s;
        if (!s) el.style.display = "none";
      };

      set(".kicker", v.kicker);
      set("h1", v.headline);
      set(".cap", v.caption);
      set(".fl", v.footer_left);
      set(".fr", v.footer_right);

      var media = document.querySelector(".frame video.media");
      if (String(v.media_kind || "video") === "image" && media) {
        var img = document.createElement("img");
        img.className = "media";
        img.src = "assets/media.png";
        img.alt = "";
        // Empty alt suppresses alt TEXT, not Chrome's own 16px broken-image mark on an
        // image with layout dimensions — this one has them. Hide the element outright so
        // the .ph behind it is the only thing a missing still leaves on screen.
        img.onerror = function () { img.style.display = "none"; };
        media.parentNode.replaceChild(img, media);
        media = null;
      }

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = window.__timelines["portrait"] = {
        pause: function () {},
        seek: function (t) {
          if (!media) return;
          try { media.currentTime = t; } catch (e) {}
        },
        paused: function () { return true; },
      };
    })();
  </script>
</body>
</html>
