<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<!--
  frame-screenshot — a captured web page inside a browser chrome, as evidence.

  Use it when the narration says "here is what they announced" and you want the viewer to
  see the real page rather than a paraphrase. The screenshot arrives as assets/media.png
  (scripts/media/screenshot.mjs captures it; compose.mjs copies it in).

  The image is TOP-ALIGNED inside the frame on purpose: a page screenshot has its headline
  at the top, and centring would crop exactly the part that matters.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; }
  #root {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    font-family: "Be Vietnam Pro", system-ui, sans-serif;
    background:
      radial-gradient(1200px 900px at 20% -10%, #1b2440 0%, transparent 60%),
      radial-gradient(1000px 800px at 110% 110%, #2a1740 0%, transparent 60%),
      #080a12;
  }
  .grid {
    position: absolute; inset: 0; opacity: .16;
    background-image:
      linear-gradient(rgba(255,255,255,.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.10) 1px, transparent 1px);
    background-size: 90px 90px;
  }

  .head { position: absolute; top: 150px; left: 80px; right: 80px; color: #fff; }
  .kicker {
    font-size: 32px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
    color: #8be9ff; margin-bottom: 20px;
    opacity: 0; animation: up .7s cubic-bezier(.2,.8,.2,1) .1s forwards;
  }
  h1 {
    margin: 0; font-size: 82px; line-height: 1.06; font-weight: 800; letter-spacing: -.02em;
    opacity: 0; animation: up .8s cubic-bezier(.2,.8,.2,1) .25s forwards;
  }

  /* Browser chrome */
  .window {
    position: absolute; left: 70px; right: 70px; top: 500px;
    border-radius: 26px; overflow: hidden;
    background: #0e1119; border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 50px 120px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.05) inset;
    opacity: 0; transform: translateY(60px) scale(.97);
    animation: win .9s cubic-bezier(.2,.8,.2,1) .45s forwards;
  }
  .bar {
    display: flex; align-items: center; gap: 18px;
    height: 84px; padding: 0 28px; background: #161a26;
    border-bottom: 1px solid rgba(255,255,255,.10);
  }
  .dots { display: flex; gap: 12px; }
  .dots i { width: 18px; height: 18px; border-radius: 50%; display: block; }
  .dots i:nth-child(1) { background: #ff5f57; }
  .dots i:nth-child(2) { background: #febc2e; }
  .dots i:nth-child(3) { background: #28c840; }
  .url {
    flex: 1; height: 50px; border-radius: 25px; background: #0b0e16;
    border: 1px solid rgba(255,255,255,.10);
    display: flex; align-items: center; padding: 0 24px; gap: 12px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 24px; color: rgba(255,255,255,.62);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .lock { width: 16px; height: 16px; border: 3px solid rgba(255,255,255,.45); border-radius: 4px; flex: none; }
  .screen { position: relative; height: 630px; }
  .shot {
    position: absolute; inset: 0;
    display: block; width: 100%; height: 100%;
    object-fit: cover; object-position: top center;
  }
  /* 940px-wide frame / 630px tall = 1.49, matching the 1280x860 capture, so the sides
     are not cropped. The height lives on .screen now — change one and the other follows. */

  /* Behind the capture, the same way frame-3d-device carries a skeleton behind its own.
     A failed <img> with an empty alt paints NOTHING in Chrome, so a scene whose capture
     never arrived showed the window's flat #0e1119 fill — browser chrome around a dead
     screen, which reads as a rendering bug rather than as missing input. Shapes only,
     no text, so it never says anything the caller did not. */
  .ph { position: absolute; inset: 0; background: #12141d;
        background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.028) 0 24px, transparent 24px 48px); }
  .ph::before { content: ""; position: absolute; left: 50%; top: 50%; width: 216px; height: 152px;
        margin: -76px 0 0 -108px; border: 4px solid rgba(255,255,255,.15); border-radius: 16px; }
  .ph::after { content: ""; position: absolute; left: 50%; top: 50%; width: 0; height: 0;
        margin: 8px 0 0 -66px; border-left: 66px solid transparent; border-right: 66px solid transparent;
        border-bottom: 60px solid rgba(255,255,255,.15); }
  .ph i { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -50px 0 0 40px;
        border-radius: 50%; background: rgba(255,255,255,.15); }

  .cap {
    position: absolute; left: 80px; right: 80px; bottom: 190px; color: rgba(255,255,255,.92);
    font-size: 40px; line-height: 1.4;
    opacity: 0; animation: up .8s cubic-bezier(.2,.8,.2,1) .8s forwards;
  }
  .src {
    position: absolute; left: 80px; bottom: 110px;
    font-size: 28px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.5);
    opacity: 0; animation: up .8s cubic-bezier(.2,.8,.2,1) .95s forwards;
  }
  @keyframes up  { from { opacity: 0; transform: translateY(38px); } to { opacity: 1; transform: none; } }
  @keyframes win { to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div
    id="root"
    data-composition-id="main"
    data-start="0"
    data-duration="5"
    data-width="1080"
    data-height="1920"
    data-composition-variables='{"kicker":"Nguồn","headline":"Số liệu lấy từ đâu","url":"github.com/XuHo-IT/RAG-EVAL-VN","caption":"Bộ đo chạy offline, mọi con số trong video đều lặp lại được.","source":"RAG-EVAL-VN"}'
  >
    <div class="grid"></div>

    <div class="head">
      <div class="kicker"></div>
      <h1></h1>
    </div>

    <div class="window">
      <div class="bar">
        <div class="dots"><i></i><i></i><i></i></div>
        <div class="url"><span class="lock"></span><span class="urltext"></span></div>
      </div>
      <div class="screen">
        <div class="ph" data-media-fallback><i></i></div>
        <!-- onerror, not alt="": a sized <img> that fails still gets Chrome's own 16px
             broken-image mark, empty alt or not. Verified by rendering this file with no
             assets/ beside it. Inline so it fires even if the script below never runs. -->
        <img class="shot" src="assets/media.png" alt="" onerror="this.style.display='none'" />
      </div>
    </div>

    <div class="cap"></div>
    <div class="src"></div>
  </div>

  <script>
    (function () {
      var v =
        window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
          ? window.__hyperframes.getVariables()
          : {};

      var set = function (sel, val) {
        var el = document.querySelector(sel);
        if (!el) return;
        var s = val == null ? "" : String(val);
        el.textContent = s;
        if (!s) el.style.display = "none";
      };

      set(".kicker", v.kicker);
      set("h1", v.headline);
      set(".cap", v.caption);
      set(".src", v.source);

      // Show host + path only — a full URL with query string overflows the bar and reads
      // as noise. The point is "this is the real page", not the exact link.
      var raw = String(v.url || "");
      var pretty = raw.replace(/^https?:\/\//, "").replace(/\/$/, "");
      if (pretty.length > 46) pretty = pretty.slice(0, 45) + "…";
      document.querySelector(".urltext").textContent = pretty;

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = window.__timelines["portrait"] = { pause: function () {}, seek: function () {}, paused: function () { return true; } };
    })();
  </script>
</body>
</html>
