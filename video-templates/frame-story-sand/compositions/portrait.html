<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Story · Sand Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800&family=Roboto+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Patrick+Hand&family=Anton&display=swap" rel="stylesheet">
  <style>
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #2b1d10; }
    
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --spring: linear(0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%, 0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1);
    --snap: cubic-bezier(.2,.9,.1,1);
    --out: cubic-bezier(.16,1,.3,1);
  }
  #root { position: relative; overflow: hidden; width: 100%; height: 100%; font-family: 'Be Vietnam Pro', sans-serif; }
  #root::after {
    content: ""; position: absolute; inset: -30%; pointer-events: none; z-index: 0; opacity: .55;
    animation: ambient 16s linear infinite;
  }
  @keyframes ambient { from { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.08); } to { transform: rotate(360deg) scale(1); } }
  .stage { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; flex-direction: column; }
  .mono { font-family: 'Roboto Mono', monospace; }
  @keyframes rise { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.4); } 60% { opacity: 1; } 100% { opacity: 1; transform: scale(1); } }
  @keyframes wipeIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

    
      #root { background: radial-gradient(ellipse 78% 60% at 50% 48%, #f3cb8a 0, #e0a95a 40%, #a8692e 70%, #3a2715 100%); color: #fff3d6; }
      #root::after { background-image: radial-gradient(rgba(43,29,16,.55) 1px, transparent 1.6px), radial-gradient(rgba(43,29,16,.35) 1.4px, transparent 2px); background-size: 6px 6px, 11px 13px; opacity: .9; animation: grains 3s steps(6) infinite; }
      @keyframes grains { 0% { transform: translate(0,0); } 33% { transform: translate(2px,-3px); } 66% { transform: translate(-3px,1px); } 100% { transform: translate(0,0); } }
      .sand { position: absolute; inset: 0; background: #3a2715; -webkit-mask-image: radial-gradient(ellipse 80% 62% at 50% 48%, transparent 0, transparent 70%, #000 100%); mask-image: radial-gradient(ellipse 80% 62% at 50% 48%, transparent 0, transparent 70%, #000 100%); opacity: .9; z-index: 0; }
      .stage { justify-content: center; align-items: center; text-align: center; }
      .brush { -webkit-mask-image: linear-gradient(90deg, #000 0, #000 40%, transparent 60%); mask-image: linear-gradient(90deg, #000 0, #000 40%, transparent 60%); -webkit-mask-size: 300% 100%; mask-size: 300% 100%; -webkit-mask-position: 100% 0; mask-position: 100% 0; animation: sweep 1.6s cubic-bezier(.4,0,.2,1) forwards; }
      @keyframes sweep { to { -webkit-mask-position: 0 0; mask-position: 0 0; } }
      .era { font-family: 'Roboto Mono', monospace; font-weight: 700; letter-spacing: .14em; color: #2b1d10; animation-delay: .3s; }
      .line { font-family: 'Playfair Display', serif; font-weight: 900; line-height: 1.06; color: #2b1d10; animation-delay: 1.1s; }
      .sub { font-weight: 700; color: #2b1d10; animation-delay: 3.4s; }
      .scape { overflow: visible; }
      .scape path { fill: none; stroke: #2b1d10; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2s var(--out) 2.4s forwards; }
      .scape circle { fill: none; stroke: #2b1d10; stroke-width: 6; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.2s var(--out) 2.2s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .finger { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,243,214,.55), transparent 70%); opacity: 0; animation: fingerMove 1.6s cubic-bezier(.4,0,.2,1) 1.1s; }
      @keyframes fingerMove { 0% { opacity: .9; transform: translateX(-60vw); } 100% { opacity: 0; transform: translateX(40vw); } }
    
    
      .stage { padding: 0 80px; gap: 50px; }
      .era { font-size: 44px; }
      .line { font-size: 108px; }
      .scape { width: 900px; height: 300px; }
      .sub { font-size: 44px; }
      .finger { width: 260px; height: 260px; left: 50%; top: 820px; }
    
  </style>
</head>
<body>
  <div id="root" class="P" data-composition-id="portrait" data-width="1080" data-height="1920" data-start="0" data-duration="6" data-composition-variables='{"era":"Năm 1998","line":"Bà tôi may chiếc áo dài đầu tiên dưới ánh đèn dầu","sub":"Từ một chiếc máy khâu cũ, ở phố Hàng Gai"}'>
    <div class="sand"></div>
      <div class="finger"></div>
      <div class="stage">
        <div class="era brush" data-slot="era"></div>
        <div class="line brush" data-slot="line"></div>
        <svg class="scape" viewBox="0 0 900 300" preserveAspectRatio="none" aria-hidden="true">
          <circle pathLength="1" cx="700" cy="90" r="56"/>
          <path pathLength="1" vector-effect="non-scaling-stroke" d="M 0 250 C 120 160 220 160 320 220 C 400 120 520 110 620 210 C 700 170 800 180 900 240"/>
          <path pathLength="1" vector-effect="non-scaling-stroke" d="M 60 290 C 260 260 640 260 860 290"/>
        </svg>
        <div class="sub brush" data-slot="sub"></div>
      </div>
  </div>
  <script>
    // Caller values: window.__hyperframes.getVariables(), merged over the declared defaults
    // so the file still previews on its own. Built once, before the first seek.
    function getVariables() {
      let d = {};
      try { d = JSON.parse(document.getElementById("root").getAttribute("data-composition-variables") || "{}"); } catch (e) {}
      const hf = window.__hyperframes;
      const p = hf && typeof hf.getVariables === "function" ? hf.getVariables() || {} : {};
      return Object.assign({}, d, p);
    }
    const v = getVariables();
    const has = (k) => v[k] !== undefined && v[k] !== null && String(v[k]).trim() !== "";
    document.querySelectorAll("[data-slot]").forEach((el) => {
      const k = el.getAttribute("data-slot");
      if (!has(k)) { (el.closest("[data-slot-box]") || el).remove(); return; }
      el.textContent = String(v[k]);
    });
    /** One span per character, each starting `step` seconds after the last — a typewriter. */
    function typeInto(el, text, start, step) {
      el.textContent = "";
      [...String(text)].forEach((ch, i) => {
        const s = document.createElement("span");
        s.className = "ch";
        s.textContent = ch;
        s.style.animationDelay = (start + i * step).toFixed(3) + "s";
        el.appendChild(s);
      });
      return start + [...String(text)].length * step;
    }
    /** Odometer: every digit becomes a 0–9 column that rolls to its value. */
    function odometer(el, text, start) {
      el.textContent = "";
      let n = 0;
      [...String(text)].forEach((ch) => {
        if (/[0-9]/.test(ch)) {
          const col = document.createElement("span");
          col.className = "odo";
          const strip = document.createElement("span");
          strip.className = "odo-strip";
          for (let d = 0; d <= 9; d++) { const x = document.createElement("span"); x.textContent = d; strip.appendChild(x); }
          strip.style.setProperty("--d", ch);
          strip.style.animationDelay = (start + n++ * 0.07).toFixed(2) + "s";
          const size = document.createElement("span");
          size.className = "odo-size";
          size.textContent = ch;
          col.appendChild(size);
          col.appendChild(strip);
          el.appendChild(col);
        } else {
          const s = document.createElement("span");
          s.className = "odo-sep";
          s.textContent = ch;
          el.appendChild(s);
        }
      });
    }
    
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = window.__timelines["portrait"] = {
      duration: 6,
      seek(t) { document.getAnimations().forEach((a) => { a.pause(); a.currentTime = t * 1000; }); },
    };
  </script>
</body>
</html>
