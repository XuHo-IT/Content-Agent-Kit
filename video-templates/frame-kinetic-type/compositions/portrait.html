<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1080, height=1920" />
        <title>Kinetic Type · Portrait</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=JetBrains+Mono:wght@700;800&family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet" />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { overflow: hidden; width: 1080px; height: 1920px; }
            #root {
                position: relative; width: 1080px; height: 1920px; overflow: hidden;
                background: #facc15; color: #090d16;
                font-family: "Plus Jakarta Sans", sans-serif;
                display: flex; flex-direction: column; justify-content: center;
                padding: 0 80px;
            }

            .vox-paper {
                position: absolute; inset: 0;
                background-image: radial-gradient(rgba(0,0,0,0.06) 1.5px, transparent 0);
                background-size: 24px 24px; pointer-events: none;
            }

            .kicker {
                font-family: "JetBrains Mono", monospace;
                font-size: 24px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase;
                background: #dc2626; color: #ffffff;
                padding: 8px 22px; border-radius: 4px; width: fit-content; margin-bottom: 50px;
                opacity: 0; animation: rise 0.5s ease-out 0.1s forwards;
            }

            .line {
                font-family: "Playfair Display", serif; font-weight: 900; line-height: 1.15;
                font-size: 96px; display: flex; flex-wrap: wrap; gap: 0 0.3em;
                color: #090d16; letter-spacing: -0.02em;
            }

            .line span {
                display: inline-block; opacity: 0; transform: translateY(0.36em);
                animation: word 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }

            .line span.accent {
                background: #090d16; color: #facc15;
                padding: 0 16px; border-radius: 6px; position: relative;
            }

            .footnote {
                font-family: "JetBrains Mono", monospace; font-size: 26px; font-weight: 700;
                color: #4b5563; margin-top: 60px;
                opacity: 0; animation: rise 0.6s ease-out 1.6s forwards;
            }

            @keyframes word { to { opacity: 1; transform: translateY(0); } }
            @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
        </style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="portrait"
            data-start="0"
            data-duration="6"
            data-width="1080"
            data-height="1920"
            data-composition-variables='{"kicker":"Nhận định","line":"Rerank không làm RAG nhanh hơn, nó làm RAG đúng hơn.","accent":"đúng","footnote":""}'
        >
            <div class="vox-paper"></div>
            <div class="kicker"></div>
            <div class="line"></div>
            <div class="footnote"></div>
        </div>
        <script>
            (function () {
                var v = window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                    ? window.__hyperframes.getVariables() : {};
                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null && String(text).length) el.textContent = String(text);
                };
                var drop = function (sel) {
                    var el = document.querySelector(sel);
                    if (el) el.remove();
                };
                var setOrDrop = function (sel, text) {
                    if (text == null || !String(text).trim()) return drop(sel);
                    set(sel, text);
                };
                set(".kicker", v.kicker);
                setOrDrop(".footnote", v.footnote);
                if (!String(v.kicker || "").trim()) drop(".kicker");

                var words = String(v.line || "").trim().split(/\s+/).filter(Boolean);
                var bare = function (s) { return s.toLowerCase().replace(/[^\p{L}\p{N}]/gu, ""); };
                var accent = bare(String(v.accent || ""));
                var line = document.querySelector(".line");
                words.forEach(function (w, i) {
                    var el = document.createElement("span");
                    el.textContent = w;
                    el.style.animationDelay = (0.2 + i * 0.12) + "s";
                    if (accent && bare(w) === accent) {
                        el.classList.add("accent");
                    }
                    line.appendChild(el);
                });
            })();
        </script>
    </body>
</html>
