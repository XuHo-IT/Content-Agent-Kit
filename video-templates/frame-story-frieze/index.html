<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Story · Painted Frieze</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800&family=Roboto+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Patrick+Hand&family=Anton&display=swap" rel="stylesheet">
  <style>
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #15110e; }
    
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --spring: linear(0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%, 0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1);
    --snap: cubic-bezier(.2,.9,.1,1);
    --out: cubic-bezier(.16,1,.3,1);
  }
  #root { position: relative; overflow: hidden; width: 100%; height: 100%; font-family: 'Be Vietnam Pro', sans-serif; }
  #root::after {
    content: ""; position: absolute; inset: -30%; pointer-events: none; z-index: 0; opacity: .55;
    animation: ambient 16s linear infinite;
  }
  @keyframes ambient { from { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.08); } to { transform: rotate(360deg) scale(1); } }
  .stage { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; flex-direction: column; }
  .mono { font-family: 'Roboto Mono', monospace; }
  @keyframes rise { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.4); } 60% { opacity: 1; } 100% { opacity: 1; transform: scale(1); } }
  @keyframes wipeIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

    
      #root { background: #15110e; color: #f1e6d2; }
      #root::after { background: radial-gradient(ellipse at 50% 60%, rgba(200,100,60,.18), transparent 60%); opacity: 1; animation: breathe 5s ease-in-out infinite; }
      @keyframes breathe { 0%, 100% { transform: scale(1); opacity: .7; } 50% { transform: scale(1.08); opacity: 1; } }
      .stage { align-items: center; }
      .title { font-family: 'Playfair Display', serif; font-weight: 900; font-style: italic; text-align: center; line-height: 1.04; opacity: 0; animation: rise .7s var(--out) .2s forwards; }
      .vase { position: relative; flex: none; background: #c8643c; clip-path: polygon(38% 0, 62% 0, 60% 6%, 66% 12%, 86% 24%, 96% 40%, 96% 62%, 86% 80%, 66% 92%, 64% 96%, 70% 100%, 30% 100%, 36% 96%, 34% 92%, 14% 80%, 4% 62%, 4% 40%, 14% 24%, 34% 12%, 40% 6%); opacity: 0; animation: fade .6s .1s forwards; }
      .band { position: absolute; left: 0; right: 0; overflow: hidden; }
      .key { position: absolute; left: 0; right: 0; height: 26px; background: repeating-linear-gradient(90deg, #15110e 0 26px, transparent 26px 34px, #15110e 34px 44px, transparent 44px 52px); }
      .key.t { top: 0; } .key.b { bottom: 0; }
      .strip { position: absolute; top: 26px; bottom: 26px; left: 0; display: flex; animation: turn 6.4s cubic-bezier(.65,0,.35,1) .4s both; }
      .panel { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #15110e; }
      .panel b { font-family: 'Playfair Display', serif; font-weight: 900; line-height: 1; }
      .panel span { font-weight: 800; line-height: 1.12; }
      .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(21,17,14,.85) 0, rgba(21,17,14,.25) 18%, rgba(255,230,200,.12) 46%, rgba(21,17,14,.25) 80%, rgba(21,17,14,.85) 100%); pointer-events: none; }
    
    
      .stage { padding: 40px 100px 0; display: grid; grid-template-columns: 1fr 760px; align-items: center; column-gap: 60px; }
      .title { font-size: 96px; text-align: left; }
      .vase { width: 660px; height: 900px; margin-top: 40px; }
      .band { top: 300px; height: 360px; }
      .panel { width: 660px; padding: 0 110px; gap: 14px; }
      .panel b { font-size: 96px; }
      .panel span { font-size: 50px; }
      @keyframes turn { 0%, 14% { transform: translateX(0); } 24%, 38% { transform: translateX(-660px); } 48%, 62% { transform: translateX(-1320px); } 72%, 100% { transform: translateX(-1980px); } }
    
  </style>
</head>
<body>
  <div id="root" class="L" data-composition-id="main" data-width="1920" data-height="1080" data-start="0" data-duration="6" data-composition-variables='{"title":"Huyền thoại chiếc túi cói","chapter_1":"Một làng nghề sắp mất","chapter_2":"Hai chị em mang túi lên phố","chapter_3":"Một bức ảnh lan khắp mạng","chapter_4":"Làng nghề có đơn đến tận năm sau"}'>
    <div class="stage">
        <div class="title" data-slot="title"></div>
        <div class="vase">
          <div class="band"><div class="key t"></div><div class="strip" id="strip"></div><div class="key b"></div></div>
          <div class="shade"></div>
        </div>
      </div>
  </div>
  <script>
    // Caller values: window.__hyperframes.getVariables(), merged over the declared defaults
    // so the file still previews on its own. Built once, before the first seek.
    function getVariables() {
      let d = {};
      try { d = JSON.parse(document.getElementById("root").getAttribute("data-composition-variables") || "{}"); } catch (e) {}
      const hf = window.__hyperframes;
      const p = hf && typeof hf.getVariables === "function" ? hf.getVariables() || {} : {};
      return Object.assign({}, d, p);
    }
    const v = getVariables();
    const has = (k) => v[k] !== undefined && v[k] !== null && String(v[k]).trim() !== "";
    document.querySelectorAll("[data-slot]").forEach((el) => {
      const k = el.getAttribute("data-slot");
      if (!has(k)) { (el.closest("[data-slot-box]") || el).remove(); return; }
      el.textContent = String(v[k]);
    });
    /** One span per character, each starting `step` seconds after the last — a typewriter. */
    function typeInto(el, text, start, step) {
      el.textContent = "";
      [...String(text)].forEach((ch, i) => {
        const s = document.createElement("span");
        s.className = "ch";
        s.textContent = ch;
        s.style.animationDelay = (start + i * step).toFixed(3) + "s";
        el.appendChild(s);
      });
      return start + [...String(text)].length * step;
    }
    /** Odometer: every digit becomes a 0–9 column that rolls to its value. */
    function odometer(el, text, start) {
      el.textContent = "";
      let n = 0;
      [...String(text)].forEach((ch) => {
        if (/[0-9]/.test(ch)) {
          const col = document.createElement("span");
          col.className = "odo";
          const strip = document.createElement("span");
          strip.className = "odo-strip";
          for (let d = 0; d <= 9; d++) { const x = document.createElement("span"); x.textContent = d; strip.appendChild(x); }
          strip.style.setProperty("--d", ch);
          strip.style.animationDelay = (start + n++ * 0.07).toFixed(2) + "s";
          const size = document.createElement("span");
          size.className = "odo-size";
          size.textContent = ch;
          col.appendChild(size);
          col.appendChild(strip);
          el.appendChild(col);
        } else {
          const s = document.createElement("span");
          s.className = "odo-sep";
          s.textContent = ch;
          el.appendChild(s);
        }
      });
    }
    
      (function () {
        const strip = document.getElementById("strip");
        const ROMAN = ["I", "II", "III", "IV"];
        let k = 0;
        for (let i = 1; i <= 4; i++) {
          if (!has("chapter_" + i)) continue;
          const p = document.createElement("div"); p.className = "panel";
          const b = document.createElement("b"); b.textContent = ROMAN[k++];
          const s = document.createElement("span"); s.textContent = v["chapter_" + i];
          p.appendChild(b); p.appendChild(s); strip.appendChild(p);
        }
      })();
    
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = window.__timelines["portrait"] = {
      duration: 6,
      seek(t) { document.getAnimations().forEach((a) => { a.pause(); a.currentTime = t * 1000; }); },
    };
  </script>
</body>
</html>
