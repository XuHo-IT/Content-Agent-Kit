<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Story · Swiss Grid Chapter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800&family=Roboto+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Patrick+Hand&family=Anton&display=swap" rel="stylesheet">
  <style>
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f2f0eb; }
    
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --spring: linear(0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%, 0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1);
    --snap: cubic-bezier(.2,.9,.1,1);
    --out: cubic-bezier(.16,1,.3,1);
  }
  #root { position: relative; overflow: hidden; width: 100%; height: 100%; font-family: 'Be Vietnam Pro', sans-serif; }
  #root::after {
    content: ""; position: absolute; inset: -30%; pointer-events: none; z-index: 0; opacity: .55;
    animation: ambient 16s linear infinite;
  }
  @keyframes ambient { from { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.08); } to { transform: rotate(360deg) scale(1); } }
  .stage { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; flex-direction: column; }
  .mono { font-family: 'Roboto Mono', monospace; }
  @keyframes rise { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.4); } 60% { opacity: 1; } 100% { opacity: 1; transform: scale(1); } }
  @keyframes wipeIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

    
      #root { background: #f2f0eb; color: #111111; --ease: cubic-bezier(.7,0,.2,1); }
      #root::after { inset: 0; background: linear-gradient(180deg, transparent 0, transparent 49.8%, rgba(227,38,43,.35) 50%, transparent 50.2%); background-size: 100% 200%; opacity: .7; animation: scan 7s linear infinite; }
      @keyframes scan { from { background-position: 0 100%; } to { background-position: 0 -100%; } }
      .cols { position: absolute; inset: 0; display: grid; z-index: 0; }
      .cols i { border-left: 2px solid rgba(17,17,17,.12); transform-origin: top; transform: scaleY(0); animation: col .6s var(--ease) forwards; }
      .cols i:nth-child(2) { animation-delay: .06s; } .cols i:nth-child(3) { animation-delay: .12s; } .cols i:nth-child(4) { animation-delay: .18s; } .cols i:nth-child(5) { animation-delay: .24s; } .cols i:nth-child(6) { animation-delay: .3s; }
      @keyframes col { to { transform: scaleY(1); } }
      .head { display: flex; justify-content: space-between; font-weight: 700; border-bottom: 3px solid #111; clip-path: inset(0 100% 0 0); animation: wipeIn .5s var(--ease) .2s forwards; }
      .head .ct { font-family: 'Roboto Mono', monospace; }
      .num { font-weight: 900; line-height: .8; letter-spacing: -.06em; clip-path: inset(100% 0 0 0); animation: up .8s var(--ease) .5s forwards; }
      @keyframes up { to { clip-path: inset(0 0 0 0); } }
      .title { font-weight: 900; line-height: 1.02; letter-spacing: -.02em; display: flex; flex-wrap: wrap; }
      .wb { display: inline-block; overflow: hidden; padding-bottom: .08em; margin-right: .26em; }
      .wb span { display: inline-block; transform: translateY(110%); animation: wordUp .55s var(--ease) forwards; }
      @keyframes wordUp { to { transform: none; } }
      .note { font-weight: 500; color: #4a4a4a; border-top: 3px solid #111; clip-path: inset(0 100% 0 0); animation: wipeIn .6s var(--ease) 2.6s forwards; }
      .sq { position: absolute; background: #e3262b; animation: escape 1.1s var(--ease) 3.4s forwards; }
      @keyframes escape { to { transform: translate(var(--ex), var(--ey)) rotate(14deg); } }
    
    
      .cols { left: 100px; right: 100px; grid-template-columns: repeat(6, 1fr); }
      .stage { padding: 70px 100px 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr auto; column-gap: 60px; row-gap: 26px; }
      .head { grid-column: 1 / span 2; font-size: 26px; padding-bottom: 12px; }
      .num { grid-column: 1; grid-row: 2 / span 2; font-size: 600px; align-self: end; }
      .title { grid-column: 2; grid-row: 2; align-self: end; font-size: 100px; }
      .note { grid-column: 2; grid-row: 3; font-size: 34px; padding-top: 18px; margin-bottom: 90px; }
      .sq { width: 140px; height: 140px; right: 100px; top: 150px; --ex: 160px; --ey: -200px; }
    
  </style>
</head>
<body>
  <div id="root" class="L" data-composition-id="main" data-width="1920" data-height="1080" data-start="0" data-duration="6" data-composition-variables='{"section":"Câu chuyện thương hiệu","counter":"03 / 05","numeral":"03","title":"Ngày chúng tôi suýt đóng cửa","note":"Tháng 3 năm 2021. Còn đúng hai tháng tiền thuê."}'>
    <div class="cols"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="stage">
        <div class="head"><span data-slot="section"></span><span class="ct" data-slot="counter"></span></div>
        <div class="num" data-slot="numeral"></div>
        <div class="title" id="title"></div>
        <div class="note" data-slot="note"></div>
      </div>
      <div class="sq"></div>
  </div>
  <script>
    // Caller values: window.__hyperframes.getVariables(), merged over the declared defaults
    // so the file still previews on its own. Built once, before the first seek.
    function getVariables() {
      let d = {};
      try { d = JSON.parse(document.getElementById("root").getAttribute("data-composition-variables") || "{}"); } catch (e) {}
      const hf = window.__hyperframes;
      const p = hf && typeof hf.getVariables === "function" ? hf.getVariables() || {} : {};
      return Object.assign({}, d, p);
    }
    const v = getVariables();
    const has = (k) => v[k] !== undefined && v[k] !== null && String(v[k]).trim() !== "";
    document.querySelectorAll("[data-slot]").forEach((el) => {
      const k = el.getAttribute("data-slot");
      if (!has(k)) { (el.closest("[data-slot-box]") || el).remove(); return; }
      el.textContent = String(v[k]);
    });
    /** One span per character, each starting `step` seconds after the last — a typewriter. */
    function typeInto(el, text, start, step) {
      el.textContent = "";
      [...String(text)].forEach((ch, i) => {
        const s = document.createElement("span");
        s.className = "ch";
        s.textContent = ch;
        s.style.animationDelay = (start + i * step).toFixed(3) + "s";
        el.appendChild(s);
      });
      return start + [...String(text)].length * step;
    }
    /** Odometer: every digit becomes a 0–9 column that rolls to its value. */
    function odometer(el, text, start) {
      el.textContent = "";
      let n = 0;
      [...String(text)].forEach((ch) => {
        if (/[0-9]/.test(ch)) {
          const col = document.createElement("span");
          col.className = "odo";
          const strip = document.createElement("span");
          strip.className = "odo-strip";
          for (let d = 0; d <= 9; d++) { const x = document.createElement("span"); x.textContent = d; strip.appendChild(x); }
          strip.style.setProperty("--d", ch);
          strip.style.animationDelay = (start + n++ * 0.07).toFixed(2) + "s";
          const size = document.createElement("span");
          size.className = "odo-size";
          size.textContent = ch;
          col.appendChild(size);
          col.appendChild(strip);
          el.appendChild(col);
        } else {
          const s = document.createElement("span");
          s.className = "odo-sep";
          s.textContent = ch;
          el.appendChild(s);
        }
      });
    }
    
      (function () {
        const box = document.getElementById("title");
        String(v.title || "").split(/\s+/).filter(Boolean).forEach((w, i) => {
          const b = document.createElement("span"); b.className = "wb";
          const s = document.createElement("span"); s.textContent = w; s.style.animationDelay = (1.2 + i * 0.12).toFixed(2) + "s";
          b.appendChild(s); box.appendChild(b);
        });
      })();
    
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = window.__timelines["portrait"] = {
      duration: 6,
      seek(t) { document.getAnimations().forEach((a) => { a.pause(); a.currentTime = t * 1000; }); },
    };
  </script>
</body>
</html>
