<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1920, height=1080" />
        <title>Build Minimal · Vox Editorial</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=JetBrains+Mono:wght@700;800&family=Playfair+Display:ital,wght@0,800;0,900;1,800;1,900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
            rel="stylesheet"
        />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fef08a; }
            #root {
                position: relative; width: 1920px; height: 1080px;
                background: #fef08a; color: #090d16;
                font-family: "Plus Jakarta Sans", sans-serif;
                overflow: hidden; padding: 80px 120px;
                display: flex; flex-direction: column; justify-content: space-between;
            }

            .vox-halftone {
                position: absolute; inset: 0;
                background-image: radial-gradient(rgba(0,0,0,0.06) 1.5px, transparent 0);
                background-size: 24px 24px; pointer-events: none;
            }

            .top-bar {
                position: relative; z-index: 2;
                display: flex; justify-content: space-between; align-items: center;
                border-bottom: 2px solid #090d16; padding-bottom: 20px;
            }
            .eyebrow-tag {
                font-family: "JetBrains Mono", monospace; font-size: 20px; font-weight: 800;
                background: #dc2626; color: #ffffff; padding: 6px 18px; border-radius: 4px;
                letter-spacing: 2px; text-transform: uppercase;
            }
            .side-tag {
                font-family: "JetBrains Mono", monospace; font-size: 18px; font-weight: 700;
                color: #4b5563; text-transform: uppercase;
            }

            .center-hero-wrap {
                position: relative; z-index: 2; margin: auto 0;
            }
            .hero-word {
                font-family: "Playfair Display", serif; font-size: 140px; font-weight: 900;
                color: #090d16; letter-spacing: -0.03em; line-height: 1.1;
                opacity: 0; animation: popUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
            }
            .hero-word .ch { display: inline-block; }

            .desc-box {
                position: relative; z-index: 2;
                max-width: 800px;
                border-left: 6px solid #dc2626; padding-left: 24px;
                font-family: "Playfair Display", serif; font-size: 36px; font-weight: 700;
                color: #1e293b; line-height: 1.35;
                opacity: 0; animation: popUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
            }

            @keyframes popUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
        </style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="5"
            data-width="1920"
            data-height="1080"
            data-composition-variables='{"eyebrow":"Đột Phá","hero":"Vượt trội","desc":"Nhanh hơn, thông minh hơn, và hiểu tiếng Việt tốt hơn hẳn.","side_left":"","side_right":"Bản tin AI"}'
        >
            <div class="vox-halftone"></div>

            <div class="top-bar">
                <div class="eyebrow-tag"></div>
                <div class="side-tag right-tag"></div>
            </div>

            <div class="center-hero-wrap">
                <div class="hero-word"></div>
            </div>

            <div class="desc-box"></div>
        </div>

        <script>
            (function () {
                var v = window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                    ? window.__hyperframes.getVariables() : {};
                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null && String(text).length) el.textContent = String(text);
                };
                set(".eyebrow-tag", v.eyebrow || "");
                set(".right-tag", v.side_right || "");
                set(".desc-box", v.desc || "");

                var heroEl = document.querySelector(".hero-word");
                var heroText = String(v.hero || "").trim();
                if (heroEl && heroText) {
                    heroEl.textContent = "";
                    for (var i = 0; i < heroText.length; i++) {
                        var span = document.createElement("span");
                        span.className = "ch";
                        span.textContent = heroText[i];
                        heroEl.appendChild(span);
                    }
                }
            })();
        </script>
    </body>
</html>
