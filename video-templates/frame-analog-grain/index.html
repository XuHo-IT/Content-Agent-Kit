<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1920, height=1080" />
        <title>Analog Grain · 16:9</title>
        <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet" />
        <style>
/*
 * frame-analog-grain — tape stock, scan lines, a title that will not sit still.
 *
 * Original work for this repo.
 *
 * Every other template in this kit is clean, and so is everything else generated
 * by a machine. That is exactly why the worn look reads: it is the one surface a
 * viewer does not assume was produced in a second.
 *
 * Three effects, all CSS and SVG, no assets:
 *
 *   · grain      — an SVG feTurbulence tile, animated by shifting its background
 *                  position. A PNG would have been an asset to ship and license.
 *   · scan lines — a repeating-linear-gradient that drifts down one period, so
 *                  the roll is continuous and never seams.
 *   · aberration — the title is drawn three times, the red and cyan copies
 *                  offset a pixel or two. That is what chromatic aberration is;
 *                  a filter would only approximate it.
 *
 * `timecode` and `tape` are the furniture that makes the rest read as tape
 * rather than as a mistake, and both are slots — an empty one is removed.
 */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow: hidden; }
html, body { width: 1920px; height: 1080px; }
#root { position: relative; width: 1920px; height: 1080px; overflow: hidden;
        font-family: "Be Vietnam Pro", sans-serif; }
#root { background: #14120f; color: #ece5d8; display: grid; place-items: center;
        font-family: "Be Vietnam Pro", monospace; }
.grain { position: absolute; inset: -20%; opacity: 0.16; pointer-events: none; mix-blend-mode: screen;
         background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
         animation: grain 0.6s steps(6) infinite; }
.scan { position: absolute; inset: 0; pointer-events: none; opacity: 0.35;
        background: repeating-linear-gradient(to bottom,
            rgba(0,0,0,0.42) 0px, rgba(0,0,0,0.42) 2px, transparent 2px, transparent 5px);
        animation: roll 7s linear infinite; }
.corner { position: absolute; letter-spacing: 0.18em; color: #d9c48a; opacity: 0;
          animation: blink 0.5s steps(2) 0.2s forwards; }
.mid { position: relative; text-align: center; }
.title { font-weight: 900; letter-spacing: -0.01em; line-height: 1; position: relative;
         animation: jitter 3.4s steps(1) infinite; }
/* Drawn three times, offset — that IS chromatic aberration, not a filter approximating it. */
.title::before, .title::after { content: attr(data-text); position: absolute; inset: 0; }
.title::before { color: #ff3b3b; transform: translate(-3px, 1px); mix-blend-mode: screen; }
.title::after  { color: #2ad4ff; transform: translate(3px, -1px);  mix-blend-mode: screen; }
.subtitle { color: #a89c86; letter-spacing: 0.1em; opacity: 0;
            animation: blink 0.4s steps(2) 0.9s forwards; }
@keyframes grain { 0%{background-position:0 0} 20%{background-position:-40px 30px}
    40%{background-position:60px -20px} 60%{background-position:-30px -50px}
    80%{background-position:50px 40px} 100%{background-position:0 0} }
@keyframes roll { to { background-position: 0 5px; } }
@keyframes blink { 0%{opacity:0} 50%{opacity:0.5} 100%{opacity:1} }
@keyframes jitter { 0%,88%{transform:none} 90%{transform:translateX(-4px)}
    92%{transform:translateX(3px)} 94%{transform:none} }
.corner { font-size: 26px; }
.tl { top: 64px; left: 76px; } .tr { top: 64px; right: 76px; }
.title { font-size: 172px; }
.subtitle { font-size: 36px; margin-top: 36px; }
        </style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="6"
            data-width="1920"
            data-height="1080"
            data-composition-variables='{"tape":"SP · 1998","timecode":"00:14:22","title":"Tiêu đề","subtitle":"Một dòng phụ ngắn"}'
        >
            <div class="grain"></div>
            <div class="scan"></div>
            <div class="corner tl"><span class="tape"></span></div>
            <div class="corner tr"><span class="timecode"></span></div>
            <div class="mid">
                <div class="title" data-text=""></div>
                <div class="subtitle"></div>
            </div>
        </div>
        <script>
            (function () {
                var v =
                    window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                        ? window.__hyperframes.getVariables()
                        : {};
                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null && String(text).length) el.textContent = String(text);
                };
                var drop = function (sel) {
                    var el = document.querySelector(sel);
                    if (el) el.remove();
                };
                // A slot left empty removes its element rather than rendering a gap. An empty
                // heading reads as missing data; an absent one reads as a deliberate omission.
                var setOrDrop = function (sel, text) {
                    if (text == null || !String(text).trim()) return drop(sel);
                    set(sel, text);
                };
                setOrDrop(".tape", v.tape);
                setOrDrop(".timecode", v.timecode);
                setOrDrop(".subtitle", v.subtitle);
                var t = document.querySelector(".title");
                if (String(v.title || "").trim()) {
                    t.textContent = String(v.title);
                    // The ::before/::after copies read the text from the attribute, so it has
                    // to be set alongside the content or the aberration renders empty.
                    t.setAttribute("data-text", String(v.title));
                } else {
                    drop(".title");
                }
                if (!document.querySelector(".tape")) drop(".tl");
                if (!document.querySelector(".timecode")) drop(".tr");
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = {
                pause: function () {},
                seek: function () {},
                paused: function () { return true; },
            };
        </script>
    </body>
</html>
