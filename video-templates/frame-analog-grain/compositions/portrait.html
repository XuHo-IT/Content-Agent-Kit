<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1080, height=1920" />
        <title>Analog Grain · Portrait</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Playfair+Display:ital,wght@0,900;1,900&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { overflow: hidden; width: 1080px; height: 1920px; }
            #root {
                position: relative; width: 1080px; height: 1920px; overflow: hidden;
                background: #fde68a; color: #090d16;
                font-family: "Plus Jakarta Sans", sans-serif;
                display: grid; place-items: center; padding: 100px 60px;
            }

            .grain {
                position: absolute; inset: -20%; opacity: 0.22; pointer-events: none; mix-blend-mode: multiply;
                background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
                animation: grain 0.5s steps(5) infinite;
            }

            .scan {
                position: absolute; inset: 0; pointer-events: none; opacity: 0.15;
                background: repeating-linear-gradient(to bottom,
                    rgba(0,0,0,0.4) 0px, rgba(0,0,0,0.4) 2px, transparent 2px, transparent 6px);
                animation: roll 8s linear infinite;
            }

            .corner {
                position: absolute; font-family: "JetBrains Mono", monospace;
                font-size: 24px; font-weight: 800; letter-spacing: 2px;
                color: #090d16; background: rgba(0,0,0,0.06); padding: 8px 18px; border-radius: 4px;
                border: 1px solid rgba(0,0,0,0.15);
            }
            .tl { top: 80px; left: 60px; }
            .tr { top: 80px; right: 60px; color: #dc2626; display: flex; align-items: center; gap: 8px; }
            .tr::before { content: "●"; font-size: 20px; color: #dc2626; animation: blinkRec 1s ease-in-out infinite; }

            .mid { position: relative; z-index: 2; text-align: center; max-width: 960px; }

            .title {
                font-family: "Playfair Display", serif; font-size: 110px; font-weight: 900;
                line-height: 1.05; color: #090d16; letter-spacing: -0.03em;
                position: relative; animation: jitter 3s steps(1) infinite;
            }
            .title::before, .title::after { content: attr(data-text); position: absolute; inset: 0; }
            .title::before { color: #dc2626; transform: translate(-3px, 1px); mix-blend-mode: multiply; opacity: 0.6; }
            .title::after  { color: #0284c7; transform: translate(3px, -1px); mix-blend-mode: multiply; opacity: 0.6; }

            .subtitle {
                font-family: "Plus Jakarta Sans", sans-serif; font-size: 34px; font-weight: 800;
                color: #1e293b; letter-spacing: -0.01em; margin-top: 36px;
                background: #090d16; color: #fde68a; padding: 12px 28px; border-radius: 6px;
                display: inline-block; line-height: 1.3;
            }

            @keyframes grain { 0%{background-position:0 0} 20%{background-position:-40px 30px} 40%{background-position:60px -20px} 60%{background-position:-30px -50px} 80%{background-position:50px 40px} 100%{background-position:0 0} }
            @keyframes roll { to { background-position: 0 6px; } }
            @keyframes jitter { 0%,88%{transform:none} 90%{transform:translateX(-3px)} 92%{transform:translateX(2px)} 94%{transform:none} }
            @keyframes blinkRec { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        </style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="portrait"
            data-start="0"
            data-duration="6"
            data-width="1080"
            data-height="1920"
            data-composition-variables='{"tape":"SP · 1998","timecode":"00:14:22","title":"Tiêu đề","subtitle":"Một dòng phụ ngắn"}'
        >
            <div class="grain"></div>
            <div class="scan"></div>
            <div class="corner tl"><span class="tape"></span></div>
            <div class="corner tr"><span class="timecode"></span></div>
            <div class="mid">
                <div class="title" data-text=""></div>
                <div class="subtitle"></div>
            </div>
        </div>
        <script>
            (function () {
                var v = window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                    ? window.__hyperframes.getVariables() : {};
                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null && String(text).length) el.textContent = String(text);
                };
                var drop = function (sel) {
                    var el = document.querySelector(sel);
                    if (el) el.remove();
                };
                var setOrDrop = function (sel, text) {
                    if (text == null || !String(text).trim()) return drop(sel);
                    set(sel, text);
                };
                setOrDrop(".tape", v.tape);
                setOrDrop(".timecode", v.timecode);
                setOrDrop(".subtitle", v.subtitle);
                set(".title", v.title);
                var t = document.querySelector(".title");
                if (t && v.title) t.setAttribute("data-text", v.title);
            })();
        </script>
    </body>
</html>
