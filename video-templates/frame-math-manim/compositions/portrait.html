<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
        <title>Math & Formula Derivation (Manim Style) - Portrait</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&family=STIX+Two+Text:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap"
            rel="stylesheet"
        />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                background: #080d1a;
                color: #f1f5f9;
                font-family: "Plus Jakarta Sans", sans-serif;
                width: 1080px; height: 1920px;
                overflow: hidden;
            }
            #root {
                width: 100%; height: 100%; position: relative;
                display: flex; flex-direction: column; justify-content: space-between;
                padding: 96px 64px;
            }

            .grid-bg {
                position: absolute; inset: 0; z-index: 0;
                background-image: radial-gradient(rgba(56, 189, 248, 0.08) 1px, transparent 1px),
                                  linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                                  linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
                background-size: 40px 40px, 80px 80px, 80px 80px;
                opacity: 0.8;
            }

            .header-bar {
                position: relative; z-index: 2;
                opacity: 0; animation: fadeDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
            }
            .kicker-tag {
                display: inline-flex; align-items: center; gap: 8px;
                background: rgba(56, 189, 248, 0.12); color: #38bdf8;
                border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 9999px;
                padding: 8px 22px; font-family: "JetBrains Mono", monospace;
                font-size: 18px; font-weight: 700; letter-spacing: 1.5px;
                text-transform: uppercase; margin-bottom: 16px;
            }
            .main-title {
                font-size: 48px; font-weight: 800; letter-spacing: -0.02em;
                color: #ffffff; line-height: 1.2;
            }

            .graph-panel {
                position: relative; z-index: 2;
                background: rgba(15, 23, 42, 0.7);
                border: 1px solid rgba(56, 189, 248, 0.25);
                border-radius: 20px; padding: 24px;
                display: flex; flex-direction: column; align-items: center;
                box-shadow: 0 20px 40px rgba(0,0,0,0.5);
                opacity: 0; animation: fadeIn 0.6s ease 0.3s both;
                margin: 20px 0;
            }
            .graph-svg {
                width: 100%; height: 260px; overflow: visible;
            }
            .axis-line { stroke: #475569; stroke-width: 3; }
            .grid-sub { stroke: rgba(255, 255, 255, 0.06); stroke-dasharray: 6 6; }
            .func-curve {
                fill: none; stroke: #38bdf8; stroke-width: 5; stroke-linecap: round;
                filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.8));
                stroke-dasharray: 1000; stroke-dashoffset: 1000;
                animation: drawCurve 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
            }
            .optima-point {
                fill: #fbbf24; stroke: #ffffff; stroke-width: 4;
                filter: drop-shadow(0 0 16px #fbbf24);
                opacity: 0; animation: pointPop 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
            }
            .graph-badge {
                margin-top: 16px; font-family: "JetBrains Mono", monospace;
                font-size: 18px; font-weight: 700; color: #38bdf8;
                background: rgba(56, 189, 248, 0.12); padding: 8px 20px;
                border-radius: 8px;
            }

            .derivation-list {
                position: relative; z-index: 2;
                display: flex; flex-direction: column; gap: 20px;
            }
            .math-card {
                background: rgba(15, 23, 42, 0.8);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-left: 6px solid #38bdf8;
                border-radius: 14px; padding: 22px 28px;
                backdrop-filter: blur(16px);
                opacity: 0; transform: translateY(20px);
            }
            .card-1 { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both; border-left-color: #38bdf8; }
            .card-2 { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both; border-left-color: #818cf8; }
            .card-3 { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.9s both; border-left-color: #34d399; }

            .step-lbl {
                font-family: "JetBrains Mono", monospace; font-size: 15px;
                font-weight: 700; color: #94a3b8; letter-spacing: 1.5px;
                margin-bottom: 8px; text-transform: uppercase;
            }
            .math-formula {
                font-family: "STIX Two Text", "Cambria Math", serif;
                font-size: 26px; font-style: italic; font-weight: 600;
                color: #f8fafc; line-height: 1.3;
                text-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
            }

            .bottom-bar {
                position: relative; z-index: 2;
                background: rgba(30, 41, 59, 0.85);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 16px; padding: 26px 32px;
                opacity: 0; animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.1s both;
            }
            .takeaway-text {
                font-size: 24px; font-weight: 600; color: #e2e8f0; line-height: 1.4;
            }

            @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
            @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: none; } }
            @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
            @keyframes drawCurve { to { stroke-dashoffset: 0; } }
            @keyframes pointPop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
            @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
        </style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="5"
            data-width="1080"
            data-height="1920"
            data-composition-variables='{"kicker":"CHỨNG MINH TOÁN HỌC & GIẢI THUẬT","formula_title":"Biến Đổi Tối Ưu Hàm Mục Tiêu Loss Function","step_1_label":"BƯỚC 1: XÁC ĐỊNH HÀM","step_1_math":"L(θ) = - 1/N ∑ [y_i · log(p_i) + (1-y_i) · log(1-p_i)]","step_2_label":"BƯỚC 2: TÍNH ĐẠO HÀM GRADIENT","step_2_math":"∇_θ L(θ) = 1/N ∑ (p_i - y_i) · x_i  ➔  min L(θ)","step_3_label":"BƯỚC 3: CẬP NHẬT TRỌNG SỐ","step_3_math":"θ_{t+1} = θ_t - η · ∇_θ L(θ_t) + γ · v_{t-1}","graph_label":"CONVERGENCE RATE: O(1/k²)","takeaway":"Tốc độ hội tụ tối ưu đạt cực tiểu toàn cục nhanh hơn 3.8x so với gradient descent truyền thống."}'
        >
            <div class="grid-bg"></div>

            <div class="header-bar">
                <div class="kicker-tag"><span class="kicker-txt"></span></div>
                <div class="main-title"></div>
            </div>

            <div class="graph-panel">
                <svg class="graph-svg" viewBox="0 0 500 240">
                    <line class="grid-sub" x1="50" y1="40" x2="480" y2="40" />
                    <line class="grid-sub" x1="50" y1="100" x2="480" y2="100" />
                    <line class="grid-sub" x1="50" y1="160" x2="480" y2="160" />
                    <line class="axis-line" x1="50" y1="20" x2="50" y2="210" />
                    <line class="axis-line" x1="30" y1="190" x2="480" y2="190" />
                    <path class="func-curve" d="M 60,35 Q 260,250 460,40" />
                    <circle class="optima-point" cx="260" cy="142" r="9" />
                </svg>
                <div class="graph-badge"><span class="gb-txt"></span></div>
            </div>

            <div class="derivation-list">
                <div class="math-card card-1">
                    <div class="step-lbl s1-lbl"></div>
                    <div class="math-formula s1-math"></div>
                </div>
                <div class="math-card card-2">
                    <div class="step-lbl s2-lbl"></div>
                    <div class="math-formula s2-math"></div>
                </div>
                <div class="math-card card-3">
                    <div class="step-lbl s3-lbl"></div>
                    <div class="math-formula s3-math"></div>
                </div>
            </div>

            <div class="bottom-bar">
                <div class="takeaway-text"></div>
            </div>
        </div>

        <script>
            (function () {
                var v = window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                    ? window.__hyperframes.getVariables() : {};
                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null && String(text).trim() !== "") el.textContent = String(text);
                };
                set(".kicker-txt", v.kicker);
                set(".main-title", v.formula_title);
                set(".s1-lbl", v.step_1_label);
                set(".s1-math", v.step_1_math);
                set(".s2-lbl", v.step_2_label);
                set(".s2-math", v.step_2_math);
                set(".s3-lbl", v.step_3_label);
                set(".s3-math", v.step_3_math);
                set(".gb-txt", v.graph_label || "CONVERGENCE PROOF");
                set(".takeaway-text", v.takeaway);
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = { pause: function () {}, seek: function () {}, paused: function () { return true; } };
        </script>
    </body>
</html>
