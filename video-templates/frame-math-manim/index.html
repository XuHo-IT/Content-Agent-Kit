<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0" />
        <title>Math & Formula Derivation (Manim Style)</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&family=STIX+Two+Text:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap"
            rel="stylesheet"
        />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                background: #080d1a;
                color: #f1f5f9;
                font-family: "Plus Jakarta Sans", sans-serif;
                width: 1920px; height: 1080px;
                overflow: hidden;
            }
            #root {
                width: 100%; height: 100%; position: relative;
                display: flex; flex-direction: column; justify-content: space-between;
                padding: 64px 88px;
            }

            /* Math Grid Background */
            .grid-bg {
                position: absolute; inset: 0; z-index: 0;
                background-image: radial-gradient(rgba(56, 189, 248, 0.08) 1px, transparent 1px),
                                  linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                                  linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
                background-size: 40px 40px, 80px 80px, 80px 80px;
                opacity: 0.8;
            }

            /* Header */
            .header-bar {
                position: relative; z-index: 2;
                display: flex; justify-content: space-between; align-items: flex-start;
                opacity: 0; animation: fadeDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
            }
            .kicker-tag {
                display: inline-flex; align-items: center; gap: 8px;
                background: rgba(56, 189, 248, 0.12); color: #38bdf8;
                border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 9999px;
                padding: 6px 18px; font-family: "JetBrains Mono", monospace;
                font-size: 15px; font-weight: 700; letter-spacing: 1.5px;
                text-transform: uppercase; margin-bottom: 12px;
            }
            .main-title {
                font-size: 44px; font-weight: 800; letter-spacing: -0.02em;
                color: #ffffff; line-height: 1.2;
            }
            .theorem-badge {
                background: rgba(251, 191, 36, 0.15); color: #fbbf24;
                border: 1px solid rgba(251, 191, 36, 0.4); border-radius: 8px;
                padding: 10px 20px; font-family: "JetBrains Mono", monospace;
                font-size: 16px; font-weight: 700;
            }

            /* Main Split Stage */
            .stage-split {
                position: relative; z-index: 2;
                display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 48px;
                align-items: center; margin: 10px 0;
            }

            /* Left: Derivation Steps */
            .derivation-col {
                display: flex; flex-direction: column; gap: 20px;
            }
            .math-card {
                background: rgba(15, 23, 42, 0.75);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-left: 4px solid #38bdf8;
                border-radius: 12px; padding: 20px 26px;
                backdrop-filter: blur(16px);
                opacity: 0; transform: translateX(-30px);
            }
            .card-1 { animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; border-left-color: #38bdf8; }
            .card-2 { animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both; border-left-color: #818cf8; }
            .card-3 { animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both; border-left-color: #34d399; }

            .step-lbl {
                font-family: "JetBrains Mono", monospace; font-size: 14px;
                font-weight: 700; color: #94a3b8; letter-spacing: 1px;
                margin-bottom: 8px; text-transform: uppercase;
            }
            .math-formula {
                font-family: "STIX Two Text", "Cambria Math", serif;
                font-size: 28px; font-style: italic; font-weight: 600;
                color: #f8fafc; line-height: 1.3;
                text-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
            }

            /* Right: Coordinate Plot Graphic */
            .graph-col {
                background: rgba(15, 23, 42, 0.6);
                border: 1px solid rgba(56, 189, 248, 0.2);
                border-radius: 16px; padding: 28px;
                display: flex; flex-direction: column; align-items: center;
                box-shadow: 0 20px 40px rgba(0,0,0,0.5);
                opacity: 0; animation: fadeIn 0.6s ease 0.4s both;
            }
            .graph-svg {
                width: 100%; height: 260px; overflow: visible;
            }
            .axis-line { stroke: #475569; stroke-width: 2; }
            .grid-sub { stroke: rgba(255, 255, 255, 0.05); stroke-dasharray: 4 4; }
            .func-curve {
                fill: none; stroke: #38bdf8; stroke-width: 4; stroke-linecap: round;
                filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.8));
                stroke-dasharray: 1000; stroke-dashoffset: 1000;
                animation: drawCurve 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
            }
            .optima-point {
                fill: #fbbf24; stroke: #ffffff; stroke-width: 3;
                filter: drop-shadow(0 0 12px #fbbf24);
                opacity: 0; animation: pointPop 0.4s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
            }
            .graph-badge {
                margin-top: 14px; font-family: "JetBrains Mono", monospace;
                font-size: 15px; font-weight: 700; color: #38bdf8;
                background: rgba(56, 189, 248, 0.1); padding: 6px 16px;
                border-radius: 6px;
            }

            /* Bottom Takeaway */
            .bottom-bar {
                position: relative; z-index: 2;
                background: rgba(30, 41, 59, 0.7);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 12px; padding: 20px 32px;
                opacity: 0; animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.9s both;
            }
            .takeaway-text {
                font-size: 22px; font-weight: 600; color: #e2e8f0; line-height: 1.4;
            }

            @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
            @keyframes slideIn { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: none; } }
            @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: none; } }
            @keyframes drawCurve { to { stroke-dashoffset: 0; } }
            @keyframes pointPop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
            @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
        </style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="5"
            data-width="1920"
            data-height="1080"
            data-composition-variables='{"kicker":"CHỨNG MINH TOÁN HỌC & GIẢI THUẬT","formula_title":"Biến Đổi Tối Ưu Hàm Mục Tiêu Loss Function","step_1_label":"BƯỚC 1: XÁC ĐỊNH HÀM","step_1_math":"L(θ) = - 1/N ∑ [y_i · log(p_i) + (1-y_i) · log(1-p_i)]","step_2_label":"BƯỚC 2: TÍNH ĐẠO HÀM GRADIENT","step_2_math":"∇_θ L(θ) = 1/N ∑ (p_i - y_i) · x_i  ➔  min L(θ)","step_3_label":"BƯỚC 3: CẬP NHẬT TRỌNG SỐ","step_3_math":"θ_{t+1} = θ_t - η · ∇_θ L(θ_t) + γ · v_{t-1}","graph_label":"CONVERGENCE RATE: O(1/k²)","takeaway":"Tốc độ hội tụ tối ưu đạt cực tiểu toàn cục nhanh hơn 3.8x so với gradient descent truyền thống."}'
        >
            <div class="grid-bg"></div>

            <div class="header-bar">
                <div>
                    <div class="kicker-tag"><span class="kicker-txt"></span></div>
                    <div class="main-title"></div>
                </div>
                <div class="theorem-badge"><span class="tb-txt"></span></div>
            </div>

            <div class="stage-split">
                <div class="derivation-col">
                    <div class="math-card card-1">
                        <div class="step-lbl s1-lbl"></div>
                        <div class="math-formula s1-math"></div>
                    </div>
                    <div class="math-card card-2">
                        <div class="step-lbl s2-lbl"></div>
                        <div class="math-formula s2-math"></div>
                    </div>
                    <div class="math-card card-3">
                        <div class="step-lbl s3-lbl"></div>
                        <div class="math-formula s3-math"></div>
                    </div>
                </div>

                <div class="graph-col">
                    <svg class="graph-svg" viewBox="0 0 500 260">
                        <line class="grid-sub" x1="50" y1="50" x2="480" y2="50" />
                        <line class="grid-sub" x1="50" y1="120" x2="480" y2="120" />
                        <line class="grid-sub" x1="50" y1="190" x2="480" y2="190" />
                        <!-- Axis -->
                        <line class="axis-line" x1="50" y1="20" x2="50" y2="230" />
                        <line class="axis-line" x1="30" y1="210" x2="480" y2="210" />
                        <!-- Parabolic Loss Curve -->
                        <path class="func-curve" d="M 60,35 Q 260,260 460,40" />
                        <!-- Optimal Global Minima -->
                        <circle class="optima-point" cx="260" cy="148" r="8" />
                    </svg>
                    <div class="graph-badge"><span class="gb-txt"></span></div>
                </div>
            </div>

            <div class="bottom-bar">
                <div class="takeaway-text"></div>
            </div>
        </div>

        <script>
            (function () {
                var v = window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                    ? window.__hyperframes.getVariables() : {};
                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null && String(text).trim() !== "") el.textContent = String(text);
                };
                set(".kicker-txt", v.kicker);
                set(".main-title", v.formula_title);
                set(".tb-txt", "THEOREM // MANIM");
                set(".s1-lbl", v.step_1_label);
                set(".s1-math", v.step_1_math);
                set(".s2-lbl", v.step_2_label);
                set(".s2-math", v.step_2_math);
                set(".s3-lbl", v.step_3_label);
                set(".s3-math", v.step_3_math);
                set(".gb-txt", v.graph_label || "CONVERGENCE PROOF");
                set(".takeaway-text", v.takeaway);
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = window.__timelines["portrait"] = { pause: function () {}, seek: function () {}, paused: function () { return true; } };
        </script>
    </body>
</html>
