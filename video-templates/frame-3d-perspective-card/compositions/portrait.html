<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
        <title>3D Perspective Tilt Card - Portrait</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;700;800;900&family=Cabinet+Grotesk:wght@800;900&display=swap"
            rel="stylesheet"
        />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                background: #060911;
                color: #f8fafc;
                font-family: "Plus Jakarta Sans", sans-serif;
                width: 1080px; height: 1920px;
                overflow: hidden;
            }
            #root {
                width: 100%; height: 100%; position: relative;
                display: flex; flex-direction: column; justify-content: space-between;
                padding: 96px 64px; perspective: 1200px;
            }

            .ambient-mesh {
                position: absolute; inset: 0; z-index: 0;
                background: radial-gradient(circle at 70% 30%, rgba(99, 102, 241, 0.18), transparent 60%),
                            radial-gradient(circle at 30% 70%, rgba(236, 72, 153, 0.15), transparent 60%);
                pointer-events: none;
            }

            .header-bar {
                position: relative; z-index: 2;
                opacity: 0; animation: fadeDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
            }
            .kicker-tag {
                display: inline-flex; align-items: center; gap: 8px;
                background: rgba(99, 102, 241, 0.15); color: #818cf8;
                border: 1px solid rgba(99, 102, 241, 0.4); border-radius: 9999px;
                padding: 8px 22px; font-family: "JetBrains Mono", monospace;
                font-size: 18px; font-weight: 700; letter-spacing: 1.5px;
                text-transform: uppercase; margin-bottom: 16px;
            }
            .main-title {
                font-size: 48px; font-weight: 800; letter-spacing: -0.02em;
                color: #ffffff; line-height: 1.2;
            }

            .card-viewport {
                perspective: 1000px; display: flex; justify-content: center;
                margin: 20px 0;
            }
            .card-3d {
                width: 500px; height: 310px;
                background: linear-gradient(135deg, #1e1b4b, #0f172a 60%, #1e293b);
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 24px; padding: 32px;
                display: flex; flex-direction: column; justify-content: space-between;
                box-shadow: -20px 30px 60px rgba(0,0,0,0.8),
                            0 0 30px rgba(99, 102, 241, 0.3);
                position: relative; overflow: hidden;
                transform-style: preserve-3d;
                animation: tiltCard 4s ease-in-out infinite alternate, popIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
            }
            .card-sheen {
                position: absolute; top: -100px; left: -100px; width: 300px; height: 500px;
                background: linear-gradient(to right, transparent, rgba(255,255,255,0.15), transparent);
                transform: rotate(35deg); pointer-events: none;
                animation: sheenPass 3s ease-in-out infinite;
            }
            .card-top-row { display: flex; justify-content: space-between; align-items: center; }
            .chip-pill {
                background: rgba(251, 191, 36, 0.2); border: 1px solid #fbbf24;
                color: #fbbf24; padding: 4px 12px; border-radius: 6px;
                font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 700;
            }
            .tier-tag {
                font-family: "JetBrains Mono", monospace; font-size: 14px;
                font-weight: 800; color: #a5b4fc; letter-spacing: 1px;
            }
            .card-brand {
                font-family: "Cabinet Grotesk", sans-serif;
                font-size: 26px; font-weight: 900; color: #ffffff;
            }
            .card-id-row {
                font-family: "JetBrains Mono", monospace;
                font-size: 22px; font-weight: 700; color: #94a3b8; letter-spacing: 4px;
            }

            .features-col {
                position: relative; z-index: 2;
                display: flex; flex-direction: column; gap: 18px;
            }
            .feature-card {
                background: rgba(15, 23, 42, 0.85);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-left: 6px solid #818cf8;
                border-radius: 16px; padding: 22px 26px;
                display: flex; align-items: center; gap: 16px;
                backdrop-filter: blur(16px);
                opacity: 0; transform: translateY(20px);
            }
            .fc-1 { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both; }
            .fc-2 { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both; }
            .fc-3 { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.9s both; }
            .f-icon { font-size: 26px; }
            .f-txt { font-size: 22px; font-weight: 700; color: #e2e8f0; }

            .bottom-bar {
                position: relative; z-index: 2;
                background: rgba(30, 41, 59, 0.85);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 16px; padding: 26px 32px;
                opacity: 0; animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.1s both;
            }
            .takeaway-text { font-size: 24px; font-weight: 600; color: #e2e8f0; line-height: 1.4; }

            @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
            @keyframes popIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; } }
            @keyframes tiltCard {
                0% { transform: rotateY(-18deg) rotateX(10deg) translateZ(20px); }
                100% { transform: rotateY(12deg) rotateX(-8deg) translateZ(40px); }
            }
            @keyframes sheenPass {
                0% { transform: translateX(-200px) rotate(35deg); opacity: 0; }
                50% { opacity: 1; }
                100% { transform: translateX(600px) rotate(35deg); opacity: 0; }
            }
            @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
            @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
        </style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="5"
            data-width="1080"
            data-height="1920"
            data-composition-variables='{"kicker":"CÔNG NGHỆ BẢO MẬT LỚP TIẾP THEO","card_title":"Quantum Shield Enterprise Card","card_tier":"VIP TIER // BLACK EDITION","feature_1":"Mã hóa kháng lượng tử SHA-3 512-bit","feature_2":"Xác thực sinh trắc học Zero-Knowledge","feature_3":"Hạn mức giao dịch bảo vệ không giới hạn","card_chip":"NFC ACTIVE","card_id":"•••• 8920","takeaway":"Giải pháp bảo mật lượng tử tiên phong bảo vệ toàn diện tài sản số cấp ngân hàng."}'
        >
            <div class="ambient-mesh"></div>

            <div class="header-bar">
                <div class="kicker-tag"><span class="kicker-txt"></span></div>
                <div class="main-title"></div>
            </div>

            <div class="card-viewport">
                <div class="card-3d">
                    <div class="card-sheen"></div>
                    <div class="card-top-row">
                        <div class="chip-pill"><span class="chip-txt"></span></div>
                        <div class="tier-tag c-tier"></div>
                    </div>
                    <div class="card-brand c-brand"></div>
                    <div class="card-id-row c-id"></div>
                </div>
            </div>

            <div class="features-col">
                <div class="feature-card fc-1">
                    <div class="f-icon">🔒</div>
                    <div class="f-txt f1-txt"></div>
                </div>
                <div class="feature-card fc-2">
                    <div class="f-icon">⚡</div>
                    <div class="f-txt f2-txt"></div>
                </div>
                <div class="feature-card fc-3">
                    <div class="f-icon">💎</div>
                    <div class="f-txt f3-txt"></div>
                </div>
            </div>

            <div class="bottom-bar">
                <div class="takeaway-text"></div>
            </div>
        </div>

        <script>
            (function () {
                var v = window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                    ? window.__hyperframes.getVariables() : {};
                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null && String(text).trim() !== "") el.textContent = String(text);
                };
                set(".kicker-txt", v.kicker);
                set(".main-title", v.card_title);
                set(".chip-txt", v.card_chip || "NFC ACTIVE");
                set(".c-tier", v.card_tier);
                set(".c-brand", v.card_title);
                set(".c-id", v.card_id);
                set(".f1-txt", v.feature_1);
                set(".f2-txt", v.feature_2);
                set(".f3-txt", v.feature_3);
                set(".takeaway-text", v.takeaway);
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = window.__timelines["portrait"] = { pause: function () {}, seek: function () {}, paused: function () { return true; } };
        </script>
    </body>
</html>
