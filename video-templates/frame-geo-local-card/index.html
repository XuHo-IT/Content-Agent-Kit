<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1920, height=1080" />
        <title>Geo Local Card · 16:9</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap"
            rel="stylesheet"
        />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { width: 1920px; height: 1080px; overflow: hidden; background: #022c22; }
            #root {
                position: relative; width: 1920px; height: 1080px;
                background: #022c22; color: #f0fdf4;
                font-family: "Plus Jakarta Sans", sans-serif;
                overflow: hidden;
            }

            .map-svg-bg {
                position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1;
            }

            .top-bar {
                position: absolute; top: 60px; left: 120px; right: 120px; z-index: 5;
                display: flex; align-items: center; justify-content: space-between;
                opacity: 0; animation: fadeDown 0.5s ease-out 0.1s both;
            }
            .kicker-tag {
                font-family: "JetBrains Mono", monospace; font-size: 18px; font-weight: 800;
                letter-spacing: 2.5px; text-transform: uppercase; color: #34d399;
                display: flex; align-items: center; gap: 10px;
                background: rgba(2, 44, 34, 0.85); padding: 8px 18px; border-radius: 8px;
                border: 1px solid rgba(52, 211, 153, 0.3);
            }
            .kicker-tag::before { content: "📍"; font-size: 20px; }
            .badge-tag {
                background: linear-gradient(135deg, #f59e0b, #d97706); color: #ffffff;
                padding: 8px 22px; border-radius: 999px; font-weight: 800; font-size: 15px;
                letter-spacing: 1px; text-transform: uppercase;
                box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
            }

            .card-wrapper {
                position: absolute; top: 140px; left: 120px; right: 120px; bottom: 80px; z-index: 5;
                display: flex; flex-direction: column; justify-content: space-between;
                background: rgba(4, 47, 36, 0.92); border: 2px solid rgba(52, 211, 153, 0.4);
                border-radius: 24px; padding: 48px 64px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
                backdrop-filter: blur(16px);
                opacity: 0; animation: cardRise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
            }

            .place-header { margin-bottom: 20px; }
            .place-name {
                font-size: 52px; font-weight: 900; color: #ffffff; letter-spacing: -0.02em; line-height: 1.15;
            }
            .place-address {
                font-size: 22px; font-weight: 600; color: #cbd5e1; margin-top: 10px;
                display: flex; align-items: center; gap: 8px;
            }

            .rating-section {
                display: flex; align-items: center; gap: 24px;
                background: rgba(2, 44, 34, 0.6); border: 1px solid rgba(52, 211, 153, 0.3);
                border-radius: 16px; padding: 18px 28px; width: fit-content;
            }
            .score-big {
                font-family: "JetBrains Mono", monospace; font-size: 48px; font-weight: 900; color: #34d399;
            }
            .stars-col { display: flex; flex-direction: column; gap: 4px; }
            .stars { font-size: 20px; color: #facc15; }
            .review-count { font-size: 16px; font-weight: 600; color: #94a3b8; }

            .highlights-box {
                display: flex; flex-wrap: wrap; gap: 16px; margin-top: 20px;
            }
            .hl-pill {
                background: rgba(52, 211, 153, 0.15); border: 1px solid rgba(52, 211, 153, 0.35);
                color: #f0fdf4; font-size: 19px; font-weight: 700; padding: 12px 24px; border-radius: 999px;
            }

            @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
            @keyframes cardRise { from { opacity: 0; transform: translateY(30px) scale(0.96); } to { opacity: 1; transform: none; } }
        </style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="5"
            data-width="1920"
            data-height="1080"
            data-composition-variables='{"kicker":"ĐỊA ĐIỂM NỔI BẬT · ĐÀ NẴNG","badge":"TOP 1 CHECK-IN","place_name":"The Workshop Specialty Coffee","address":"27 Ngô Đức Kế, Quận 1, TP. Hồ Chí Minh","rating":"4.9","rating_count":"Hơn 1.250","highlights":"View ngắm hoàng hôn|Specialty Coffee rang mộc|Không gian làm việc yên tĩnh"}'
        >
            <svg class="map-svg-bg" viewBox="0 0 1920 1080">
                <path d="M 0,0 C 400,200 500,600 350,1080 L 0,1080 Z" fill="#042f2e" opacity="0.6" />
                <path d="M 1500,0 C 1400,400 1650,800 1920,1080 L 1920,0 Z" fill="#042f2e" opacity="0.6" />
                <!-- Street Grid -->
                <path d="M 0,250 L 1920,250 M 0,550 L 1920,550 M 0,850 L 1920,850" stroke="rgba(52,211,153,0.12)" stroke-width="2" />
                <path d="M 300,0 L 300,1080 M 700,0 L 700,1080 M 1100,0 L 1100,1080 M 1500,0 L 1500,1080" stroke="rgba(52,211,153,0.12)" stroke-width="2" />
                <!-- Glowing Pin Target -->
                <circle cx="1600" cy="500" r="180" fill="none" stroke="rgba(239,68,68,0.3)" stroke-width="2" stroke-dasharray="8,8" />
                <circle cx="1600" cy="500" r="20" fill="#ef4444" />
            </svg>

            <div class="top-bar">
                <div class="kicker-tag"><span class="kicker-txt"></span></div>
                <div class="badge-tag"><span class="badge-txt"></span></div>
            </div>

            <div class="card-wrapper">
                <div class="place-header">
                    <div class="place-name"></div>
                    <div class="place-address"></div>
                </div>

                <div class="rating-section">
                    <div class="score-big"></div>
                    <div class="stars-col">
                        <div class="stars"></div>
                        <div class="review-count"></div>
                    </div>
                </div>

                <div class="highlights-box"></div>
            </div>
        </div>

        <script>
            (function () {
                var v = window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                    ? window.__hyperframes.getVariables() : {};
                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null && String(text).trim() !== "") el.textContent = String(text);
                };
                set(".kicker-txt", v.kicker);
                set(".badge-txt", v.badge || "ĐÁNG TRẢI NGHIỆM");
                set(".place-name", v.place_name || v.title);
                set(".place-address", v.address);
                set(".score-big", v.rating || "4.9");
                set(".stars", "★★★★★");
                set(".review-count", v.rating_count ? v.rating_count + " đánh giá thực tế" : (v.reviews ? v.reviews : "Đã kiểm chứng"));

                if (v.highlights) {
                    var box = document.querySelector(".highlights-box");
                    box.innerHTML = "";
                    var items = String(v.highlights).split("|");
                    items.forEach(function(item) {
                        var t = item.trim();
                        if (t) {
                            var p = document.createElement("div");
                            p.className = "hl-pill";
                            p.textContent = "✦ " + t;
                            box.appendChild(p);
                        }
                    });
                }
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = window.__timelines["portrait"] = { pause: function () {}, seek: function () {}, paused: function () { return true; } };
        </script>
    </body>
</html>
