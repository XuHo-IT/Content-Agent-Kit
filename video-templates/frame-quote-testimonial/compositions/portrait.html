<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1080, height=1920" />
        <title>Quote Testimonial · Portrait 9:16</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Be+Vietnam+Pro:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <style>
            /*
   * frame-quote-testimonial — 9:16. Same slots as index.html.
   *
   * The size thresholds differ from 16:9 on purpose. A phone frame is narrower, so the
   * same 110-character quote wraps to more lines and needs to step down sooner.
   */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                width: 1080px;
                height: 1920px;
                overflow: hidden;
                background: #faf7f2;
            }
            #root {
                position: relative;
                width: 1080px;
                height: 1920px;
                background: #faf7f2;
                color: #1a1613;
                font-family: "Be Vietnam Pro", sans-serif;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 0 96px;
            }
            .mark {
                font-family: "Alfa Slab One", cursive;
                font-size: 240px;
                line-height: 0.7;
                color: #c8452e;
                opacity: 0;
                animation: dropIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
            }
            .quote {
                font-size: 72px;
                font-weight: 500;
                line-height: 1.3;
                margin-top: -20px;
                opacity: 0;
                animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
            }
            .who {
                display: flex;
                align-items: center;
                gap: 24px;
                margin-top: 72px;
                opacity: 0;
                animation: rise 0.6s ease-out 1.2s forwards;
            }
            .avatar {
                width: 92px;
                height: 92px;
                border-radius: 50%;
                background: #c8452e;
                color: #faf7f2;
                display: grid;
                place-items: center;
                font-family: "Alfa Slab One", cursive;
                font-size: 44px;
                flex-shrink: 0;
            }
            .who-text .name {
                font-size: 38px;
                font-weight: 700;
            }
            .who-text .role {
                font-size: 30px;
                font-weight: 400;
                color: rgba(26, 22, 19, 0.6);
                margin-top: 6px;
                line-height: 1.3;
            }
            .rule {
                width: 0;
                height: 4px;
                background: #1a1613;
                margin-top: 52px;
                animation: ruleW 0.7s cubic-bezier(0.16, 1, 0.3, 1) 1.5s forwards;
            }
            @keyframes ruleW {
                to {
                    width: 260px;
                }
            }
            @keyframes dropIn {
                from {
                    opacity: 0;
                    transform: translateY(-30px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(26px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="6"
            data-width="1080"
            data-height="1920"
            data-composition-variables='{"quote":"Chúng tôi cắt được hơn nửa thời gian làm thủ công chỉ trong tháng đầu.","name":"Tên người nói","role":"Chức danh · Công ty"}'
        >
            <div class="mark">&ldquo;</div>
            <div class="quote"></div>
            <div class="who">
                <div class="avatar"></div>
                <div class="who-text">
                    <div class="name"></div>
                    <div class="role"></div>
                </div>
            </div>
            <div class="rule"></div>
        </div>
        <script>
            (function () {
                var v =
                    window.__hyperframes &&
                    typeof window.__hyperframes.getVariables === "function"
                        ? window.__hyperframes.getVariables()
                        : {};
                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null) el.textContent = String(text);
                };

                var quote = String(v.quote || "");
                set(".quote", quote);
                set(".name", v.name);
                set(".role", v.role);

                // Steps down sooner than 16:9 — a narrower frame wraps the same text to
                // more lines.
                var q = document.querySelector(".quote");
                if (q) q.style.fontSize = quote.length > 140 ? "50px" : quote.length > 90 ? "60px" : "72px";

                var av = document.querySelector(".avatar");
                var name = String(v.name || "").trim();
                if (av) {
                    if (name) av.textContent = name.charAt(0).toUpperCase();
                    else av.remove();
                }
                if (!name && !String(v.role || "").trim()) {
                    var who = document.querySelector(".who");
                    if (who) who.remove();
                }
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = {
                pause: function () {},
                seek: function () {},
                paused: function () {
                    return true;
                },
            };
        </script>
    </body>
</html>
