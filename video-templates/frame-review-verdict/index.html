<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1920, height=1080" />
        <title>Review Verdict · 16:9</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Be+Vietnam+Pro:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <style>
            /*
   * frame-review-verdict — the score card a review video is built around.
   * Original work for this repo. Landscape 16:9 (1920×1080); the 9:16 layout
   * lives at compositions/portrait.html.
   *
   * A review needs one frame that answers "so is it good?" without the viewer
   * reading anything. The score is the largest object on screen; verdict, pros
   * and cons sit underneath in that order because that is the order a viewer
   * who has already decided will skim them.
   *
   * `pros` and `cons` take a "|"-separated string rather than an array: scene
   * inputs come through as flat values, and a caller writing JSON by hand gets
   * one field wrong far less often than they get a nested array wrong.
   */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                width: 1920px;
                height: 1080px;
                overflow: hidden;
                background: #10131a;
            }
            #root {
                position: relative;
                width: 1920px;
                height: 1080px;
                background: #10131a;
                color: #f2f4f8;
                font-family: "Be Vietnam Pro", sans-serif;
                display: grid;
                grid-template-columns: 720px 1fr;
                align-items: center;
                gap: 90px;
                padding: 0 120px;
            }
            .scorewrap {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }
            .ring {
                position: relative;
                width: 520px;
                height: 520px;
                display: grid;
                place-items: center;
            }
            .ring svg {
                position: absolute;
                inset: 0;
                transform: rotate(-90deg);
            }
            .ring .track {
                fill: none;
                stroke: rgba(242, 244, 248, 0.08);
                stroke-width: 26;
            }
            .ring .arc {
                fill: none;
                stroke: #37e2a0;
                stroke-width: 26;
                stroke-linecap: round;
                /* 2πr for r=234. The dash offset is set from `score` at runtime. */
                stroke-dasharray: 1470;
                stroke-dashoffset: 1470;
                transition: none;
                animation: sweep 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
            }
            .score {
                font-family: "Alfa Slab One", cursive;
                font-size: 210px;
                line-height: 1;
                color: #f2f4f8;
                opacity: 0;
                animation: pop 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.55s forwards;
            }
            .outof {
                font-size: 34px;
                font-weight: 500;
                letter-spacing: 4px;
                text-transform: uppercase;
                color: rgba(242, 244, 248, 0.45);
                margin-top: 22px;
                opacity: 0;
                animation: fade 0.5s ease-out 0.95s forwards;
            }
            .right {
                display: flex;
                flex-direction: column;
                gap: 34px;
            }
            .subject {
                font-size: 34px;
                font-weight: 500;
                letter-spacing: 5px;
                text-transform: uppercase;
                color: #37e2a0;
                opacity: 0;
                animation: rise 0.6s ease-out 0.2s forwards;
            }
            .verdict {
                font-family: "Alfa Slab One", cursive;
                font-size: 82px;
                line-height: 1.08;
                opacity: 0;
                animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
            }
            .lists {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 48px;
                margin-top: 10px;
            }
            .col h4 {
                font-size: 24px;
                font-weight: 700;
                letter-spacing: 4px;
                text-transform: uppercase;
                margin-bottom: 18px;
            }
            .col.pro h4 {
                color: #37e2a0;
            }
            .col.con h4 {
                color: #ff6b6b;
            }
            .col li {
                list-style: none;
                font-size: 28px;
                line-height: 1.5;
                color: rgba(242, 244, 248, 0.82);
                padding-left: 34px;
                position: relative;
                margin-bottom: 12px;
                opacity: 0;
                animation: rise 0.5s ease-out forwards;
            }
            .col li::before {
                position: absolute;
                left: 0;
                top: 0;
                font-weight: 700;
            }
            .col.pro li::before {
                content: "+";
                color: #37e2a0;
            }
            .col.con li::before {
                content: "−";
                color: #ff6b6b;
            }
            @keyframes sweep {
                to {
                    stroke-dashoffset: var(--arc-offset, 441);
                }
            }
            @keyframes pop {
                to {
                    opacity: 1;
                }
            }
            @keyframes fade {
                to {
                    opacity: 1;
                }
            }
            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(22px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="6"
            data-width="1920"
            data-height="1080"
            data-composition-variables='{"subject":"Tên sản phẩm","score":"8.5","maxScore":"10","verdict":"Đáng mua nếu bạn cần đúng thứ nó làm tốt","pros":"Pin trâu|Màn hình sáng|Giá hợp lý","cons":"Sạc chậm|Loa yếu","prosLabel":"Điểm cộng","consLabel":"Điểm trừ"}'
        >
            <div class="scorewrap">
                <div class="ring">
                    <svg viewBox="0 0 520 520">
                        <circle class="track" cx="260" cy="260" r="234" />
                        <circle class="arc" cx="260" cy="260" r="234" />
                    </svg>
                    <div style="display: grid; place-items: center">
                        <div class="score"></div>
                        <div class="outof"></div>
                    </div>
                </div>
            </div>

            <div class="right">
                <div class="subject"></div>
                <div class="verdict"></div>
                <div class="lists">
                    <div class="col pro">
                        <h4 class="pro-label"></h4>
                        <ul></ul>
                    </div>
                    <div class="col con">
                        <h4 class="con-label"></h4>
                        <ul></ul>
                    </div>
                </div>
            </div>
        </div>
        <script>
            (function () {
                var v =
                    window.__hyperframes &&
                    typeof window.__hyperframes.getVariables === "function"
                        ? window.__hyperframes.getVariables()
                        : {};
                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null) el.textContent = String(text);
                };
                var drop = function (sel) {
                    var el = document.querySelector(sel);
                    if (el) el.remove();
                };

                // Column headings were fixed Vietnamese text. The kit is Vietnamese-first so
                // that stays the default, but a heading no slot can reach means the template
                // simply cannot be used in another language.
                set(".pro-label", v.prosLabel != null ? v.prosLabel : "Điểm cộng");
                set(".con-label", v.consLabel != null ? v.consLabel : "Điểm trừ");
                set(".subject", v.subject);
                set(".verdict", v.verdict);
                set(".score", v.score);

                var max = Number(v.maxScore) || 10;
                set(".outof", "trên " + max);

                // The arc has to agree with the number, or the frame contradicts itself
                // on screen. Clamped because a caller passing 12/10 should get a full
                // ring, not an arc that wraps around and reads as 2/10.
                var score = Number(v.score);
                var ratio = isFinite(score) && max > 0 ? Math.max(0, Math.min(score / max, 1)) : 0;
                var C = 1470; // 2πr, r = 234
                var arc = document.querySelector(".arc");
                if (arc) arc.style.setProperty("--arc-offset", String(C * (1 - ratio)));

                // Pipe-separated, because scene inputs are flat values and one string is
                // harder to get wrong by hand than a nested array.
                var fill = function (sel, raw) {
                    var ul = document.querySelector(sel);
                    if (!ul) return;
                    var items = String(raw || "")
                        .split("|")
                        .map(function (s) {
                            return s.trim();
                        })
                        .filter(Boolean);
                    if (!items.length) {
                        // An empty column is worse than no column: it leaves a heading
                        // with nothing under it, which reads as missing data.
                        var col = ul.parentElement;
                        if (col) col.remove();
                        return;
                    }
                    items.slice(0, 4).forEach(function (text, i) {
                        var li = document.createElement("li");
                        li.textContent = text;
                        li.style.animationDelay = 0.9 + i * 0.12 + "s";
                        ul.appendChild(li);
                    });
                };
                fill(".col.pro ul", v.pros);
                fill(".col.con ul", v.cons);
                if (!document.querySelector(".col")) drop(".lists");
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = window.__timelines["portrait"] = {
                pause: function () {},
                seek: function () {},
                paused: function () {
                    return true;
                },
            };
        </script>
    </body>
</html>
