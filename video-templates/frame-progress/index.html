<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1920, height=1080" />
        <title>Progress · 16:9</title>
        <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet" />
        <style>
/*
 * frame-progress — how far along, and what is left.
 *
 * Original work for this repo.
 *
 * Games asked for it ("thanh tiến độ / cột mốc"), and it is the frame every build
 * log, roadmap and fundraiser needs. `frame-chart-bars` compares things;
 * `frame-timeline` marks dates. Neither says HOW FAR THROUGH ONE THING you are.
 *
 * The bar fills to the real ratio and the percentage is computed from it, so the
 * number and the picture cannot disagree. Milestones sit at their own proportion
 * along the track — one at 80% is drawn at 80%, not at "the fourth of five".
 *
 * Over 100% draws a full bar rather than one that overflows its own track, and
 * still prints the true figure. A campaign at 143% should look finished and say
 * 143, not look broken.
 */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow: hidden; }
html, body { width: 1920px; height: 1080px; }
#root { position: relative; width: 1920px; height: 1080px; overflow: hidden;
        font-family: "Be Vietnam Pro", sans-serif; }
#root { background: #0a1014; color: #e8f6f2; display: grid; align-content: center; }
.kicker { font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #2dd4bf;
          opacity: 0; animation: rise 0.5s ease-out 0.1s both; }
.title { font-weight: 800; letter-spacing: -0.02em; line-height: 1.1;
         opacity: 0; animation: rise 0.55s ease-out 0.25s both; }
.track { position: relative; background: #14232b; border-radius: 999px; overflow: visible; }
.fill { position: absolute; inset: 0; right: auto; border-radius: 999px;
        background: linear-gradient(90deg, #0d9488, #2dd4bf);
        transform: scaleX(0); transform-origin: left;
        animation: grow 1.1s cubic-bezier(0.4,0,0.2,1) 0.6s both; }
.mark { position: absolute; top: 50%; transform: translate(-50%, -50%); opacity: 0;
        animation: pop 0.35s cubic-bezier(0.16,1,0.3,1) both; }
.mark .pip { background: #0a1014; border: 4px solid #2dd4bf; border-radius: 50%; display: block; }
.mark .lab { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap;
             color: #8fb8b0; font-weight: 600; }
.readout { display: flex; align-items: baseline; opacity: 0;
           animation: rise 0.5s ease-out 1.5s both; }
.pct { font-weight: 800; letter-spacing: -0.03em; color: #2dd4bf; line-height: 1; }
.frac { color: #6f9a92; font-weight: 600; }
.note { color: #6f9a92; opacity: 0; animation: rise 0.5s ease-out 1.8s both; }
@keyframes grow { to { transform: scaleX(1); } }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
                 to   { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
#root { padding: 0 150px; }
.kicker { font-size: 30px; margin-bottom: 22px; }
.title { font-size: 74px; margin-bottom: 90px; }
.track { height: 26px; }
.mark .pip { width: 26px; height: 26px; }
.mark .lab { top: 34px; font-size: 24px; }
.readout { gap: 22px; margin-top: 96px; }
.pct { font-size: 130px; } .frac { font-size: 32px; }
.note { font-size: 28px; margin-top: 30px; }
        </style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="6"
            data-width="1920"
            data-height="1080"
            data-composition-variables='{"kicker":"Chặng 2","title":"Dựng xong 33 trong 40 khung","value":"33","total":"40","milestones":"10:Nền tảng|22:Dữ liệu|33:Bản đồ","note":"Còn 7 khung trong hàng đợi"}'
        >
            <div class="kicker"></div>
            <div class="title"></div>
            <div class="track"><div class="fill"></div><div class="marks"></div></div>
            <div class="readout"><span class="pct"></span><span class="frac"></span></div>
            <div class="note"></div>
        </div>
        <script>
            (function () {
                var v =
                    window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                        ? window.__hyperframes.getVariables()
                        : {};
                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null && String(text).length) el.textContent = String(text);
                };
                var drop = function (sel) {
                    var el = document.querySelector(sel);
                    if (el) el.remove();
                };
                // A slot left empty removes its element rather than rendering a gap. An empty
                // heading reads as missing data; an absent one reads as a deliberate omission.
                var setOrDrop = function (sel, text) {
                    if (text == null || !String(text).trim()) return drop(sel);
                    set(sel, text);
                };
                setOrDrop(".kicker", v.kicker);
                setOrDrop(".title", v.title);
                setOrDrop(".note", v.note);
                
                var value = Number(v.value), total = Number(v.total);
                if (!isFinite(value) || !isFinite(total) || total <= 0) { drop(".track"); drop(".readout"); }
                else {
                    var ratio = value / total;
                    // Over 100% draws a full bar and still prints the true figure. A campaign at 143%
                    // should look finished and say 143, not look broken.
                    document.querySelector(".fill").style.width = Math.min(1, ratio) * 100 + "%";
                    var pct = ratio * 100;
                    set(".pct", (pct < 10 ? pct.toFixed(1) : Math.round(pct)) + "%");
                    set(".frac", value + " / " + total);
                
                    var marks = document.querySelector(".marks");
                    String(v.milestones || "").split("|").map(function (s) { return s.trim(); }).filter(Boolean)
                        .forEach(function (raw, i) {
                            var cut = raw.indexOf(":");
                            var at = Number(cut < 0 ? raw : raw.slice(0, cut));
                            if (!isFinite(at)) return;
                            var el = document.createElement("div");
                            el.className = "mark";
                            // Its own proportion along the track, not "the nth of n".
                            el.style.left = Math.min(100, (at / total) * 100) + "%";
                            el.style.animationDelay = (0.75 + i * 0.18).toFixed(2) + "s";
                            var pip = document.createElement("span"); pip.className = "pip";
                            el.appendChild(pip);
                            if (cut > 0) {
                                var lab = document.createElement("span"); lab.className = "lab";
                                lab.textContent = raw.slice(cut + 1).trim();
                                el.appendChild(lab);
                            }
                            marks.appendChild(el);
                        });
                }
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = {
                pause: function () {},
                seek: function () {},
                paused: function () { return true; },
            };
        </script>
    </body>
</html>
