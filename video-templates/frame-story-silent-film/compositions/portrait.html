<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Story · Silent Film Intertitle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800&family=Roboto+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Patrick+Hand&family=Anton&display=swap" rel="stylesheet">
  <style>
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0d0b09; }
    
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --spring: linear(0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%, 0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1);
    --snap: cubic-bezier(.2,.9,.1,1);
    --out: cubic-bezier(.16,1,.3,1);
  }
  #root { position: relative; overflow: hidden; width: 100%; height: 100%; font-family: 'Be Vietnam Pro', sans-serif; }
  #root::after {
    content: ""; position: absolute; inset: -30%; pointer-events: none; z-index: 0; opacity: .55;
    animation: ambient 16s linear infinite;
  }
  @keyframes ambient { from { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.08); } to { transform: rotate(360deg) scale(1); } }
  .stage { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; flex-direction: column; }
  .mono { font-family: 'Roboto Mono', monospace; }
  @keyframes rise { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.4); } 60% { opacity: 1; } 100% { opacity: 1; transform: scale(1); } }
  @keyframes wipeIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

    
      #root { background: #0d0b09; color: #ebe1c8; }
      #root::after { inset: 0; background-image: linear-gradient(90deg, transparent 0 31%, rgba(235,225,200,.18) 31.1%, transparent 31.3%, transparent 72%, rgba(235,225,200,.12) 72.1%, transparent 72.2%), radial-gradient(rgba(235,225,200,.08) 1px, transparent 1.5px); background-size: 100% 100%, 5px 5px; opacity: .9; z-index: 4; animation: scratch .4s steps(3) infinite; }
      @keyframes scratch { 0% { transform: translateX(0); } 33% { transform: translateX(-120px); } 66% { transform: translateX(80px); } 100% { transform: translateX(0); } }
      .stage { justify-content: center; align-items: center; clip-path: circle(0% at 50% 50%); animation: iris 1s cubic-bezier(.6,0,.3,1) .1s forwards; filter: sepia(.35); }
      @keyframes iris { to { clip-path: circle(80% at 50% 50%); } }
      .frame { position: absolute; border: 6px solid #ebe1c8; border-radius: 10px; animation: weave .5s steps(2) infinite; }
      .frame::before { content: ""; position: absolute; inset: 14px; border: 2px solid #ebe1c8; border-radius: 6px; }
      .frame::after { content: ""; position: absolute; inset: -22px; background: radial-gradient(circle at 0 0, #ebe1c8 9px, transparent 10px), radial-gradient(circle at 100% 0, #ebe1c8 9px, transparent 10px), radial-gradient(circle at 0 100%, #ebe1c8 9px, transparent 10px), radial-gradient(circle at 100% 100%, #ebe1c8 9px, transparent 10px); }
      @keyframes weave { 0% { transform: translate(0,0); } 50% { transform: translate(1px,-2px); } 100% { transform: translate(0,0); } }
      .flick { position: absolute; inset: 0; background: #000; pointer-events: none; z-index: 3; animation: flicker .9s steps(1) infinite; opacity: 0; }
      @keyframes flicker { 0% { opacity: .0; } 20% { opacity: .12; } 40% { opacity: .03; } 60% { opacity: .16; } 80% { opacity: .05; } }
      .chapter { font-family: 'Playfair Display', serif; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; opacity: 0; animation: fade .5s 1s forwards; }
      .title { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; line-height: 1.12; text-align: center; opacity: 0; animation: fade .7s 1.3s forwards; }
      .rule { height: 2px; background: #ebe1c8; transform: scaleX(0); animation: grow .7s var(--out) 1.6s forwards; }
      @keyframes grow { to { transform: scaleX(1); } }
      .sub { font-family: 'Playfair Display', serif; font-weight: 400; font-style: italic; opacity: 0; animation: fade .6s 2.2s forwards; }
      .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(0,0,0,.75) 100%); pointer-events: none; z-index: 2; }
    
    
      .frame { left: 70px; right: 70px; top: 420px; bottom: 420px; }
      .stage { padding: 0 150px; gap: 50px; }
      .chapter { font-size: 40px; }
      .title { font-size: 108px; }
      .rule { width: 420px; }
      .sub { font-size: 50px; text-align: center; }
    
  </style>
</head>
<body>
  <div id="root" class="P" data-composition-id="portrait" data-width="1080" data-height="1920" data-start="0" data-duration="6" data-composition-variables='{"chapter":"Chương II","title":"Trong khi đó, ở kho hàng…","sub":"ba nghìn đơn đang chờ được gói"}'>
    <div class="stage">
        <div class="frame"></div>
        <div class="chapter" data-slot="chapter"></div>
        <div class="title" data-slot="title"></div>
        <div class="rule"></div>
        <div class="sub" data-slot="sub"></div>
      </div>
      <div class="vig"></div>
      <div class="flick"></div>
  </div>
  <script>
    // Caller values: window.__hyperframes.getVariables(), merged over the declared defaults
    // so the file still previews on its own. Built once, before the first seek.
    function getVariables() {
      let d = {};
      try { d = JSON.parse(document.getElementById("root").getAttribute("data-composition-variables") || "{}"); } catch (e) {}
      const hf = window.__hyperframes;
      const p = hf && typeof hf.getVariables === "function" ? hf.getVariables() || {} : {};
      return Object.assign({}, d, p);
    }
    const v = getVariables();
    const has = (k) => v[k] !== undefined && v[k] !== null && String(v[k]).trim() !== "";
    document.querySelectorAll("[data-slot]").forEach((el) => {
      const k = el.getAttribute("data-slot");
      if (!has(k)) { (el.closest("[data-slot-box]") || el).remove(); return; }
      el.textContent = String(v[k]);
    });
    /** One span per character, each starting `step` seconds after the last — a typewriter. */
    function typeInto(el, text, start, step) {
      el.textContent = "";
      [...String(text)].forEach((ch, i) => {
        const s = document.createElement("span");
        s.className = "ch";
        s.textContent = ch;
        s.style.animationDelay = (start + i * step).toFixed(3) + "s";
        el.appendChild(s);
      });
      return start + [...String(text)].length * step;
    }
    /** Odometer: every digit becomes a 0–9 column that rolls to its value. */
    function odometer(el, text, start) {
      el.textContent = "";
      let n = 0;
      [...String(text)].forEach((ch) => {
        if (/[0-9]/.test(ch)) {
          const col = document.createElement("span");
          col.className = "odo";
          const strip = document.createElement("span");
          strip.className = "odo-strip";
          for (let d = 0; d <= 9; d++) { const x = document.createElement("span"); x.textContent = d; strip.appendChild(x); }
          strip.style.setProperty("--d", ch);
          strip.style.animationDelay = (start + n++ * 0.07).toFixed(2) + "s";
          const size = document.createElement("span");
          size.className = "odo-size";
          size.textContent = ch;
          col.appendChild(size);
          col.appendChild(strip);
          el.appendChild(col);
        } else {
          const s = document.createElement("span");
          s.className = "odo-sep";
          s.textContent = ch;
          el.appendChild(s);
        }
      });
    }
    
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = window.__timelines["portrait"] = {
      duration: 6,
      seek(t) { document.getAnimations().forEach((a) => { a.pause(); a.currentTime = t * 1000; }); },
    };
  </script>
</body>
</html>
