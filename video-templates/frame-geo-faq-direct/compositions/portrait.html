<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1080, height=1920" />
        <title>Geo Map Location Finder · Portrait</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap"
            rel="stylesheet"
        />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                width: 1080px; height: 1920px; overflow: hidden;
                background: #022c22; color: #f8fafc;
                font-family: "Plus Jakarta Sans", sans-serif;
                display: flex; align-items: center; justify-content: center;
            }

            #root {
                position: relative; width: 1080px; height: 1920px;
                background: radial-gradient(circle at 50% 35%, #064e3b 0%, #022c22 100%);
                padding: 100px 50px;
                display: flex; flex-direction: column; justify-content: space-between;
                overflow: hidden;
            }

            .map-grid {
                position: absolute; inset: 0;
                background-image: linear-gradient(rgba(16, 185, 129, 0.08) 1px, transparent 1px),
                                  linear-gradient(90deg, rgba(16, 185, 129, 0.08) 1px, transparent 1px);
                background-size: 40px 40px;
            }

            .search-bar {
                position: relative; z-index: 2;
                background: rgba(6, 78, 59, 0.85);
                border: 2px solid rgba(52, 211, 153, 0.5);
                border-radius: 999px; padding: 18px 28px;
                display: flex; align-items: center; justify-content: space-between;
                box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            }
            .search-left { display: flex; align-items: center; gap: 12px; }
            .search-icon { font-size: 24px; color: #34d399; }
            .query-text { font-size: 24px; font-weight: 800; color: #ffffff; }
            .geo-badge {
                font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 700;
                background: rgba(16, 185, 129, 0.3); color: #6ee7b7;
                padding: 6px 14px; border-radius: 999px;
            }

            .stage-col {
                position: relative; z-index: 2;
                display: flex; flex-direction: column; gap: 28px;
            }

            .map-viewport {
                position: relative; width: 100%; height: 500px;
                background: rgba(4, 47, 36, 0.9);
                border: 2px solid rgba(52, 211, 153, 0.3);
                border-radius: 20px; overflow: hidden;
                box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            }

            .map-svg {
                position: absolute; inset: 0; width: 100%; height: 100%;
            }

            .pin-group {
                animation: pinBounce 1.5s ease-in-out infinite alternate;
            }

            .details-panel {
                display: flex; flex-direction: column; gap: 16px;
            }

            .info-card {
                background: rgba(6, 78, 59, 0.75);
                border: 1px solid rgba(52, 211, 153, 0.3);
                border-left: 6px solid #34d399;
                border-radius: 14px; padding: 20px 24px;
                backdrop-filter: blur(16px);
            }
            .info-card.dest { border-left-color: #ef4444; }
            .info-card.dist { border-left-color: #facc15; }

            .card-lbl {
                font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 700;
                color: #6ee7b7; letter-spacing: 1px;
            }
            .card-val {
                font-size: 26px; font-weight: 800; color: #ffffff; margin-top: 4px; line-height: 1.25;
            }
            .card-sub {
                font-size: 18px; font-weight: 600; color: #cbd5e1; margin-top: 4px; line-height: 1.4;
            }

            .bottom-bar {
                position: relative; z-index: 2;
                background: rgba(6, 78, 59, 0.85);
                border: 1px solid rgba(52, 211, 153, 0.3);
                border-radius: 14px; padding: 22px 28px;
                font-size: 20px; font-weight: 600; color: #e2e8f0; line-height: 1.4;
            }

            @keyframes pinBounce {
                0% { transform: translateY(0); }
                100% { transform: translateY(-10px); }
            }
        </style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="portrait"
            data-start="0"
            data-duration="5"
            data-width="1080"
            data-height="1920"
            data-composition-variables='{"query":"Tọa độ & Địa điểm: Khu Công Nghệ Cao Hòa Lạc","answer_direct":"Km 29 Đại Lộ Thăng Long, Thạch Thất, Hà Nội","evidence_1":"Tọa độ GPS: 21.0135° N, 105.5284° E • Diện tích 1,586 ha","evidence_2":"Khoảng cách: Cách trung tâm Hoàn Kiếm 30km về phía Tây qua cao tốc","citation_source":"Bản đồ quy hoạch & dữ liệu vệ tinh địa lý 2026"}'
        >
            <div class="map-grid"></div>

            <div class="search-bar">
                <div class="search-left">
                    <span class="search-icon">📍</span>
                    <span class="query-text"></span>
                </div>
                <div class="geo-badge"><span class="geo-badge-txt"></span></div>
            </div>

            <div class="stage-col">
                <div class="map-viewport">
                    <svg class="map-svg" viewBox="0 0 980 500">
                        <path d="M 50,150 Q 250,80 500,200 T 930,140" fill="none" stroke="rgba(52,211,153,0.15)" stroke-width="2" />
                        <path d="M 50,300 Q 300,220 550,380 T 930,280" fill="none" stroke="rgba(52,211,153,0.15)" stroke-width="2" />
                        <path d="M 50,450 Q 400,350 650,460 T 930,420" fill="none" stroke="rgba(52,211,153,0.15)" stroke-width="2" />
                        
                        <path d="M 150,400 Q 350,300 520,200" fill="none" stroke="#facc15" stroke-width="4" stroke-dasharray="8,8" />
                        
                        <g class="pin-group" transform="translate(520, 200)">
                            <circle cx="0" cy="0" r="35" fill="none" stroke="rgba(239, 68, 68, 0.4)" stroke-width="2" />
                            <circle cx="0" cy="0" r="18" fill="none" stroke="rgba(239, 68, 68, 0.8)" stroke-width="2" />
                            <path d="M 0,-30 C -12,-30 -18,-16 0,8 C 18,-16 12,-30 0,-30 Z" fill="#ef4444" />
                            <circle cx="0" cy="-18" r="4" fill="#ffffff" />
                        </g>
                    </svg>
                </div>

                <div class="details-panel">
                    <div class="info-card dest">
                        <div class="card-lbl l-dest"></div>
                        <div class="card-val v-dest"></div>
                    </div>
                    <div class="info-card coords">
                        <div class="card-lbl l-coord"></div>
                        <div class="card-sub v-coord"></div>
                    </div>
                    <div class="info-card dist">
                        <div class="card-lbl l-dist"></div>
                        <div class="card-sub v-dist"></div>
                    </div>
                </div>
            </div>

            <div class="bottom-bar">
                <span class="source-txt"></span>
            </div>
        </div>

        <script>
            (function () {
                var v = window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                    ? window.__hyperframes.getVariables() : {};
                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null && String(text).trim() !== "") el.textContent = String(text);
                };
                set(".query-text", v.query || "");
                set(".geo-badge-txt", "GEO MAP LOCATION");
                set(".l-dest", "ĐỊA ĐIỂM XÁC THỰC");
                set(".v-dest", v.answer_direct || "");
                set(".l-coord", "TỌA ĐỘ VỆ TINH & QUY MÔ");
                set(".v-coord", v.evidence_1 || "");
                set(".l-dist", "LỘ TRÌNH KẾT NỐI");
                set(".v-dist", v.evidence_2 || "");
                set(".source-txt", v.citation_source ? "Nguồn dữ liệu: " + v.citation_source : "Nguồn dữ liệu vệ tinh GEO");
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = window.__timelines["portrait"] = { pause: function () {}, seek: function () {}, paused: function () { return true; } };
        </script>
    </body>
</html>
