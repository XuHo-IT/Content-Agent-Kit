        <style>

            }
            .search-icon { font-size: 28px; color: #38bdf8; }
            .query-text {
                font-size: 30px; font-weight: 700; color: #ffffff; letter-spacing: -0.01em;

            .answer-card {

                border-radius: 28px; padding: 50px 48px;
                display: flex; flex-direction: column; justify-content: space-between;

            .answer-header {
                display: flex; flex-direction: column; gap: 10px; align-items: flex-start;

            .ai-badge {
                display: inline-flex; align-items: center; gap: 8px;
                background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.5);
                color: #34d399; padding: 8px 18px; border-radius: 999px;
                font-family: "Space Mono", monospace; font-size: 16px; font-weight: 700;
                letter-spacing: 1px; text-transform: uppercase;
            }
            .ai-dot { width: 8px; height: 8px; background: #34d399; border-radius: 50%; box-shadow: 0 0 8px #34d399; }

            .direct-answer {
                font-size: 46px; font-weight: 800; line-height: 1.35; color: #ffffff;
                letter-spacing: -0.02em; margin: 24px 0;
            }

            .evidence-list {
                display: flex; flex-direction: column; gap: 20px;
                border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 28px;
            }
            .evidence-item {
                display: flex; align-items: flex-start; gap: 14px;
                font-size: 26px; font-weight: 500; color: #cbd5e1; line-height: 1.45;
                opacity: 0; animation: fadeUp 0.5s ease-out both;
            }
            .ev-1 { animation-delay: 0.55s; }
            .ev-2 { animation-delay: 0.75s; }
            .ev-icon { color: #38bdf8; font-weight: 700; }

            .footer-row {
                display: flex; flex-direction: column; gap: 10px;
                border-top: 1px dashed rgba(255, 255, 255, 0.1); padding-top: 20px;
                font-family: "Space Mono", monospace; font-size: 18px; color: #94a3b8;
            }
            .cit-badge {
                color: #34d399; font-weight: 700;
            }

            @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: none; } }
            @keyframes cardRise { from { opacity: 0; transform: translateY(30px) scale(0.98); } to { opacity: 1; transform: none; } }
            @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
        </style>
    </head>

        <script>
            (function () {
                var v = window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
