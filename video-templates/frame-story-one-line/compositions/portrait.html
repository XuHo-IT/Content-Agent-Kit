  <style>
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f3ede1; }
    
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --spring: linear(0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%, 0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1);
    --snap: cubic-bezier(.2,.9,.1,1);
    --out: cubic-bezier(.16,1,.3,1);
  }
  #root { position: relative; overflow: hidden; width: 100%; height: 100%; font-family: 'Be Vietnam Pro', sans-serif; }
  #root::after {
    content: ""; position: absolute; inset: -30%; pointer-events: none; z-index: 0; opacity: .55;
    animation: ambient 16s linear infinite;
  }
  @keyframes ambient { from { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.08); } to { transform: rotate(360deg) scale(1); } }
  .stage { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; flex-direction: column; }
  .mono { font-family: 'Roboto Mono', monospace; }
  @keyframes rise { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.4); } 60% { opacity: 1; } 100% { opacity: 1; transform: scale(1); } }
  @keyframes wipeIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

    
      #root { background: #f3ede1; color: #1d1a16; }
      #root::after { background-image: radial-gradient(rgba(60,40,20,.10) 1px, transparent 1.6px); background-size: 7px 7px; opacity: .6; animation: grain 1.2s steps(4) infinite; }
      @keyframes grain { 0% { transform: translate(0,0); } 25% { transform: translate(-3px,2px); } 50% { transform: translate(2px,-3px); } 75% { transform: translate(-2px,-1px); } 100% { transform: translate(0,0); } }
      .kicker { font-family: 'Roboto Mono', monospace; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: #d94f2b; opacity: 0; animation: fade .5s .1s forwards; }
      .headline { font-family: 'Playfair Display', serif; font-weight: 900; font-style: italic; line-height: 1.02; letter-spacing: -.01em; opacity: 0; animation: rise .7s var(--out) .2s forwards; }
      .art { position: relative; width: 1000px; height: 700px; flex: none; transform-origin: 0 0; }
      .art svg { position: absolute; inset: 0; overflow: visible; }
      .ln { fill: none; stroke: #1d1a16; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 4s linear .6s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .heart { fill: #d94f2b; opacity: 0; animation: fade .6s 4.5s forwards; }
      .pen { position: absolute; left: 0; top: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: #d94f2b; box-shadow: 0 0 0 8px rgba(217,79,43,.18);
             offset-path: path("M 40 560 C 120 560 140 420 220 420 C 330 420 340 190 220 190 C 100 190 110 420 220 420 C 300 420 330 560 400 560 L 520 300 L 580 400 L 650 180 L 760 560 C 800 600 840 610 880 600 C 760 500 800 380 880 440 C 960 380 1000 500 880 600 L 975 640");
             offset-rotate: 0deg; offset-distance: 0%; animation: travel 4s linear .6s forwards, fade .2s .5s both; }
      @keyframes travel { to { offset-distance: 100%; } }
      .lab { position: absolute; font-weight: 800; white-space: nowrap; background: #1d1a16; color: #f3ede1; padding: 8px 20px; border-radius: 10px; opacity: 0; transform: translate(-50%, 0); animation: labIn .5s var(--spring) forwards; }
      @keyframes labIn { from { opacity: 0; transform: translate(-50%, 20px) scale(.8); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
      .l1 { left: 220px; top: 70px; animation-delay: 1.8s; }
      .l2 { left: 650px; top: 80px; animation-delay: 3.1s; }
      .l3 { left: 800px; top: 650px; animation-delay: 4.4s; background: #d94f2b; }

      .stage { padding: 150px 60px 0; gap: 34px; }

<body>
  <div id="root" class="P" data-composition-id="portrait" data-width="1080" data-height="1920" data-start="0" data-duration="6" data-composition-variables='{"kicker":"Câu chuyện của một cửa hàng nhỏ","headline":"Từ một ý tưởng đến 10.000 đơn hàng","label_1":"Ý tưởng","label_2":"Năm đầu khó khăn","label_3":"Khách quay lại","sub":"Ba năm, một nét vẽ không nhấc bút"}'>
    <div class="stage">
        <div class="kicker" data-slot="kicker"></div>
        <div class="headline" data-slot="headline"></div>
        <div class="art">
          <svg viewBox="0 0 1000 700" width="1000" height="700" aria-hidden="true">
            <path class="heart" d="M 880 600 C 760 500 800 380 880 440 C 960 380 1000 500 880 600 Z"/>
            <path class="ln" pathLength="1" d="M 40 560 C 120 560 140 420 220 420 C 330 420 340 190 220 190 C 100 190 110 420 220 420 C 300 420 330 560 400 560 L 520 300 L 580 400 L 650 180 L 760 560 C 800 600 840 610 880 600 C 760 500 800 380 880 440 C 960 380 1000 500 880 600 L 975 640"/>
          </svg>
          <div class="pen"></div>
          <div class="lab l1" data-slot="label_1"></div>
          <div class="lab l2" data-slot="label_2"></div>
          <div class="lab l3" data-slot="label_3"></div>
        </div>
        <div class="sub" data-slot="sub"></div>
      </div>
  </div>
  <script>
    // Caller values: window.__hyperframes.getVariables(), merged over the declared defaults
    // so the file still previews on its own. Built once, before the first seek.
    function getVariables() {
      let d = {};
      try { d = JSON.parse(document.getElementById("root").getAttribute("data-composition-variables") || "{}"); } catch (e) {}
      const hf = window.__hyperframes;
      const p = hf && typeof hf.getVariables === "function" ? hf.getVariables() || {} : {};
      return Object.assign({}, d, p);
    }
    const v = getVariables();
    const has = (k) => v[k] !== undefined && v[k] !== null && String(v[k]).trim() !== "";
    document.querySelectorAll("[data-slot]").forEach((el) => {
      const k = el.getAttribute("data-slot");
      if (!has(k)) { (el.closest("[data-slot-box]") || el).remove(); return; }
      el.textContent = String(v[k]);
    });
    /** One span per character, each starting `step` seconds after the last — a typewriter. */
    function typeInto(el, text, start, step) {
      el.textContent = "";
      [...String(text)].forEach((ch, i) => {
        const s = document.createElement("span");
        s.className = "ch";
        s.textContent = ch;
        s.style.animationDelay = (start + i * step).toFixed(3) + "s";
        el.appendChild(s);
      });
      return start + [...String(text)].length * step;
    }
    /** Odometer: every digit becomes a 0–9 column that rolls to its value. */
    function odometer(el, text, start) {
      el.textContent = "";
      let n = 0;
      [...String(text)].forEach((ch) => {
        if (/[0-9]/.test(ch)) {
          const col = document.createElement("span");
          col.className = "odo";
          const strip = document.createElement("span");
          strip.className = "odo-strip";
          for (let d = 0; d <= 9; d++) { const x = document.createElement("span"); x.textContent = d; strip.appendChild(x); }
          strip.style.setProperty("--d", ch);
          strip.style.animationDelay = (start + n++ * 0.07).toFixed(2) + "s";
          const size = document.createElement("span");
          size.className = "odo-size";
          size.textContent = ch;
          col.appendChild(size);
          col.appendChild(strip);
          el.appendChild(col);
        } else {
          const s = document.createElement("span");
          s.className = "odo-sep";
          s.textContent = ch;
          el.appendChild(s);
        }
      });
    }
    
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = window.__timelines["portrait"] = {
      duration: 6,
      seek(t) { document.getAnimations().forEach((a) => { a.pause(); a.currentTime = t * 1000; }); },
    };
  </script>
