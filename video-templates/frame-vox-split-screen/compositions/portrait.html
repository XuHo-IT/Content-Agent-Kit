<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1080, height=1920" />
        <title>Vox Split Screen · 9:16</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;900&family=Playfair+Display:ital,wght@0,900;1,700&family=Space+Mono:wght@700&display=swap"
            rel="stylesheet"
        />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0e0e10; }
            #root {
                position: relative; width: 1080px; height: 1920px;
                background: #0e0e10; color: #f4f1ea;
                font-family: "Be Vietnam Pro", sans-serif;
                overflow: hidden; display: flex; flex-direction: column;
            }

            /* Top: Document scan */
            .top-panel {
                flex: 1; background: #f4f1ea; color: #111111; padding: 70px 70px;
                position: relative; border-bottom: 4px solid #111111;
                display: flex; flex-direction: column; justify-content: space-between;
                opacity: 0; animation: slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .paper-texture {
                position: absolute; inset: 0;
                background-image: radial-gradient(rgba(0,0,0,0.04) 1px, transparent 0);
                background-size: 20px 20px; pointer-events: none;
            }
            .hud-header {
                display: flex; justify-content: space-between; align-items: center;
                border-bottom: 2px solid #111111; padding-bottom: 14px;
            }
            .tag-pill {
                background: #e53935; color: #ffffff; font-family: "Space Mono", monospace;
                font-size: 18px; font-weight: 700; padding: 6px 16px; letter-spacing: 2px;
                text-transform: uppercase;
            }
            .timecode { font-family: "Space Mono", monospace; font-size: 18px; color: #666660; }

            .doc-body { margin: auto 0; }
            .doc-title {
                font-family: "Space Mono", monospace; font-size: 22px; color: #555550;
                text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px;
            }
            .doc-quote {
                font-size: 38px; font-weight: 600; line-height: 1.45; color: #1a1a1a;
                border-left: 6px solid #ffe600; padding-left: 24px;
            }

            .doc-footer {
                display: flex; justify-content: space-between; font-family: "Space Mono", monospace;
                font-size: 18px; color: #666660; border-top: 1px dashed #ccc8be; padding-top: 14px;
            }

            /* Bottom: Impact statement */
            .bottom-panel {
                flex: 1.1; padding: 70px 70px; display: flex; flex-direction: column;
                justify-content: space-between; background: #111113;
                opacity: 0; animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
            }
            .kicker-row {
                font-family: "Space Mono", monospace; font-size: 22px; font-weight: 700;
                color: #ffe600; letter-spacing: 3px; text-transform: uppercase;
            }
            .headline-box { margin: auto 0; }
            .main-headline {
                font-family: "Playfair Display", serif; font-size: 64px; font-weight: 900;
                line-height: 1.15; color: #ffffff; letter-spacing: -0.02em; margin-bottom: 28px;
            }
            .takeaway-card {
                background: rgba(255,255,255,0.06); border-left: 5px solid #ffe600;
                padding: 28px 32px; border-radius: 4px;
            }
            .takeaway-text { font-size: 26px; font-weight: 500; line-height: 1.5; color: #d0ccc2; }

            .source-row {
                font-family: "Space Mono", monospace; font-size: 18px; color: #777770;
                border-top: 1px solid rgba(255,255,255,0.1); padding-top: 18px;
            }

            @keyframes slideDown { from { opacity: 0; transform: translateY(-40px); } to { opacity: 1; transform: none; } }
            @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
        
  /* DOCUMENT PANE MEDIA — supplied via the scene's media block */
  .doc-media, .doc-media-ph {
    position: absolute; inset: 0; width: 100%; height: 100%;
  }
  .doc-media { object-fit: cover; }
  /* Shapes only, never words — a stand-in that says something says it on every video that
     forgets its clip. */
  .doc-media-ph {
    background: #0a0c14;
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 30px, transparent 30px 60px);
  }
  /* A FIXED scrim, not an adaptive one: the pipeline picks clips nobody previewed, so the
     text has to stay readable over a bright frame and a dark one alike. Same reasoning as
     frame-broll's. */
  .doc-scrim {
    position: absolute; inset: 0;
    /* .45 in the middle was not enough: over bright water the small furniture (case id,
       VERIFIED, the doc title) washed out while only the big quote stayed readable. Rendered
       and looked at — .66 holds all of them without burying the footage. */
    background: linear-gradient(180deg, rgba(6,8,14,.86) 0%, rgba(6,8,14,.66) 42%, rgba(6,8,14,.90) 100%);
  }
  .has-media { background: #0a0c14 !important; color: #f2ede2 !important; }
  .has-media .paper-texture { display: none; }
  .has-media .hud-header  { border-bottom-color: rgba(255,255,255,.35); }
  .has-media .doc-title,
  .has-media .doc-quote   { color: #f2ede2; text-shadow: 0 4px 24px rgba(0,0,0,.9); }
  .has-media .timecode,
  .has-media .evidence-id,
  .has-media .verified-stamp { color: rgba(242,237,226,.85); text-shadow: 0 2px 12px rgba(0,0,0,.9); }
  .has-media .doc-body,
  .has-media .hud-header,
  .has-media .doc-footer  { position: relative; z-index: 2; }
</style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="5"
            data-width="1080"
            data-height="1920"
            data-composition-variables='{"kicker":"ĐIỀU TRA ĐỘC LẬP","tag_label":"TÀI LIỆU GỐC","doc_title":"Trích Lục Báo Cáo Tài Chính 2026","doc_snippet":"Toàn bộ chi phí ẩn đã bị che giấu suốt 18 tháng qua các hợp đồng gia công bên ngoài.","headline":"Sự Thật Đằng Sau Báo Cáo Nghìn Tỷ","takeaway":"Dữ liệu nội bộ xác thực sai lệch lên tới 42% so với công bố chính thức.","source":"Hồ sơ kiểm toán độc lập 2026"}'
        >
            <div class="top-panel">
                <div class="paper-texture"></div>
                <div class="hud-header">
                    <div class="tag-pill"><span class="tag-txt"></span></div>
                    <div class="timecode"><span class="tc-txt"></span></div>
                </div>
                <div class="doc-body">
                    <div class="doc-title"></div>
                    <div class="doc-quote"></div>
                </div>
                <div class="doc-footer">
                    <div class="evidence-id"><span class="ev-txt"></span></div>
                    <div class="verified-stamp"><span class="vs-txt"></span></div>
                </div>
            </div>

            <div class="bottom-panel">
                <div class="kicker-row"><span class="kicker-txt"></span></div>
                <div class="headline-box">
                    <div class="main-headline"></div>
                    <div class="takeaway-card">
                        <div class="takeaway-text"></div>
                    </div>
                </div>
                <div class="source-row">
                    <div class="source-txt"></div>
                </div>
            </div>
        </div>

        <script>
            (function () {
                var v = window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                    ? window.__hyperframes.getVariables() : {};
                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null && String(text).trim() !== "") el.textContent = String(text);
                };
                set(".tag-txt", v.tag_label || "TƯ LIỆU GỐC");
                set(".tc-txt", "REC ● 00:14:28");
                set(".ev-txt", "CASE #VX-882");
                set(".vs-txt", "VERIFIED ✓");
                set(".doc-title", v.doc_title);
                set(".doc-quote", v.doc_snippet);
                set(".kicker-txt", v.kicker);
                set(".main-headline", v.headline);
                set(".takeaway-text", v.takeaway);
                set(".source-txt", v.source ? "Nguồn: " + v.source : "");
                // Real footage in the document pane, when the scene supplies it. Without it
                // the pane keeps its cream-paper look and nothing below runs.
                window.__docMedia = null;
                if (v.media_kind) {
                    var pane = document.querySelector(".top-panel") || document.querySelector(".left-panel");
                    if (pane) {
                        pane.className += " has-media";
                        var ph = document.createElement("div");
                        ph.className = "doc-media-ph";
                        ph.setAttribute("data-media-fallback", "");
                        // BEFORE the media: both are positioned, so the later one in the
                        // markup paints on top. A stand-in after the clip would cover it.
                        pane.insertBefore(ph, pane.firstChild);

                        var el;
                        if (String(v.media_kind) === "video") {
                            el = document.createElement("video");
                            el.src = "assets/media.mp4";
                            el.muted = true; el.playsInline = true; el.preload = "auto";
                            window.__docMedia = el;
                        } else {
                            el = document.createElement("img");
                            el.src = "assets/media.png";
                            el.alt = "";
                            // Empty alt suppresses alt TEXT, not Chrome's own broken-image
                            // mark on a sized element. Hide it so a missing file leaves the
                            // stand-in alone.
                            el.onerror = function () { el.style.display = "none"; };
                        }
                        el.className = "doc-media";
                        pane.insertBefore(el, ph.nextSibling);

                        var scrim = document.createElement("div");
                        scrim.className = "doc-scrim";
                        pane.insertBefore(scrim, el.nextSibling);
                    }
                }
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = window.__timelines["portrait"] = {
                pause: function () {},
                seek: function (t) { var m = window.__docMedia; if (m) { try { m.currentTime = t; } catch (e) {} } },
                paused: function () { return true; },
            };
        </script>
    </body>
</html>
