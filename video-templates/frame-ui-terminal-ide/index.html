<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1920, height=1080" />
        <title>UI Pro Terminal IDE · 16:9</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;900&family=JetBrains+Mono:wght@500;700;800&family=Space+Mono:wght@700&display=swap"
            rel="stylesheet"
        />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0e17; }
            #root {
                position: relative; width: 1920px; height: 1080px;
                background: #0a0e17; color: #e2e8f0;
                font-family: "Be Vietnam Pro", sans-serif;
                overflow: hidden; padding: 50px 100px;
                display: flex; flex-direction: column; justify-content: space-between;
            }

            .header-bar {
                display: flex; justify-content: space-between; align-items: baseline;
                opacity: 0; animation: fadeDown 0.5s ease-out 0.1s both;
            }
            .kicker-tag {
                font-family: "Space Mono", monospace; font-size: 20px; font-weight: 700;
                color: #38bdf8; letter-spacing: 3px; text-transform: uppercase;
            }
            .takeaway-hdr { font-size: 24px; font-weight: 600; color: #94a3b8; }

            /* Main IDE Window */
            .ide-window {
                background: #0d1117; border: 1px solid #30363d; border-radius: 18px;
                box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
                height: 860px; overflow: hidden; display: flex; flex-direction: column;
                opacity: 0; animation: idePop 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
            }

            /* Window Titlebar */
            .titlebar {
                background: #161b22; height: 50px; border-bottom: 1px solid #30363d;
                display: flex; align-items: center; justify-content: space-between;
                padding: 0 20px;
            }
            .window-controls { display: flex; gap: 8px; }
            .wc-dot { width: 12px; height: 12px; border-radius: 50%; }
            .wc-r { background: #ff5f56; }
            .wc-y { background: #ffbd2e; }
            .wc-g { background: #27c93f; }

            .tab-bar { display: flex; align-items: center; gap: 10px; }
            .active-tab {
                background: #0d1117; border-top: 2px solid #38bdf8; border-right: 1px solid #30363d;
                border-left: 1px solid #30363d; height: 50px; padding: 0 20px;
                display: flex; align-items: center; gap: 10px; font-family: "JetBrains Mono", monospace;
                font-size: 15px; font-weight: 700; color: #ffffff;
            }
            .lang-pill {
                background: rgba(56, 189, 248, 0.15); color: #38bdf8;
                font-family: "Space Mono", monospace; font-size: 13px; font-weight: 700;
                padding: 4px 10px; border-radius: 6px;
            }

            /* Editor Workspace Body */
            .ide-body { display: grid; grid-template-columns: 280px 1fr; flex: 1; overflow: hidden; }

            /* Sidebar */
            .file-sidebar {
                background: #161b22; border-right: 1px solid #30363d; padding: 24px 20px;
                font-family: "JetBrains Mono", monospace; font-size: 15px; color: #8b949e;
                display: flex; flex-direction: column; gap: 14px;
            }
            .sb-header { font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #6e7681; }
            .sb-item { display: flex; align-items: center; gap: 10px; }
            .sb-active { color: #58a6ff; font-weight: 700; }

            /* Code Area + Bottom Terminal */
            .main-editor { display: flex; flex-direction: column; justify-content: space-between; }

            .code-content {
                padding: 30px 40px; font-family: "JetBrains Mono", monospace;
                font-size: 22px; line-height: 1.7; color: #e6edf3;
            }
            .code-line { display: flex; gap: 24px; align-items: center; }
            .line-num { color: #484f58; width: 30px; text-align: right; user-select: none; }
            .syntax-kwd { color: #ff7b72; font-weight: 700; }
            .syntax-fn { color: #d2a8ff; }
            .syntax-str { color: #a5d6ff; }
            .syntax-comm { color: #8b949e; font-style: italic; }

            /* Bottom Terminal */
            .ide-terminal {
                background: #090d13; border-top: 1px solid #30363d; padding: 20px 30px;
                height: 180px; font-family: "JetBrains Mono", monospace; font-size: 18px;
            }
            .term-hdr { display: flex; justify-content: space-between; color: #8b949e; font-size: 14px; margin-bottom: 10px; }
            .term-cmd-row { display: flex; align-items: center; gap: 10px; color: #38bdf8; font-weight: 700; }
            .term-out-row { color: #3fb950; margin-top: 8px; }

            @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
            @keyframes idePop { from { opacity: 0; transform: scale(0.97) translateY(20px); } to { opacity: 1; transform: none; } }
        </style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="5"
            data-width="1920"
            data-height="1080"
            data-composition-variables='{"kicker":"MÃ NGUỒN TỰ ĐỘNG HÓA","file_name":"agent.engine.ts","lang_tag":"TYPESCRIPT","code_line_1":"import { Pipeline, LLMWorker } from \"@agent/core\";","code_line_2":"export const runAgent = async (task: TaskConfig) => {","code_line_3":"  const pipeline = new Pipeline({ timeout: 5000 });","code_line_4":"  return await pipeline.execute(task.payload);","code_line_5":"};","terminal_cmd":"pnpm test:engine --coverage","terminal_output":"✓ 48/48 test suites passed (100% coverage, 84ms)","takeaway":"Module tối ưu tốc độ phân tán, đạt độ bao phủ kiểm thử 100%."}'
        >
            <div class="header-bar">
                <div class="kicker-tag"><span class="kicker-txt"></span></div>
                <div class="takeaway-hdr"><span class="takeaway-txt"></span></div>
            </div>

            <div class="ide-window">
                <div class="titlebar">
                    <div class="window-controls">
                        <div class="wc-dot wc-r"></div>
                        <div class="wc-dot wc-y"></div>
                        <div class="wc-dot wc-g"></div>
                    </div>
                    <div class="tab-bar">
                        <div class="active-tab">
                            <span>📄</span>
                            <span class="file-tab-txt"></span>
                        </div>
                    </div>
                    <div class="lang-pill"><span class="lang-txt"></span></div>
                </div>

                <div class="ide-body">
                    <div class="file-sidebar">
                        <div class="sb-header"><span class="sb-h-txt"></span></div>
                        <div class="sb-item">📁 <span class="sb-f1"></span></div>
                        <div class="sb-item sb-active">📄 <span class="sb-file-name"></span></div>
                        <div class="sb-item">📄 <span class="sb-f2"></span></div>
                        <div class="sb-item">📄 <span class="sb-f3"></span></div>
                    </div>

                    <div class="main-editor">
                        <div class="code-content">
                            <div class="code-line"><span class="line-num">1</span><span class="cl-1"></span></div>
                            <div class="code-line"><span class="line-num">2</span><span class="cl-2"></span></div>
                            <div class="code-line"><span class="line-num">3</span><span class="cl-3"></span></div>
                            <div class="code-line"><span class="line-num">4</span><span class="cl-4"></span></div>
                            <div class="code-line"><span class="line-num">5</span><span class="cl-5"></span></div>
                        </div>

                        <div class="ide-terminal">
                            <div class="term-hdr">
                                <span class="th-l"></span>
                                <span class="th-r"></span>
                            </div>
                            <div class="term-cmd-row">
                                <span>$</span>
                                <span class="term-cmd-txt"></span>
                            </div>
                            <div class="term-out-row">
                                <span class="term-out-txt"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            (function () {
                var v = window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                    ? window.__hyperframes.getVariables() : {};
                var set = function (sel, text) {
                    var el = document.querySelectorAll(sel);
                    for (var i = 0; i < el.length; i++) {
                        if (text != null && String(text).trim() !== "") el[i].textContent = String(text);
                    }
                };
                set(".kicker-txt", v.kicker);
                set(".takeaway-txt", v.takeaway);
                set(".file-tab-txt", v.file_name || "index.ts");
                set(".sb-h-txt", "EXPLORER // PROJECT");
                set(".sb-f1", "src/core");
                set(".sb-file-name", v.file_name || "index.ts");
                set(".sb-f2", "config.json");
                set(".sb-f3", "schema.d.ts");
                set(".th-l", "TERMINAL · BASH");
                set(".th-r", "EXIT: 0");
                set(".lang-txt", v.lang_tag || "TYPESCRIPT");
                set(".cl-1", v.code_line_1);
                set(".cl-2", v.code_line_2);
                set(".cl-3", v.code_line_3);
                set(".cl-4", v.code_line_4);
                set(".cl-5", v.code_line_5);
                set(".term-cmd-txt", v.terminal_cmd || "pnpm test");
                set(".term-out-txt", v.terminal_output);
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = { pause: function () {}, seek: function () {}, paused: function () { return true; } };
        </script>
    </body>
</html>
