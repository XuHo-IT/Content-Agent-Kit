<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1080, height=1920" />
        <title>GEO City Versus · Portrait</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap"
            rel="stylesheet"
        />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { width: 1080px; height: 1920px; overflow: hidden; background: #022c22; }
            #root {
                position: relative; width: 1080px; height: 1920px;
                background: #022c22; color: #f0fdf4;
                font-family: "Plus Jakarta Sans", sans-serif;
                overflow: hidden; padding: 90px 60px;
                display: flex; flex-direction: column; justify-content: space-between;
            }

            .map-grid-bg {
                position: absolute; inset: 0;
                background-image: linear-gradient(rgba(52, 211, 153, 0.08) 1px, transparent 1px),
                                  linear-gradient(90deg, rgba(52, 211, 153, 0.08) 1px, transparent 1px);
                background-size: 40px 40px;
            }

            .header-bar {
                text-align: center; position: relative; z-index: 5;
                opacity: 0; animation: fadeDown 0.5s ease-out 0.1s both;
            }
            .kicker-tag {
                font-family: "JetBrains Mono", monospace; font-size: 15px; font-weight: 800;
                color: #34d399; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px;
            }
            .main-title { font-size: 34px; font-weight: 900; color: #ffffff; letter-spacing: -0.02em; line-height: 1.25; }

            .arena-container {
                display: flex; flex-direction: column;
                gap: 20px; width: 100%; margin: auto 0;
                position: relative; z-index: 5;
            }

            .city-card {
                background: rgba(4, 47, 36, 0.9); border: 2px solid rgba(52, 211, 153, 0.4);
                border-radius: 20px; padding: 22px 24px; box-shadow: 0 16px 36px rgba(0,0,0,0.6);
                backdrop-filter: blur(16px);
                opacity: 0; animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
                display: flex; flex-direction: column; gap: 14px;
            }
            .card-a { animation-delay: 0.2s; border-top: 6px solid #34d399; }
            .card-b { animation-delay: 0.35s; border-top: 6px solid #f43f5e; }

            .city-header { display: flex; justify-content: space-between; align-items: center; }
            .city-name { font-size: 28px; font-weight: 900; color: #ffffff; }
            .city-badge {
                font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 800;
                padding: 4px 12px; border-radius: 6px; text-transform: uppercase;
            }
            .b-a { background: rgba(52, 211, 153, 0.2); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.4); }
            .b-b { background: rgba(244, 63, 94, 0.2); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.4); }

            .mini-map {
                width: 100%; height: 75px; border-radius: 10px; background: rgba(2, 44, 34, 0.8);
                border: 1px solid rgba(52, 211, 153, 0.3); overflow: hidden; position: relative;
            }
            .mini-map svg { width: 100%; height: 100%; }

            .metrics-list { display: flex; flex-direction: column; gap: 8px; }
            .metric-row {
                display: flex; justify-content: space-between; align-items: center;
                background: rgba(255,255,255,0.04); padding: 8px 14px; border-radius: 8px;
            }
            .metric-name { font-size: 15px; font-weight: 600; color: #94a3b8; }
            .metric-val { font-family: "JetBrains Mono", monospace; font-size: 16px; font-weight: 800; color: #ffffff; }

            .vs-badge {
                width: 50px; height: 50px; border-radius: 50%;
                background: radial-gradient(circle, #f43f5e 0%, #be123c 100%);
                color: #ffffff; font-family: "JetBrains Mono", monospace;
                font-size: 18px; font-weight: 900; display: grid; place-items: center;
                margin: -8px auto; box-shadow: 0 0 20px rgba(244, 63, 94, 0.5);
                border: 2px solid #ffffff; z-index: 10;
                animation: vsPulse 1.5s ease-in-out infinite alternate;
            }

            .bottom-summary {
                text-align: center; position: relative; z-index: 5;
                background: rgba(4, 47, 36, 0.85); border: 1px solid rgba(52, 211, 153, 0.3);
                border-radius: 14px; padding: 16px 20px; font-size: 17px; font-weight: 600; color: #e2e8f0; line-height: 1.4;
            }

            @keyframes vsPulse { 0% { transform: scale(0.95); } 100% { transform: scale(1.08); } }
            @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
            @keyframes cardIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
        </style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="portrait"
            data-start="0"
            data-duration="5"
            data-width="1080"
            data-height="1920"
            data-composition-variables='{"kicker":"Góc nhìn địa lý & kinh tế","versus_title":"So Sánh Tiềm Năng Phát Triển Hai Đầu Cầu","city_a_name":"Hà Nội","city_a_badge":"MIỀN BẮC","city_b_name":"TP. Hồ Chí Minh","city_b_badge":"MIỀN NAM","metric_1_name":"Chi Phí Thuê Văn Phòng / m²","metric_1_val_a":"$28 / THÁNG","metric_1_val_b":"$35 / THÁNG","metric_2_name":"Nhân Lực Công Nghệ","metric_2_val_a":"120,000+","metric_2_val_b":"180,000+","metric_3_name":"Tốc Độ Tăng Trưởng GRDP","metric_3_val_a":"6.2%","metric_3_val_b":"7.1%","summary":"Mỗi trung tâm sở hữu một thế mạnh riêng biệt: Hà Nội tối ưu cho khối hành chính & R&D, trong khi TP.HCM dẫn đầu về thương mại & quy mô thị trường tiêu dùng."}'
        >
            <div class="map-grid-bg"></div>

            <div class="header-bar">
                <div class="kicker-tag"><span class="kicker-txt"></span></div>
                <div class="main-title"></div>
            </div>

            <div class="arena-container">
                <div class="city-card card-a">
                    <div class="city-header">
                        <div class="city-name ca-name"></div>
                        <div class="city-badge b-a ca-badge"></div>
                    </div>
                    <div class="mini-map">
                        <svg viewBox="0 0 400 75">
                            <path d="M 0,35 Q 150,10 250,55 T 400,25" fill="none" stroke="rgba(52,211,153,0.3)" stroke-width="2" />
                            <circle cx="200" cy="35" r="16" fill="none" stroke="rgba(52,211,153,0.4)" stroke-width="2" />
                            <circle cx="200" cy="35" r="6" fill="#34d399" />
                        </svg>
                    </div>
                    <div class="metrics-list">
                        <div class="metric-row">
                            <span class="metric-name m1-name"></span>
                            <span class="metric-val m1-va"></span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-name m2-name"></span>
                            <span class="metric-val m2-va"></span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-name m3-name"></span>
                            <span class="metric-val m3-va"></span>
                        </div>
                    </div>
                </div>

                <div class="vs-badge"><span class="vs-txt"></span></div>

                <div class="city-card card-b">
                    <div class="city-header">
                        <div class="city-name cb-name"></div>
                        <div class="city-badge b-b cb-badge"></div>
                    </div>
                    <div class="mini-map">
                        <svg viewBox="0 0 400 75">
                            <path d="M 0,20 Q 180,60 280,20 T 400,50" fill="none" stroke="rgba(244,63,94,0.3)" stroke-width="2" />
                            <circle cx="220" cy="35" r="16" fill="none" stroke="rgba(244,63,94,0.4)" stroke-width="2" />
                            <circle cx="220" cy="35" r="6" fill="#f43f5e" />
                        </svg>
                    </div>
                    <div class="metrics-list">
                        <div class="metric-row">
                            <span class="metric-name m1-name"></span>
                            <span class="metric-val m1-vb"></span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-name m2-name"></span>
                            <span class="metric-val m2-vb"></span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-name m3-name"></span>
                            <span class="metric-val m3-vb"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bottom-summary">
                <div class="summary-text"></div>
            </div>
        </div>

        <script>
            (function () {
                var v = window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                    ? window.__hyperframes.getVariables() : {};
                var set = function (sel, text) {
                    var el = document.querySelectorAll(sel);
                    for (var i = 0; i < el.length; i++) {
                        if (text != null && String(text).trim() !== "") el[i].textContent = String(text);
                    }
                };
                set(".kicker-txt", v.kicker);
                set(".main-title", v.versus_title);
                set(".ca-name", v.city_a_name);
                set(".ca-badge", v.city_a_badge || "ZONE A");
                set(".cb-name", v.city_b_name);
                set(".cb-badge", v.city_b_badge || "ZONE B");
                set(".vs-txt", "VS");
                set(".m1-name", v.metric_1_name);
                set(".m1-va", v.metric_1_val_a);
                set(".m1-vb", v.metric_1_val_b);
                set(".m2-name", v.metric_2_name);
                set(".m2-va", v.metric_2_val_a);
                set(".m2-vb", v.metric_2_val_b);
                set(".m3-name", v.metric_3_name);
                set(".m3-va", v.metric_3_val_a);
                set(".m3-vb", v.metric_3_val_b);
                set(".summary-text", v.summary);
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = window.__timelines["portrait"] = { pause: function () {}, seek: function () {}, paused: function () { return true; } };
        </script>
    </body>
</html>
