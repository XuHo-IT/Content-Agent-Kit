<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1920, height=1080" />
        <title>GEO City Versus · 16:9</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;900&family=Space+Mono:wght@700&display=swap"
            rel="stylesheet"
        />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { width: 1920px; height: 1080px; overflow: hidden; background: #080e1a; }
            #root {
                position: relative; width: 1920px; height: 1080px;
                background: #080e1a; color: #f1f5f9;
                font-family: "Be Vietnam Pro", sans-serif;
                overflow: hidden; padding: 60px 100px;
                display: flex; flex-direction: column; justify-content: space-between;
            }

            .ambient-glow {
                position: absolute; top: 50%; left: 50%; width: 900px; height: 900px;
                transform: translate(-50%, -50%);
                background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, rgba(244, 63, 94, 0.05) 50%, transparent 80%);
                pointer-events: none;
            }

            .header-bar {
                text-align: center;
                opacity: 0; animation: fadeDown 0.5s ease-out 0.1s both;
            }
            .kicker-tag {
                font-family: "Space Mono", monospace; font-size: 20px; font-weight: 700;
                color: #38bdf8; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px;
            }
            .main-title { font-size: 46px; font-weight: 900; color: #ffffff; letter-spacing: -0.02em; }

            /* Versus Arena */
            .arena-container {
                display: grid; grid-template-columns: 1fr 140px 1fr;
                align-items: center; gap: 20px; width: 100%; margin: auto 0;
            }

            .city-card {
                background: rgba(15, 23, 42, 0.85); border: 2px solid rgba(255,255,255,0.1);
                border-radius: 24px; padding: 40px 48px; box-shadow: 0 16px 36px rgba(0,0,0,0.5);
                backdrop-filter: blur(12px);
                opacity: 0; animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .card-a { animation-delay: 0.2s; border-left: 6px solid #38bdf8; }
            .card-b { animation-delay: 0.35s; border-right: 6px solid #f43f5e; }

            .city-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
            .city-name { font-size: 40px; font-weight: 900; color: #ffffff; }
            .city-badge {
                font-family: "Space Mono", monospace; font-size: 16px; font-weight: 700;
                padding: 6px 16px; border-radius: 8px; text-transform: uppercase;
            }
            .b-a { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
            .b-b { background: rgba(244, 63, 94, 0.15); color: #f43f5e; }

            .metrics-list { display: flex; flex-direction: column; gap: 20px; }
            .metric-row { display: flex; justify-content: space-between; align-items: center; }
            .metric-name { font-size: 20px; font-weight: 600; color: #94a3b8; }
            .metric-val { font-family: "Space Mono", monospace; font-size: 24px; font-weight: 800; color: #ffffff; }

            .vs-badge {
                width: 90px; height: 90px; border-radius: 50%;
                background: linear-gradient(135deg, #1e293b, #0f172a);
                border: 3px solid rgba(255,255,255,0.2); margin: 0 auto;
                display: flex; align-items: center; justify-content: center;
                font-family: "Space Mono", monospace; font-size: 28px; font-weight: 900;
                color: #ffe600; box-shadow: 0 0 30px rgba(0,0,0,0.8);
                opacity: 0; animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
            }

            /* Bottom Summary */
            .bottom-summary {
                text-align: center; background: rgba(15, 23, 42, 0.6);
                border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
                padding: 20px 40px;
                opacity: 0; animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both;
            }
            .summary-text { font-size: 22px; font-weight: 600; color: #cbd5e1; }

            @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
            @keyframes cardIn { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: none; } }
            @keyframes scaleIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
            @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
        </style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="5"
            data-width="1920"
            data-height="1080"
            data-composition-variables='{"kicker":"ĐỐI ĐẦU ĐỊA LÝ & KINH TẾ","versus_title":"So Sánh Tiềm Năng Phát Triển Hai Đầu Cầu","city_a_name":"Hà Nội","city_a_badge":"TRUNG TÂM R&D","city_b_name":"TP. Hồ Chí Minh","city_b_badge":"TRUNG TÂM TÀI CHÍNH","metric_1_name":"Chi Phí Văn Phòng / m²","metric_1_val_a":"$28 / THÁNG","metric_1_val_b":"$36 / THÁNG","metric_2_name":"Nhân Lực Công Nghệ","metric_2_val_a":"145,000+","metric_2_val_b":"190,000+","metric_3_name":"Tốc Độ Tăng Trưởng GDP","metric_3_val_a":"6.8%","metric_3_val_b":"7.2%","summary":"Hà Nội tối ưu vượt trội về chi phí nghiên cứu phát triển, trong khi TP.HCM chiếm ưu thế về tốc độ gọi vốn thương mại."}'
        >
            <div class="ambient-glow"></div>

            <div class="header-bar">
                <div class="kicker-tag"><span class="kicker-txt"></span></div>
                <div class="main-title"></div>
            </div>

            <div class="arena-container">
                <div class="city-card card-a">
                    <div class="city-header">
                        <div class="city-name ca-name"></div>
                        <div class="city-badge b-a ca-badge"></div>
                    </div>
                    <div class="metrics-list">
                        <div class="metric-row">
                            <span class="metric-name m1-name"></span>
                            <span class="metric-val m1-va"></span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-name m2-name"></span>
                            <span class="metric-val m2-va"></span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-name m3-name"></span>
                            <span class="metric-val m3-va"></span>
                        </div>
                    </div>
                </div>

                <div class="vs-badge"><span class="vs-txt"></span></div>

                <div class="city-card card-b">
                    <div class="city-header">
                        <div class="city-name cb-name"></div>
                        <div class="city-badge b-b cb-badge"></div>
                    </div>
                    <div class="metrics-list">
                        <div class="metric-row">
                            <span class="metric-name m1-name"></span>
                            <span class="metric-val m1-vb"></span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-name m2-name"></span>
                            <span class="metric-val m2-vb"></span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-name m3-name"></span>
                            <span class="metric-val m3-vb"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bottom-summary">
                <div class="summary-text"></div>
            </div>
        </div>

        <script>
            (function () {
                var v = window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                    ? window.__hyperframes.getVariables() : {};
                var set = function (sel, text) {
                    var el = document.querySelectorAll(sel);
                    for (var i = 0; i < el.length; i++) {
                        if (text != null && String(text).trim() !== "") el[i].textContent = String(text);
                    }
                };
                set(".kicker-txt", v.kicker);
                set(".main-title", v.versus_title);
                set(".ca-name", v.city_a_name);
                set(".ca-badge", v.city_a_badge || "ZONE A");
                set(".cb-name", v.city_b_name);
                set(".cb-badge", v.city_b_badge || "ZONE B");
                set(".vs-txt", "VS");
                set(".m1-name", v.metric_1_name);
                set(".m1-va", v.metric_1_val_a);
                set(".m1-vb", v.metric_1_val_b);
                set(".m2-name", v.metric_2_name);
                set(".m2-va", v.metric_2_val_a);
                set(".m2-vb", v.metric_2_val_b);
                set(".m3-name", v.metric_3_name);
                set(".m3-va", v.metric_3_val_a);
                set(".m3-vb", v.metric_3_val_b);
                set(".summary-text", v.summary);
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = { pause: function () {}, seek: function () {}, paused: function () { return true; } };
        </script>
    </body>
</html>
