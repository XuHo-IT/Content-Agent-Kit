<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Historical Milestone War Timeline · 16:9</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #12100E; }
    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #12100E;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 50px 100px;
    }
    
      .war-timeline-stage { background: radial-gradient(circle at 50% 0%, #26201A 0%, #12100E 100%); border: 1px solid #44372C; border-radius: 24px; padding: 36px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
      .wt-title { font-family: 'Cinzel', serif; font-size: 36px; font-weight: 900; color: #D4AF37; text-align: center; }

      .milestones-spine { position: relative; display: flex; flex-direction: column; gap: 16px; margin: 10px 0 10px 20px; }
      .spine-line { position: absolute; top: 10px; bottom: 10px; left: 7px; width: 2px; background: #D4AF37; }
      .ms-node { display: flex; align-items: center; gap: 20px; position: relative; z-index: 2; }
      .ms-dot { width: 16px; height: 16px; border-radius: 50%; background: #26201A; border: 2px solid #D4AF37; }
      .ms-active { background: #D4AF37; box-shadow: 0 0 12px #D4AF37; }
      .ms-card { background: #1C1814; border: 1px solid #44372C; padding: 12px 18px; border-radius: 8px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #E7E5E4; font-weight: 600; flex: 1; }
      .ms-highlight { background: rgba(212,175,55,0.15); border-color: #D4AF37; color: #FFF; font-weight: 700; }

      .wt-footer { background: #1C1814; border-left: 4px solid #D4AF37; padding: 14px 20px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #D4AF37; font-weight: 700; }
    
  
  /* AMBIENT — hạt phim và một vignette thở. Đúng chất tư liệu cũ, và nó che bớt sự phẳng
     của một dòng thời gian tĩnh. */
  #root::before {
    content: ""; position: absolute; inset: -10%; pointer-events: none; z-index: 0;
    background-image: radial-gradient(rgba(255,255,255,.035) 1px, transparent 0);
    background-size: 3px 3px;
    animation: ambFilm 11s steps(6) infinite;
  }
  #root::after {
    content: ""; position: absolute; inset: -10%; pointer-events: none; z-index: 0;
    background: radial-gradient(78% 62% at 50% 46%, transparent 52%, rgba(0,0,0,.30) 100%);
    animation: ambVig 17s ease-in-out infinite alternate;
  }
  /* steps() cố ý: hạt phim nhảy nấc mới ra chất máy chiếu, chuyển động mượt thì thành sương. */
  @keyframes ambFilm { from { transform: translate3d(0, 0, 0); }
                       to   { transform: translate3d(3px, 3px, 0); } }
  @keyframes ambVig  { from { opacity: .6; } to { opacity: 1; } }
</style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080" data-composition-variables='{"headline":"Cuộc Chiến Giành Thị Phần Trình Duyệt","event_1":"1995: Netscape thống trị 90% người dùng web","event_2":"1998: Microsoft tung IE tích hợp thẳng vào Windows","event_3":"2008: Google Chrome ra mắt thay đổi hoàn toàn cục diện","conclusion":"Tốc độ và hệ sinh thái mở luôn đánh bại sự độc quyền khép kín."}'>
    
      <div class="war-timeline-stage">
        <h1 class="wt-title" data-slot="headline"></h1>

        <div class="milestones-spine">
          <div class="spine-line"></div>
          <div class="ms-node">
            <span class="ms-dot"></span>
            <div class="ms-card" data-slot="event_1"></div>
          </div>
          <div class="ms-node">
            <span class="ms-dot"></span>
            <div class="ms-card" data-slot="event_2"></div>
          </div>
          <div class="ms-node">
            <span class="ms-dot ms-active"></span>
            <div class="ms-card ms-highlight" data-slot="event_3"></div>
          </div>
        </div>

        <div class="wt-footer" data-slot="conclusion"></div>
      </div>
    
  </div>
  <script>
    (function () {
      var root = document.getElementById("root");
      var v = {};
      // getVariables() is the renderer's channel; the attribute is only the editor's preview
      // default. Reading only the attribute meant every value the caller passed was thrown
      // away and the frame published its stock demo copy instead — a laptop spec sheet in a
      // horror episode. Renderer first, attribute as the fallback that keeps preview working.
      try {
        v = window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
          ? (window.__hyperframes.getVariables() || {}) : {};
      } catch (e) {}
      if (!v || !Object.keys(v).length) {
        try { v = JSON.parse(root.getAttribute("data-composition-variables") || "{}"); } catch (e2) {}
      }
      
      document.querySelectorAll("[data-slot]").forEach(function (el) {
        var k = el.getAttribute("data-slot");
        if (v[k] !== undefined) {
          if (v[k] === "") el.remove();
          else el.textContent = v[k];
        }
      });

      var ordersListBids = document.querySelector(".bids-list");
      var ordersListAsks = document.querySelector(".asks-list");
      if (ordersListBids && v.bids) {
        v.bids.split("|").forEach(function(item) {
          var p = item.split(":");
          if(p.length === 2) {
            var row = document.createElement("div");
            row.className = "order-row";
            row.innerHTML = "<span>" + p[0].trim() + "</span><span>" + p[1].trim() + "</span>";
            ordersListBids.appendChild(row);
          }
        });
      }
      if (ordersListAsks && v.asks) {
        v.asks.split("|").forEach(function(item) {
          var p = item.split(":");
          if(p.length === 2) {
            var row = document.createElement("div");
            row.className = "order-row";
            row.innerHTML = "<span>" + p[0].trim() + "</span><span>" + p[1].trim() + "</span>";
            ordersListAsks.appendChild(row);
          }
        });
      }

      var legendList = document.querySelector(".pf-legend-list");
      if (legendList && v.items) {
        v.items.split("|").forEach(function(item) {
          var p = item.split(":");
          if(p.length === 2) {
            var row = document.createElement("div");
            row.className = "legend-item";
            row.innerHTML = "<span>" + p[0].trim() + "</span><span style='font-weight:700;'>" + p[1].trim() + "</span>";
            legendList.appendChild(row);
          }
        });
      }
    })();

    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = window.__timelines["portrait"] = {
      pause: function () {},
      seek: function () {},
      paused: function () { return true; },
      duration: function () { return 5; }
    };
  </script>
</body>
</html>
