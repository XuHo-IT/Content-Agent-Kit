<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1920, height=1080" />
        <title>Product Reveal · 16:9</title>
        <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet" />
        <style>
/*
 * frame-product-reveal — the moment a thing is named.
 *
 * Original work for this repo.
 *
 * The kit had a hook, bodies and an outro, but nothing for the beat where the
 * subject is finally shown. A launch video without that beat is a list of
 * features attached to nothing.
 *
 * A shutter covers the name, then wipes away. The name scales in behind it, so
 * the movement of the shutter and the arrival of the name are one gesture rather
 * than two animations that happen to overlap.
 *
 * `badge` is optional and disappears entirely when empty — a pill with no text
 * is worse than no pill. `tagline` sits under the name because a viewer who has
 * just read a product name is looking down, not up.
 */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow: hidden; }
html, body { width: 1920px; height: 1080px; }
#root { position: relative; width: 1920px; height: 1080px; overflow: hidden;
        font-family: "Be Vietnam Pro", sans-serif; }
#root { background: #07090d; color: #ffffff; display: grid; place-items: center; }
.glow { position: absolute; inset: 0; background:
        radial-gradient(circle at 50% 42%, rgba(94, 234, 212, 0.22), transparent 58%);
        opacity: 0; animation: glowin 1.1s ease-out 0.55s forwards; }
.stack { position: relative; text-align: center; }
.teaser { font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase;
          color: #5eead4; opacity: 0; animation: rise 0.5s ease-out 0.15s forwards; }
.namewrap { position: relative; display: inline-block; overflow: hidden; }
.name { font-weight: 900; letter-spacing: -0.02em; line-height: 1;
        transform: scale(0.86); opacity: 0;
        animation: reveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards; }
.shutter { position: absolute; inset: 0; background: #5eead4; transform-origin: right;
           animation: wipe 0.62s cubic-bezier(0.7, 0, 0.2, 1) 0.6s forwards; }
.tagline { color: #9aa4b2; opacity: 0; animation: rise 0.6s ease-out 1.15s forwards; }
.badge { display: inline-block; border: 2px solid #5eead4; color: #5eead4; border-radius: 999px;
         font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
         opacity: 0; animation: rise 0.5s ease-out 1.45s forwards; }
@keyframes reveal { to { transform: scale(1); opacity: 1; } }
@keyframes wipe { 0% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
@keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
@keyframes glowin { to { opacity: 1; } }
.teaser { font-size: 30px; margin-bottom: 34px; }
.name { font-size: 168px; }
.tagline { font-size: 40px; margin-top: 34px; max-width: 1200px; }
.badge { font-size: 24px; padding: 14px 34px; margin-top: 44px; }
        </style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="6"
            data-width="1920"
            data-height="1080"
            data-composition-variables='{"teaser":"Giới thiệu","name":"Tên sản phẩm","tagline":"Một câu nói rõ nó làm được gì","badge":"Ra mắt"}'
        >
            <div class="glow"></div>
            <div class="stack">
                <div class="teaser"></div>
                <div class="namewrap">
                    <div class="name"></div>
                    <div class="shutter"></div>
                </div>
                <div class="tagline"></div>
                <div class="badge"></div>
            </div>
        </div>
        <script>
            (function () {
                var v =
                    window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                        ? window.__hyperframes.getVariables()
                        : {};
                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null && String(text).length) el.textContent = String(text);
                };
                var drop = function (sel) {
                    var el = document.querySelector(sel);
                    if (el) el.remove();
                };
                // A slot left empty removes its element rather than rendering a gap. An empty
                // heading reads as missing data; an absent one reads as a deliberate omission.
                var setOrDrop = function (sel, text) {
                    if (text == null || !String(text).trim()) return drop(sel);
                    set(sel, text);
                };
                setOrDrop(".teaser", v.teaser);
                setOrDrop(".tagline", v.tagline);
                setOrDrop(".badge", v.badge);
                set(".name", v.name);
                if (!String(v.name || "").trim()) drop(".namewrap");
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = {
                pause: function () {},
                seek: function () {},
                paused: function () { return true; },
            };
        </script>
    </body>
</html>
