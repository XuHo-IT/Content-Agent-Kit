<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<!--
  frame-broll — 16:9 variant. DELIBERATELY a different layout from the 9:16 composition.

  hyperframes@0.6.94 renders a composition whose <video> covers the WHOLE frame by passing
  that clip straight through as the output — the rest of the page (scrim, headline, chip) is
  discarded. At 9:16 the clip and the frame share an aspect ratio and the page-side
  compositor runs normally, so `compositions/portrait.html` can be full-bleed. At 16:9 it is
  not, and a full-bleed layout here silently produces a bare stock clip with no text on it.

  Established by elimination: removing the <video> made this exact layout render correctly,
  while an explicit z-index, a wrapper element and a 2px inset all changed nothing.

  So landscape puts the footage in a large panel instead — the shape frame-media-inset uses,
  which does render correctly at 16:9. Same slots, same meaning, different composition.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  #root {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    font-family: "Be Vietnam Pro", "Inter Tight", system-ui, sans-serif;
    background:
      radial-gradient(900px 700px at 108% -12%, #1b2440 0%, transparent 62%),
      radial-gradient(900px 700px at -8% 112%, #2a1740 0%, transparent 62%),
      #05060a;
    color: #fff;
  }

  .chip {
    position: absolute; top: 74px; left: 88px;
    display: inline-flex; align-items: center; gap: 14px;
    padding: 14px 28px; border-radius: 999px;
    background: rgba(10,12,20,.55); border: 1px solid rgba(255,255,255,.22);
    font-size: 26px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    opacity: 0; animation: chipIn .7s cubic-bezier(.2,.8,.2,1) .15s forwards;
  }

  /* Text left, footage right — landscape has width to spend. */
  .txt { position: absolute; left: 88px; top: 300px; width: 780px; }
  .kicker {
    font-size: 28px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
    color: #8be9ff; margin-bottom: 20px;
    opacity: 0; animation: up .7s cubic-bezier(.2,.8,.2,1) .35s forwards;
  }
  h1 {
    margin: 0; font-size: 82px; line-height: 1.05; font-weight: 800; letter-spacing: -.02em;
    text-shadow: 0 10px 50px rgba(0,0,0,.85);
    opacity: 0; animation: up .8s cubic-bezier(.2,.8,.2,1) .5s forwards;
  }
  .sub {
    margin-top: 24px; font-size: 34px; line-height: 1.35; color: rgba(255,255,255,.9);
    opacity: 0; animation: up .8s cubic-bezier(.2,.8,.2,1) .68s forwards;
  }
  .rule {
    position: absolute; left: 88px; top: 680px; width: 0; height: 5px; border-radius: 3px;
    background: linear-gradient(90deg, #8be9ff, #a855f7);
    animation: rule 1.1s cubic-bezier(.2,.8,.2,1) .8s forwards;
  }

  .frame {
    position: absolute; right: 88px; top: 150px; width: 880px; height: 780px;
    border-radius: 30px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: 0 44px 110px rgba(0,0,0,.72);
    opacity: 0; transform: translateY(52px) scale(.97);
    animation: win .95s cubic-bezier(.2,.8,.2,1) .42s forwards;
  }
  .frame video, .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tint {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(5,6,10,.20) 0%, rgba(5,6,10,0) 42%, rgba(5,6,10,.50) 100%);
  }

  @keyframes up     { from { opacity: 0; transform: translateY(38px); } to { opacity: 1; transform: none; } }
  @keyframes chipIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: none; } }
  @keyframes win    { to { opacity: 1; transform: none; } }
  @keyframes rule   { to { width: 220px; } }
</style>
</head>
<body>
  <div
    id="root"
    data-composition-id="main"
    data-start="0"
    data-duration="5"
    data-width="1920"
    data-height="1080"
    data-composition-variables='{"chip":"","kicker":"","headline":"","subheadline":"","media_kind":"video"}'
  >
    <div class="chip"></div>

    <div class="txt">
      <div class="kicker"></div>
      <h1></h1>
      <div class="sub"></div>
    </div>
    <div class="rule"></div>

    <div class="frame">
      <video class="bg" src="assets/media.mp4" muted playsinline preload="auto"></video>
      <div class="tint"></div>
    </div>
  </div>

  <script>
    (function () {
      var v =
        window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
          ? window.__hyperframes.getVariables()
          : {};

      var set = function (sel, val) {
        var el = document.querySelector(sel);
        if (!el) return;
        var s = val == null ? "" : String(val);
        el.textContent = s;
        if (!s) el.style.display = "none";
      };

      set(".chip", v.chip);
      set(".kicker", v.kicker);
      set("h1", v.headline);
      set(".sub", v.subheadline);

      var media = document.querySelector(".frame video.bg");
      if (String(v.media_kind || "video") === "image" && media) {
        var img = document.createElement("img");
        img.className = "bg";
        img.src = "assets/media.png";
        media.parentNode.replaceChild(img, media);
        media = null;
      }

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = {
        pause: function () {},
        seek: function (t) {
          if (!media) return;
          try { media.currentTime = t; } catch (e) {}
        },
        paused: function () { return true; },
      };
    })();
  </script>
</body>
</html>
