<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<!--
  frame-broll — full-bleed stock footage with the line of narration over it.

  The clip is supplied by the pipeline as assets/media.mp4 (scripts/video/lib/compose.mjs
  copies the resolved file in before rendering). Playback is driven by the timeline seek
  handler at the bottom — HyperFrames pauses media and steps currentTime per frame, so
  the clip advances deterministically instead of playing in real time.

  The scrim is FIXED, not adaptive: it darkens the top and bottom and leaves the middle
  clear. That guarantees the text is readable over a bright clip and a dark one alike,
  which is the only way this works with footage nobody has previewed.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  #root {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    font-family: "Be Vietnam Pro", "Inter Tight", system-ui, sans-serif;
    background: #05060a;
  }
  video.bg, img.bg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scale(1.06);
  }
  .scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(4,6,12,.72) 0%, rgba(4,6,12,.10) 32%,
                              rgba(4,6,12,.30) 62%, rgba(4,6,12,.92) 100%);
  }
  .chip {
    position: absolute; top: 108px; left: 80px;
    display: inline-flex; align-items: center; gap: 14px;
    padding: 16px 30px; border-radius: 999px;
    background: rgba(10,12,20,.55); border: 1px solid rgba(255,255,255,.22);
    backdrop-filter: blur(14px);
    font-size: 32px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    color: #fff; opacity: 0; animation: chipIn .7s cubic-bezier(.2,.8,.2,1) .15s forwards;
  }
  .txt { position: absolute; left: 80px; right: 80px; bottom: 210px; color: #fff; }
  .kicker {
    font-size: 34px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
    color: #8be9ff; margin-bottom: 22px;
    opacity: 0; animation: up .7s cubic-bezier(.2,.8,.2,1) .35s forwards;
  }
  h1 {
    margin: 0; font-size: 104px; line-height: 1.04; font-weight: 800;
    letter-spacing: -.02em; text-shadow: 0 10px 50px rgba(0,0,0,.85);
    opacity: 0; animation: up .8s cubic-bezier(.2,.8,.2,1) .5s forwards;
  }
  .sub {
    margin-top: 26px; font-size: 42px; line-height: 1.35; font-weight: 400;
    color: rgba(255,255,255,.9); text-shadow: 0 6px 30px rgba(0,0,0,.8);
    opacity: 0; animation: up .8s cubic-bezier(.2,.8,.2,1) .68s forwards;
  }
  .rule {
    position: absolute; left: 80px; bottom: 150px; width: 0; height: 5px; border-radius: 3px;
    background: linear-gradient(90deg, #8be9ff, #a855f7);
    animation: rule 1.1s cubic-bezier(.2,.8,.2,1) .8s forwards;
  }
  @keyframes up   { from { opacity: 0; transform: translateY(38px); } to { opacity: 1; transform: none; } }
  @keyframes chipIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: none; } }
  @keyframes rule { to { width: 220px; } }
</style>
</head>
<body>
  <div
    id="root"
    data-composition-id="main"
    data-start="0"
    data-duration="5"
    data-width="1080"
    data-height="1920"
    data-composition-variables='{"chip":"","kicker":"","headline":"","subheadline":"","media_kind":"video"}'
  >
    <video class="bg" src="assets/media.mp4" muted playsinline preload="auto"></video>
    <div class="scrim"></div>

    <div class="chip"></div>
    <div class="txt">
      <div class="kicker"></div>
      <h1></h1>
      <div class="sub"></div>
    </div>
    <div class="rule"></div>
  </div>

  <script>
    (function () {
      var v =
        window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
          ? window.__hyperframes.getVariables()
          : {};

      var set = function (sel, val) {
        var el = document.querySelector(sel);
        if (!el) return;
        var s = val == null ? "" : String(val);
        el.textContent = s;
        if (!s) el.style.display = "none";
      };

      set(".chip", v.chip);
      set(".kicker", v.kicker);
      set("h1", v.headline);
      set(".sub", v.subheadline);

      // A still can stand in for footage (e.g. a stock photo) without a second template.
      var media = document.querySelector("video.bg");
      if (String(v.media_kind || "video") === "image" && media) {
        var img = document.createElement("img");
        img.className = "bg";
        img.src = "assets/media.png";
        media.parentNode.replaceChild(img, media);
        media = null;
      }

      // HyperFrames steps the timeline frame by frame; seeking currentTime is what makes
      // the footage advance deterministically (verified: same script -> same frames).
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = {
        pause: function () {},
        seek: function (t) {
          if (!media) return;
          try { media.currentTime = t; } catch (e) {}
        },
        paused: function () { return true; },
      };
    })();
  </script>
</body>
</html>
