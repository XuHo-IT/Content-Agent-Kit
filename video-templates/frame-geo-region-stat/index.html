<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1920, height=1080" />
        <title>Geo Regional Stat · 16:9</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap"
            rel="stylesheet"
        />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { width: 1920px; height: 1080px; overflow: hidden; background: #022c22; }
            #root {
                position: relative; width: 1920px; height: 1080px;
                background: #022c22; color: #f0fdf4;
                font-family: "Plus Jakarta Sans", sans-serif;
                overflow: hidden; padding: 60px 100px;
                display: flex; flex-direction: column; justify-content: space-between;
            }

            .map-grid-bg {
                position: absolute; inset: 0;
                background-image: linear-gradient(rgba(52, 211, 153, 0.08) 1px, transparent 1px),
                                  linear-gradient(90deg, rgba(52, 211, 153, 0.08) 1px, transparent 1px);
                background-size: 40px 40px;
            }

            .header-bar {
                position: relative; z-index: 5;
                opacity: 0; animation: fadeDown 0.5s ease-out 0.1s both;
            }
            .kicker-tag {
                font-family: "JetBrains Mono", monospace; font-size: 16px; font-weight: 800;
                letter-spacing: 2.5px; text-transform: uppercase; color: #34d399; margin-bottom: 6px;
            }
            .main-title {
                font-size: 44px; font-weight: 900; color: #ffffff; letter-spacing: -0.02em;
            }
            .sub-title {
                font-size: 20px; color: #a7f3d0; margin-top: 4px; font-weight: 600;
            }

            .stage-split {
                position: relative; z-index: 5;
                display: grid; grid-template-columns: 500px 1fr; gap: 60px; align-items: center;
                margin: auto 0;
            }

            /* Vector Regional Map Graphic */
            .vector-map-panel {
                width: 100%; height: 500px; border-radius: 20px;
                background: rgba(4, 47, 36, 0.9); border: 2px solid rgba(52, 211, 153, 0.35);
                overflow: hidden; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            }
            .map-svg { width: 100%; height: 100%; }

            .regions-container {
                display: flex; flex-direction: column; gap: 20px;
            }

            .region-row {
                background: rgba(4, 47, 36, 0.85); border: 1px solid rgba(52, 211, 153, 0.3);
                border-left: 6px solid #34d399;
                border-radius: 16px; padding: 20px 28px;
                display: flex; flex-direction: column; gap: 12px;
                backdrop-filter: blur(12px);
                opacity: 0; animation: rowIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
            }
            .region-row.is-highlight {
                background: rgba(6, 78, 59, 0.95); border-color: rgba(52, 211, 153, 0.7);
                border-left-color: #facc15;
                box-shadow: 0 0 30px rgba(52, 211, 153, 0.2);
            }

            .row-meta {
                display: flex; justify-content: space-between; align-items: center;
            }
            .region-name { font-size: 24px; font-weight: 800; color: #ffffff; }
            .region-val { font-family: "JetBrains Mono", monospace; font-size: 22px; font-weight: 800; color: #34d399; }
            .region-row.is-highlight .region-val { color: #facc15; }

            .bar-track {
                width: 100%; height: 10px; border-radius: 999px;
                background: rgba(255,255,255,0.08); overflow: hidden;
            }
            .bar-fill {
                height: 100%; border-radius: 999px;
                background: linear-gradient(90deg, #10b981, #34d399);
                transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            }
            .region-row.is-highlight .bar-fill {
                background: linear-gradient(90deg, #eab308, #facc15);
            }

            .footer-bar {
                position: relative; z-index: 5;
                display: flex; justify-content: space-between; align-items: center;
                border-top: 1px solid rgba(52, 211, 153, 0.2); padding-top: 16px;
                font-family: "JetBrains Mono", monospace; font-size: 14px; color: #94a3b8;
            }

            @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
            @keyframes rowIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
        </style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="5"
            data-width="1920"
            data-height="1080"
            data-composition-variables='{"kicker":"BÁO CÁO THỊ TRƯỜNG KHU VỰC","title":"Phân Bố Quy Mô Tăng Trưởng Toàn Quốc","subtitle":"Khảo sát số liệu thực địa giai đoạn 2025 – 2026","regions":"Miền Bắc:450 tỷ:48%|Miền Nam:360 tỷ:38%|Miền Trung:130 tỷ:14%","highlight_region":"Miền Bắc","source":"Cục Thống Kê & Báo Cáo Ngành 2026"}'
        >
            <div class="map-grid-bg"></div>

            <div class="header-bar">
                <div class="kicker-tag"><span class="kicker-txt"></span></div>
                <div class="main-title"></div>
                <div class="sub-title"></div>
            </div>

            <div class="stage-split">
                <div class="vector-map-panel">
                    <svg class="map-svg" viewBox="0 0 500 500">
                        <!-- Vietnam stylized regional curves -->
                        <path d="M 200,40 C 260,50 300,100 240,160 C 200,200 280,260 270,340 C 260,400 180,440 160,470" fill="none" stroke="#059669" stroke-width="45" stroke-linecap="round" />
                        <!-- Region Pins -->
                        <circle cx="230" cy="90" r="14" fill="#34d399" />
                        <circle cx="260" cy="240" r="12" fill="#facc15" />
                        <circle cx="210" cy="420" r="14" fill="#ef4444" />
                    </svg>
                </div>

                <div class="regions-container"></div>
            </div>

            <div class="footer-bar">
                <div class="source-txt"></div>
                <div class="geo-tag"></div>
            </div>
        </div>

        <script>
            (function () {
                var v = window.__hyperframes && typeof window.__hyperframes.getVariables === "function"
                    ? window.__hyperframes.getVariables() : {};
                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null && String(text).trim() !== "") el.textContent = String(text);
                };
                set(".kicker-txt", v.kicker);
                set(".main-title", v.title);
                set(".sub-title", v.subtitle);
                set(".source-txt", v.source ? "Nguồn: " + v.source : (v.source_note ? "Nguồn: " + v.source_note : ""));
                set(".geo-tag", "GEODATA · MULTI-REGION");

                var regionsStr = v.regions || "Miền Bắc:450 tỷ:48%|Miền Nam:360 tỷ:38%|Miền Trung:130 tỷ:14%";
                var highlight = (v.highlight_region || "").toLowerCase().trim();

                var container = document.querySelector(".regions-container");
                container.innerHTML = "";

                var items = String(regionsStr).split("|");
                items.forEach(function(item, idx) {
                    var parts = item.split(":");
                    if (parts.length >= 2) {
                        var name = parts[0].trim();
                        var stat = parts[1].trim();
                        var pct = parts[2] ? parts[2].trim() : "50%";
                        var pctNum = parseInt(pct, 10) || 50;

                        var isHl = highlight && name.toLowerCase().indexOf(highlight) !== -1;
                        if (!highlight && idx === 0) isHl = true;

                        var row = document.createElement("div");
                        row.className = "region-row" + (isHl ? " is-highlight" : "");
                        row.style.animationDelay = (0.3 + idx * 0.15) + "s";

                        row.innerHTML =
                            '<div class="row-meta">' +
                                '<div class="region-name">' + (isHl ? "✦ " : "") + name + '</div>' +
                                '<div class="region-val">' + stat + ' (' + pct + ')</div>' +
                            '</div>' +
                            '<div class="bar-track">' +
                                '<div class="bar-fill" style="width: 0%"></div>' +
                            '</div>';

                        container.appendChild(row);

                        setTimeout(function() {
                            var fill = row.querySelector(".bar-fill");
                            if (fill) fill.style.width = Math.min(100, Math.max(5, pctNum)) + "%";
                        }, 400 + idx * 150);
                    }
                });
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = window.__timelines["portrait"] = { pause: function () {}, seek: function () {}, paused: function () { return true; } };
        </script>
    </body>
</html>
