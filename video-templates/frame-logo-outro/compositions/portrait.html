<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1080, height=1920" />
        <title>Logo Outro · Portrait 9:16</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800;900&family=Inter:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            /*
   * frame-logo-outro — segmented logo assembly + glow bloom + tagline reveal.
   * Vendored from nexu-io/html-video (Apache-2.0) and adapted to HyperFrames 0.6:
   * Tailwind CDN replaced with plain CSS (deterministic, offline), Noto Sans SC
   * dropped, content moved to data-composition-variables. Inter Tight covers
   * Vietnamese. See NOTICE. Portrait 9:16 (1080×1920).
   */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                width: 1080px;
                height: 1920px;
                overflow: hidden;
            }
            #root {
                position: relative;
                width: 1080px;
                height: 1920px;
                background: radial-gradient(
                    circle at 50% 45%,
                    #1a1535 0%,
                    #08090c 70%
                );
                color: #f5f5f7;
                font-family: "Inter Tight", system-ui, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }
            .accent {
                color: #7c5cff;
            }

            .brand-bar {
                position: absolute;
                left: 0;
                right: 0;
                top: 160px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 22px;
                z-index: 5;
                animation: fadeUp 0.7s ease-out 0.3s both;
            }
            .brand-bar .logo-img {
                width: 96px;
                height: 96px;
                object-fit: contain;
            }
            .brand-bar .brand-label {
                font-size: 38px;
                font-weight: 700;
                letter-spacing: 1px;
                background: linear-gradient(90deg, #0cc0df 0%, #ffde59 100%);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }

            @keyframes pieceIn {
                0% {
                    opacity: 0;
                    transform: scale(1.4) translate(var(--dx, 0), var(--dy, 0));
                }
                100% {
                    opacity: 1;
                    transform: scale(1) translate(0, 0);
                }
            }
            @keyframes glow {
                from {
                    filter: drop-shadow(0 0 0 transparent);
                }
                to {
                    filter: drop-shadow(0 0 48px rgba(124, 92, 255, 0.6));
                }
            }
            .logo-wrap {
                position: relative;
                width: 240px;
                height: 240px;
                animation: glow 0.8s ease-out 1.1s both;
            }
            .logo-wrap svg {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }
            .piece {
                transform-box: fill-box;
                transform-origin: center;
                animation: pieceIn 1s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            }
            .piece:nth-child(1) {
                --dx: -80px;
                --dy: -40px;
                animation-delay: 0s;
            }
            .piece:nth-child(2) {
                --dx: 60px;
                --dy: -50px;
                animation-delay: 0.08s;
            }
            .piece:nth-child(3) {
                --dx: -40px;
                --dy: 50px;
                animation-delay: 0.16s;
            }
            .piece:nth-child(4) {
                --dx: 0;
                --dy: -70px;
                animation-delay: 0.24s;
            }
            .piece:nth-child(5) {
                --dx: 70px;
                --dy: 40px;
                animation-delay: 0.32s;
            }

            @keyframes fadeUp {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .brand {
                margin-top: 64px;
                font-weight: 900;
                letter-spacing: -2px;
                line-height: 0.95;
                font-size: 118px;
                text-align: center;
                max-width: 940px;
                animation: fadeUp 0.8s ease-out 1.4s both;
            }
            .tagline {
                margin-top: 28px;
                font-size: 38px;
                opacity: 0.72;
                font-weight: 500;
                text-align: center;
                max-width: 820px;
                line-height: 1.35;
                animation: fadeUp 0.8s ease-out 1.7s both;
            }
            .meta {
                margin-top: 70px;
                display: flex;
                align-items: center;
                gap: 22px;
                font-size: 22px;
                text-transform: uppercase;
                letter-spacing: 4px;
                opacity: 0.55;
                font-weight: 500;
                animation: fadeUp 0.6s ease-out 2.1s both;
            }

            /* one-shot shimmer over the brand name */
            @keyframes shimmer {
                0% {
                    background-position: -200% 0;
                }
                100% {
                    background-position: 200% 0;
                }
            }
            .shimmer {
                background: linear-gradient(
                    120deg,
                    #f5f5f7 30%,
                    rgba(255, 255, 255, 0.45) 50%,
                    #f5f5f7 70%
                );
                background-size: 200% 100%;
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                animation: shimmer 1.8s ease-out 1.9s 1 both;
            }

            .corner {
                position: absolute;
                bottom: 60px;
                font-size: 18px;
                font-family: "Inter", monospace;
                opacity: 0.32;
                text-transform: uppercase;
                letter-spacing: 4px;
                animation: fadeUp 0.6s ease-out 2.3s both;
            }
            .corner.left {
                left: 70px;
            }
            .corner.right {
                right: 70px;
            }
        
  /* AMBIENT LAYER — skills/motion-craft, "Two layers" */
  /* The CONTENT layer still settles by ~2s so everything stays readable; this is the
     canvas, which never dies. inset -10% keeps the moving edge outside the frame — a
     gradient that drifts within its own box shows you its own boundary. */
  #root::after {
    content: ""; position: absolute; inset: -10%;
    pointer-events: none; z-index: 0;
    background: radial-gradient(38% 26% at 50% 42%, rgba(255,235,180,.07), transparent 72%);
    animation: ambHalo 10s ease-in-out infinite alternate;
  }
  @keyframes ambHalo { from { opacity: .45; transform: scale(.99); } to { opacity: 1; transform: scale(1.02); } }

  /* LOGO IMAGE — supplied via the scene's media block */
  /* No filter and no recolour: a brand mark is the one thing in the frame that must arrive
     exactly as its owner drew it. */
  .logo-wrap img.logo-img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain;
    border-radius: 12px;
  }
</style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="5"
            data-width="1080"
            data-height="1920"
            data-composition-variables='{"brand_name":"Tên kênh của bạn","tagline":"Một dòng mô tả","primary_url":"","corner_left":"Theo dõi","corner_right":"Hết"}'
        >
            <!-- brand-bar removed in content-agent-kit — see the hero template's note. -->

            <div class="logo-wrap">
                <svg data-media-fallback viewBox="0 0 140 140" fill="none" style="display:none">
                    <!-- "</>" code glyph, assembled from 3 pieces -->
                    <path
                        class="piece"
                        d="M50 34 L22 70 L50 106"
                        stroke="#7c5cff"
                        stroke-width="14"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                    <path
                        class="piece"
                        d="M80 26 L60 114"
                        stroke="#f5f5f7"
                        stroke-width="14"
                        stroke-linecap="round"
                    />
                    <path
                        class="piece"
                        d="M90 34 L118 70 L90 106"
                        stroke="#7c5cff"
                        stroke-width="14"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
                <!-- The brand mark, when the scene supplies one. It sits ON TOP of the
                     glyph rather than replacing it: built in JS, the swap raced the
                     renderer's screenshot and the placeholder glyph shipped instead of
                     the channel logo. In the markup, hyperframes waits for it like any
                     other image, and a missing file just falls back to the glyph. -->
                <img class="logo-img" src="assets/media.png" alt=""
                     onerror="this.style.display='none';var s=this.parentNode.querySelector('svg');if(s)s.style.display=''">
            </div>

            <h1 class="brand"><span class="shimmer"></span></h1>
            <p class="tagline"></p>
            <div class="meta"><span class="meta-url"></span></div>

            <!--
              Corners are slots now rather than fixed text. The 9:16 pair defaults to the
              generic "Theo dõi" / "Hết" it always showed — no brand in it, so keeping the
              default is safe — while 16:9 defaults to empty because its corners carried
              the upstream author's channel name and sign-off.
            -->
            <div class="corner left"></div>
            <div class="corner right"></div>
        </div>

        <script>
            (function () {
                var v =
                    window.__hyperframes &&
                    typeof window.__hyperframes.getVariables === "function"
                        ? window.__hyperframes.getVariables()
                        : {};
                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null) el.textContent = String(text);
                };
                // Optional slots: fill `sel`, but drop `dropSel` entirely when there is
                // nothing to show. Leaving the element in place would keep its margin and
                // shift the layout for a line the viewer never sees.
                var optional = function (sel, text, dropSel) {
                    var el = document.querySelector(sel);
                    if (!el) return;
                    if (text == null || String(text).trim() === "") {
                        var drop = dropSel ? document.querySelector(dropSel) : el;
                        if (drop) drop.remove();
                    } else {
                        el.textContent = String(text);
                    }
                };
                set(".brand .shimmer", v.brand_name);
                set(".tagline", v.tagline);
                optional(".meta-url", v.primary_url, ".meta");
                optional(".corner.left", v.corner_left);
                optional(".corner.right", v.corner_right);
            })();
            // A real brand mark, when the scene supplies one. The built-in SVG glyph is
                // the stand-in and stays in the markup ahead of this — a channel that passes
                // no logo still gets a mark rather than a hole.
                /* logo now lives in the markup above */

            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = window.__timelines["portrait"] = {
                pause: function () {},
                seek: function () {},
                paused: function () {
                    return true;
                },
            };
        </script>
    </body>
</html>
