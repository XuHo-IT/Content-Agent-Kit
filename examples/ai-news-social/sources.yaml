# AI-news sources for the example agent. Point these at real index/listing pages and
# tune each link_pattern. Verify with: python scripts/crawl/crawl.py --dry-run
# COPYRIGHT: crawler stores excerpt(<=1500) + link only; the agent writes ORIGINAL text.

max_per_run: 6

web:
  - name: "Example AI News"
    list_url: "https://example.com/ai"          # <-- replace with a real listing page
    link_pattern: "/ai/[^/]+$"                   # <-- regex for ARTICLE urls (not nav)
    lang: en
    max_per_run: 3

  - name: "Example Research Blog"
    list_url: "https://research.example.org/blog"
    link_pattern: "/blog/[0-9]{4}/[^/]+$"
    lang: en
    max_per_run: 3

# Tips:
# - Prefer official blogs / press pages / permitted feeds. Respect robots.txt + ToS.
# - A too-loose link_pattern will grab menu/footer links — always dry-run first.
