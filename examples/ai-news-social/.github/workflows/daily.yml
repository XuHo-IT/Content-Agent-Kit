# Daily discovery for the AI News Social Agent (crawl4ai on GitHub Actions cron).
# Add secrets in repo Settings → Secrets: SITE_URL, INGEST_API_TOKEN.
name: ai-news-daily-crawl

on:
  schedule:
    - cron: "0 22 * * *"     # 22:00 UTC daily (≈ 05:00 Asia/Ho_Chi_Minh)
  workflow_dispatch: {}

jobs:
  crawl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/crawl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install crawl4ai
        run: |
          pip install -r requirements.txt
          crawl4ai-setup
      - name: Crawl AI-news → idea queue
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
        run: python crawl.py --sources ../../examples/ai-news-social/sources.yaml
      - name: Upload debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queue_raw
          path: scripts/crawl/queue_raw.json
          if-no-files-found: ignore

# The publishing/social step runs from the agent (daily-run skill or scheduled prompt),
# not here — GitHub Actions only does the crawl discovery on schedule.
