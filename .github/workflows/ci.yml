name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch to keep queues short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Scripts (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # There is deliberately no `npm ci` step: this kit ships no package.json and no
      # dependencies. Everything below runs on a bare Node install, offline, with no keys.

      # A .gitignore rule meant for build artifacts once swallowed scripts/media/ — the
      # source directory for the whole media layer. Nine files were silently left out of a
      # commit and every job below failed with "module not found". Locally everything
      # worked, because the files were there. This catches that class of bug at the source.
      - name: No source file is gitignored
        run: |
          missing=$(git ls-files --others --ignored --exclude-standard \
                    -- 'scripts/**' 'video-templates/**' 'templates/**' 'docs/**' 'skills/**' 'examples/**')
          if [ -n "$missing" ]; then
            echo "::error::these source files exist but .gitignore excludes them:"
            echo "$missing"
            exit 1
          fi
          echo "clean"

      - name: Every script parses
        run: |
          fail=0
          for f in $(find scripts -name "*.mjs" | sort); do
            node -c "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done
          exit $fail

      - name: Every CLI loads and answers --help
        run: |
          fail=0
          for f in scripts/*.mjs scripts/*/*.mjs; do
            case "$f" in scripts/lib/*|*/lib/*) continue ;; esac
            node "$f" --help >/dev/null 2>&1 || { echo "::error file=$f::--help failed"; fail=1; }
          done
          exit $fail

      - name: Unit tests
        run: node --test tests/*.test.mjs

      # The reference script is what the AI copies. If it stops being clean, every agent
      # scaffolded from this kit starts from a bad example.
      - name: Reference script.json is clean in strict mode
        run: node scripts/video/validate-script.mjs templates/VIDEO_SCRIPT.template.json --strict

      # Same reasoning, for the written output. The sample post shipped for months with a
      # "Meta:" / "Slug:" block and Markdown headings in the caption body — text a reader
      # sees verbatim, because no social platform renders Markdown. An agent copying that
      # sample copies the bug, so the sample has to stay clean under --strict.
      - name: Sample posts are plain text in strict mode
        run: |
          fail=0
          for f in examples/ai-news-social/sample-output/post.json \
                   examples/ai-video-social/sample-post/post.json; do
            node scripts/social/validate-post.mjs "$f" --strict || { echo "::error file=$f::not plain text"; fail=1; }
          done
          exit $fail

      # Hand-written AWS SigV4. Checked against AWS's own published vector — no bucket,
      # no credentials, no network.
      - name: R2 signer matches the AWS reference vector
        run: node scripts/media/host-check.mjs --selftest

      # Theming rewrites colours inside every template. A runner has no Chrome and no
      # ffmpeg, but the rules are pure arithmetic and string rewriting — and each case
      # here is a bug that shipped once, so they are worth pinning.
      - name: Theme recolour rules hold
        run: node scripts/video/theme-probe.mjs --selftest

      # Every composition must have a measured canvas, or a themed render silently flips
      # the wrong way. Adding a template means re-running theme-probe.mjs.
      - name: Every template has a measured canvas
        run: |
          node -e "
            const fs = require('node:fs');
            const map = JSON.parse(fs.readFileSync('video-templates/theme-map.json','utf8')).canvases;
            const missing = [];
            for (const id of fs.readdirSync('video-templates', {withFileTypes:true})
                               .filter(d => d.isDirectory()).map(d => d.name)) {
              for (const f of ['index.html','compositions/portrait.html']) {
                if (fs.existsSync(\`video-templates/\${id}/\${f}\`) && !map[\`\${id}/\${f}\`]) missing.push(\`\${id}/\${f}\`);
              }
            }
            if (missing.length) {
              console.error('::error::not in theme-map.json: ' + missing.join(', ') +
                            ' — run: node scripts/video/theme-probe.mjs');
              process.exit(1);
            }
            console.log('all ' + Object.keys(map).length + ' compositions measured');
          "

      - name: Registries load and agree with the validator
        run: |
          node -e "
            const p = await import('./scripts/video/lib/tts.mjs');
            const s = await import('./scripts/media/lib/sources/index.mjs');
            const h = await import('./scripts/lib/media-hosts/index.mjs');
            const t = await import('./scripts/video/lib/paths.mjs');
            if (!p.PROVIDERS.length || !s.SOURCE_IDS.length || !h.HOST_IDS.length) throw new Error('empty registry');
            if (t.listTemplateIds().length < 18) throw new Error('templates missing');
            console.log('tts:', p.PROVIDERS.join(','));
            console.log('stock:', s.SOURCE_IDS.join(','));
            console.log('hosts:', h.HOST_IDS.join(','));
            console.log('scene templates:', t.listTemplateIds().length);
          " --input-type=module

      # Apache-2.0 requires the notice to travel with the work. A template folder without
      # one is a licence violation, not a style nit.
      - name: Every vendored template keeps its NOTICE
        run: |
          fail=0
          for d in video-templates/*/; do
            [ -f "$d/NOTICE.md" ] || { echo "::error::missing NOTICE.md in $d"; fail=1; }
          done
          [ -f NOTICE.md ] || { echo "::error::missing root NOTICE.md"; fail=1; }
          exit $fail

      # §4(a) goes further than attribution: a copy of the licence itself has to
      # ship with the work. Attribution without the licence text is still a breach.
      - name: Apache-2.0 text ships with the vendored templates
        run: |
          f=LICENSES/Apache-2.0.txt
          [ -f "$f" ] || { echo "::error::missing $f — Apache-2.0 §4(a) requires it"; exit 1; }
          grep -q "TERMS AND CONDITIONS FOR USE" "$f" || { echo "::error::$f is not the Apache-2.0 text"; exit 1; }

      - name: No secrets committed
        run: |
          if git grep -nE "hook\.(eu|us)[0-9]*\.make\.com/[a-z0-9]|Bearer [A-Za-z0-9_-]{16,}|R2_SECRET_ACCESS_KEY[[:space:]]*=[[:space:]]*.|xi-api-key: [A-Za-z0-9]{12,}" -- . ':!*.example' ':!SECURITY.md' ':!CONTRIBUTING.md' ':!.github/workflows'; then
            echo "::error::a credential-shaped string is committed"
            exit 1
          fi
          echo "clean"

  crawler:
    name: Python crawler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: crawl.py compiles
        run: python -m py_compile scripts/crawl/crawl.py
